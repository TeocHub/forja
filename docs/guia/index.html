<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guía de Forja</title>
<meta name="description" content="Cómo funciona Forja, estación por estación, con ejemplos para probar.">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: guía — buscador arriba, el recorrido de una idea como una línea de estaciones; cada estación abre su lámina (explicación + demo real), y debajo cuenta, datos y dudas */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:where(button,a,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g-hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:end;margin:18px 0 8px}
.g-k{font-family:var(--f-num);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.g-hero h1{font-family:var(--f-display);font-size:clamp(34px,6vw,60px);line-height:1;margin:8px 0 12px;letter-spacing:-.01em}
.g-hero p{margin:0;color:var(--muted);max-width:56ch;font-size:17px}
.g-busca{position:relative}
.g-busca label{display:block;font-family:var(--f-display);font-weight:700;margin-bottom:8px}
.g-busca input{width:100%;font:inherit;font-size:17px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:13px 16px}
.g-busca input:focus{border-color:var(--accent)}
.g-res[hidden]{display:none}
.g-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(10,14,30,.16);padding:6px;display:flex;flex-direction:column}
.g-res button{font:inherit;text-align:left;display:flex;gap:10px;align-items:flex-start;border:0;background:none;color:var(--fg);border-radius:10px;padding:9px 10px;cursor:pointer}
.g-res button:hover,.g-res button:focus-visible{background:var(--field)}
.g-res svg{flex:none;color:var(--accent);margin-top:3px}
.g-res span{display:flex;flex-direction:column}
.g-res small{color:var(--muted);font-size:13px;line-height:1.35}
.g-res p{margin:8px 10px;color:var(--muted);font-size:14px}
.g-sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.g-sug button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.g-sug button:hover{border-color:var(--accent);color:var(--accent)}
.g-h2{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:56px 0 18px;display:flex;align-items:center;gap:14px}
.g-h2::after{content:"";flex:1;height:1px;background:var(--line)}
.g-linea{position:relative;display:flex;justify-content:space-between;gap:4px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 10px;scroll-snap-type:x proximity}
.g-linea::-webkit-scrollbar{display:none}
.g-linea::before{content:"";position:absolute;left:34px;right:34px;top:30px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--hecho,0%),var(--line) var(--hecho,0%))}
.g-est{position:relative;flex:1 0 76px;display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:0;scroll-snap-align:center}
.g-est .p{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);color:var(--muted);transition:transform .15s,border-color .15s}
.g-est:hover .p{transform:translateY(-2px);border-color:var(--accent);color:var(--accent)}
.g-est .n{font-family:var(--f-num);font-size:10.5px;letter-spacing:.08em}
.g-est b{font-weight:700;color:var(--fg);font-size:13.5px;white-space:nowrap}
.g-est.visto .p{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));color:var(--accent)}
.g-est[aria-selected=true] .p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--accent-soft)}
.g-est[aria-selected=true] b{color:var(--accent)}
.g-lamina{margin-top:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;min-height:420px}
.g-lamina.sola{grid-template-columns:minmax(0,1fr)}
.g-lamina .ay-tema h2{font-size:32px}
.g-demo{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.g-demo-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted)}
.g-demo-cab b{font-family:var(--f-num);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.g-nav{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.g-nav button{font:inherit;font-size:14px;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:700;padding:0}
.g-nav button:disabled{visibility:hidden}
@media (max-width:860px){.g-hero{grid-template-columns:1fr}.g-lamina{grid-template-columns:minmax(0,1fr);padding:18px}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.chip{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip{cursor:default;background:var(--field)}
.d-plantillas{display:flex;flex-wrap:wrap;gap:6px}
.d-plantillas span{font-size:14px;border-radius:10px;padding:7px 11px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tc)}
.d-preg{font-family:var(--f-display);font-size:19px;line-height:1.3;min-height:3.9em;margin:0}
.d-txt{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;min-height:110px;resize:vertical;width:100%}
.d-fila{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.d-etapas{display:flex;gap:4px;flex-wrap:wrap}
.d-etapas button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:3px 8px;cursor:pointer}
.d-etapas button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.d-ref{display:flex;gap:8px}
.d-ref input{flex:1;min-width:0;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 11px}
.d-ref-res{border:1px dashed var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;min-height:86px}
.d-ref-res .mu{width:72px;height:56px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--field);font-size:22px;overflow:hidden}
.d-ref-res .mu img{width:100%;height:100%;object-fit:cover}
.d-ref-res b{display:block;font-family:var(--f-display)}
.d-ref-res small{color:var(--muted)}
.d-radar{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.d-radar svg{width:100%;height:auto;max-height:300px}
.d-top{display:flex;gap:6px;flex-wrap:wrap}
.d-top span{font-size:13.5px;border-radius:999px;padding:4px 11px;background:var(--card);border:1px solid var(--line)}
.d-top span:first-child{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.d-q{margin:0;font-size:14px;color:var(--muted);min-height:2.6em}
.d-calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.d-calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.d-calc input{font:inherit;font-family:var(--f-num);font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:7px 9px;width:100%}
.d-precio{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.d-precio b{font-family:var(--f-display);font-size:36px;line-height:1}
.d-precio small{color:var(--muted);font-size:13px}
.d-barra{display:flex;height:30px;border-radius:9px;overflow:hidden;font-size:11.5px;font-weight:700;color:#fff}
.d-barra span{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-grow .25s}
.d-ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.d-ley i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.d-ops{display:flex;flex-direction:column;gap:8px}
.d-op{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.d-op .f{text-align:center;line-height:1.05}
.d-op .f b{display:block;font-family:var(--f-num);font-size:20px}
.d-op .f small{font-size:11px;color:var(--muted);text-transform:uppercase}
.d-op .t b{display:block;font-size:14.5px;line-height:1.3}
.d-op .t small{color:var(--muted);font-size:12.5px}
.d-marco{height:420px;overflow:auto;border-radius:12px;border:1px solid var(--line);container-type:inline-size}
.d-marco .vt{font-size:15px}
.d-marco .vt-hero{min-height:300px}
.d-marco .vt-hero-txt{padding-top:60px}
.d-marco .vt h1{font-size:44px}
.d-pags{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;min-height:120px}
.d-pag{width:58px;height:78px;border-radius:5px;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 6px rgba(10,14,30,.06);display:flex;flex-direction:column;gap:4px;padding:8px 7px;transition:opacity .2s,transform .2s}
.d-pag i{display:block;height:4px;border-radius:2px;background:var(--line)}
.d-pag i:first-child{background:var(--accent);width:70%}
.d-pag.fuera{opacity:.18;transform:scale(.92)}
.d-nota{margin:0;font-size:12.5px;color:var(--muted)}
.g-cuenta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.g-cuenta button{font:inherit;text-align:left;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:16px;padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s}
.g-cuenta button:hover{border-color:var(--accent);transform:translateY(-2px)}
.g-cuenta button[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.g-cuenta svg{color:var(--accent)}
.g-cuenta b{font-family:var(--f-display);font-size:16px}
.g-cuenta small{color:var(--muted);font-size:13.5px;line-height:1.4}
.g-dudas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:760px){.g-dudas{grid-template-columns:1fr}}
.g-dudas details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.g-dudas summary{cursor:pointer;padding:13px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
.g-dudas summary::-webkit-details-marker{display:none}
.g-dudas summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
.g-dudas details[open] summary::after{content:"−"}
.g-dudas p{margin:0 0 14px;color:var(--muted);font-size:15px}
.g-cta{margin-top:56px;border-radius:22px;padding:28px;background:var(--fg);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.g-cta h2{font-family:var(--f-display);font-size:26px;margin:0}
.g-cta p{margin:4px 0 0;opacity:.75}
.g-cta a{background:var(--bg);color:var(--fg);text-decoration:none;font-weight:700;border-radius:12px;padding:11px 18px}
@media (prefers-reduced-motion:reduce){.g-est .p,.g-cuenta button,.d-pag,.d-barra span{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main>
    <section class="g-hero">
      <div><span class="g-k">Guía</span><h1>Cómo funciona Forja</h1><p>Forja acompaña una idea desde su primera frase hasta mostrarla al mundo. Recorre el camino estación por estación, prueba cada herramienta aquí mismo y vuelve cuando la necesites.</p></div>
      <div class="g-busca"><label for="g-q">¿Qué quieres hacer?</label><input id="g-q" type="search" autocomplete="off" placeholder="Ej.: calcular el precio de mi juego" aria-controls="g-res" aria-expanded="false"><div class="g-res" id="g-res" hidden></div>
        <div class="g-sug" id="g-sug"></div></div>
    </section>
    <h2 class="g-h2" id="recorrido">El recorrido de una idea</h2>
    <div class="g-linea" role="tablist" aria-label="Estaciones del recorrido" id="g-linea"></div>
    <article class="g-lamina" id="g-lamina" role="tabpanel" aria-live="polite"></article>
    <h2 class="g-h2">Tu cuenta y tus datos</h2>
    <div class="g-cuenta" id="g-cuenta"></div>
    <h2 class="g-h2">Dudas comunes</h2>
    <div class="g-dudas" id="g-dudas"></div>
    <div id="g-cta"></div>
  </main>
</div>
<script type="module">
import { sb, nav, navApp } from "../js/forja.js";
import { TEMAS, tema, temaHTML, buscar, icono, CSS_AYUDA } from "../js/ayuda.js";
import { TIPOS, SECCIONES, PLANTILLA, ETAPAS, etapaDe } from "../js/guias.js";
import { EJES, radar, lectura, base, pct, CSS_BRUJULA } from "../js/brujula.js";
import { montar } from "../js/pizarra.js";
import { pintarVitrina, detectar, yt, CSS_VITRINA } from "../js/vitrina.js";
document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_AYUDA + CSS_BRUJULA + CSS_VITRINA + "</style>");
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
let SES = null, CTX = { p: null };
try { CTX.p = localStorage.getItem("forja-ultimo-proyecto"); } catch (e) {}
const { data } = await sb.auth.getSession(); SES = data.session;
if (SES) navApp(null); else nav("guia");

const LINEA = TEMAS.filter((t) => t.linea), OTROS = TEMAS.filter((t) => !t.linea);
const CORTO = { plantar: "Plantar", taller: "Taller", referentes: "Referentes", brujula: "Brújula", pizarra: "Pizarra", costos: "Costos", oportunidades: "Oportunidades", vitrina: "Vitrina", biblia: "Biblia" };
let actual = null, limpiar = null;
const vistos = new Set(); try { JSON.parse(sessionStorage.getItem("forja-guia-vistos") || "[]").forEach((x) => vistos.add(x)); } catch (e) {}

/* ---------- recorrido ---------- */
$("g-linea").innerHTML = LINEA.map((t, i) => '<button type="button" class="g-est" role="tab" id="est-' + t.id + '" data-t="' + t.id + '" aria-controls="g-lamina"><span class="p">' + icono(t.id, 22) + '</span><span class="n">' + String(i + 1).padStart(2, "0") + "</span><b>" + CORTO[t.id] + "</b></button>").join("");
$("g-linea").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => abrir(b.dataset.t, true));
$("g-cuenta").innerHTML = OTROS.map((t) => '<button type="button" data-t="' + t.id + '" aria-pressed="false">' + icono(t.id, 22) + "<b>" + esc(t.n) + "</b><small>" + esc(t.corto) + "</small></button>").join("");
$("g-cuenta").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { abrir(b.dataset.t, true); $("g-lamina").scrollIntoView({ behavior: "smooth", block: "start" }); });

function abrir(id, empujar) {
  const t = tema(id); if (!t) return;
  if (limpiar) { limpiar(); limpiar = null; }
  actual = id; vistos.add(id); try { sessionStorage.setItem("forja-guia-vistos", JSON.stringify([...vistos])); } catch (e) {}
  const i = LINEA.findIndex((x) => x.id === id);
  $("g-linea").querySelectorAll("[data-t]").forEach((b) => { b.setAttribute("aria-selected", String(b.dataset.t === id)); b.classList.toggle("visto", vistos.has(b.dataset.t)); });
  $("g-cuenta").querySelectorAll("[data-t]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === id)));
  $("g-linea").style.setProperty("--hecho", i >= 0 ? (i / (LINEA.length - 1)) * 100 + "%" : "0%");
  const conDemo = !!DEMOS[id];
  $("g-lamina").className = "g-lamina" + (conDemo ? "" : " sola");
  $("g-lamina").setAttribute("aria-labelledby", i >= 0 ? "est-" + id : "");
  $("g-lamina").innerHTML = '<div>' + temaHTML(t, CTX, { conIr: !!SES || !t.ir }) + (!SES && t.ir ? '<p class="d-nota" style="margin-top:14px"><a href="../entrar/">Crea tu cuenta gratis</a> para usarlo en tus proyectos.</p>' : "") + "</div>" +
    (conDemo ? '<div class="g-demo"><div class="g-demo-cab"><b>Pruébalo aquí</b><span>Es una demostración: no se guarda.</span></div><div id="g-demo-c"></div></div>' : "") +
    (i >= 0 ? '<div class="g-nav"><button type="button" id="g-ant"' + (i ? "" : " disabled") + ">← " + (i ? CORTO[LINEA[i - 1].id] : "") + '</button><button type="button" id="g-sig"' + (i < LINEA.length - 1 ? "" : " disabled") + ">" + (i < LINEA.length - 1 ? CORTO[LINEA[i + 1].id] : "") + " →</button></div>" : "");
  if (i >= 0) {
    $("g-ant").onclick = () => abrir(LINEA[i - 1].id, true);
    $("g-sig").onclick = () => abrir(LINEA[i + 1].id, true);
    const est = $("est-" + id); est.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  }
  if (conDemo) { const r = DEMOS[id]($("g-demo-c")); limpiar = typeof r === "function" ? r : null; }
  if (empujar) history.replaceState(null, "", "#" + id);
}

/* ---------- demos: las piezas reales de Forja, sin guardar nada ---------- */
const DEMOS = {
  plantar(c) {
    const tipos = Object.entries(TIPOS);
    const pintar = (k) => {
      c.innerHTML = '<p class="d-nota" style="font-size:14px;color:var(--fg)">¿Qué estás creando?</p><div class="chips">' + tipos.map(([t, n]) => '<button type="button" data-k="' + t + '" aria-pressed="' + (t === k) + '">' + n + "</button>").join("") + "</div>" +
        '<p class="d-nota">Tu Taller empezaría con estas secciones, cada una con sus preguntas guía:</p><div class="d-plantillas" style="--tc:var(--t-' + k + ')">' + (PLANTILLA[k] || []).map((s) => "<span>" + esc((SECCIONES[s] || { t: s }).t) + "</span>").join("") + "</div>";
      c.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => pintar(b.dataset.k));
    };
    pintar("videojuego");
  },
  taller(c) {
    const ops = ["premisa", "personajes", "bucle", "turno"].filter((k) => SECCIONES[k]);
    let s = ops[0], qi = 0, et = 25;
    const pintar = () => {
      const q = SECCIONES[s].p;
      c.innerHTML = '<div class="chips">' + ops.map((k) => '<button type="button" data-s="' + k + '" aria-pressed="' + (k === s) + '">' + esc(SECCIONES[k].t) + "</button>").join("") + "</div>" +
        '<p class="d-preg">' + esc(q[qi % q.length]) + '</p><div class="d-fila"><span>Pregunta guía ' + ((qi % q.length) + 1) + " de " + q.length + '</span><button type="button" class="chip" id="d-otra" style="cursor:pointer">Otra pregunta</button></div>' +
        '<textarea class="d-txt" id="d-txt" placeholder="Escribe aquí tu respuesta…"></textarea>' +
        '<div class="d-fila"><span id="d-pal">0 de 20.000 palabras</span><span class="d-etapas">' + ETAPAS.map(([v, n]) => '<button type="button" data-e="' + v + '" aria-pressed="' + (v === et) + '">' + n + "</button>").join("") + "</span></div>" +
        '<div class="fx-avance" title="Avance de la sección"><i style="width:' + et + '%"></i></div>';
      c.querySelectorAll("[data-s]").forEach((b) => b.onclick = () => { s = b.dataset.s; qi = 0; pintar(); });
      $("d-otra").onclick = () => { qi++; c.querySelector(".d-preg").textContent = q[qi % q.length]; c.querySelector(".d-fila span").textContent = "Pregunta guía " + ((qi % q.length) + 1) + " de " + q.length; };
      $("d-txt").oninput = (e) => { const n = (e.target.value.trim().match(/\S+/g) || []).length; $("d-pal").textContent = n.toLocaleString("es-CL") + " de 20.000 palabras"; };
      c.querySelectorAll("[data-e]").forEach((b) => b.onclick = () => { et = +b.dataset.e; c.querySelectorAll("[data-e]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); c.querySelector(".fx-avance i").style.width = et + "%"; });
    };
    pintar();
  },
  referentes(c) {
    const ej = [["Un color", "#2a9d8f"], ["Un video", "https://www.youtube.com/watch?v=aqz-KE-bpKQ"], ["Una canción", "https://open.spotify.com/track/4uLU6hMCjMI75M1A2tKUQC"], ["Una página", "https://es.wikipedia.org/wiki/Valpara%C3%ADso"]];
    c.innerHTML = '<div class="d-ref"><input id="d-r" placeholder="Pega un enlace o un color #hex" aria-label="Enlace o color"></div><div class="chips">' + ej.map(([n, v]) => '<button type="button" data-v="' + esc(v) + '">' + n + "</button>").join("") + '</div><div class="d-ref-res" id="d-rr"><span class="mu">✦</span><span><b>Forja reconoce qué es</b><small>Prueba pegando cualquier enlace o un color.</small></span></div>';
    const ver = (v) => {
      const d = detectar(v), r = $("d-rr");
      if (!v.trim()) return;
      if (!d) { r.innerHTML = '<span class="mu">?</span><span><b>No lo reconozco</b><small>Los enlaces deben empezar con https:// y los colores con # (seis dígitos).</small></span>'; return; }
      const N = { color: "Color", video: "Video", audio: "Audio", imagen: "Imagen", enlace: "Enlace" }[d.tipo];
      const mu = d.tipo === "color" ? '<span class="mu" style="background:' + d.valor + '"></span>' : d.tipo === "imagen" ? '<span class="mu"><img src="' + esc(d.valor) + '" alt="" referrerpolicy="no-referrer"></span>' : '<span class="mu">' + ({ video: "▶", audio: "♪", enlace: "↗" })[d.tipo] + "</span>";
      r.innerHTML = mu + "<span><b>" + N + (d.tipo === "video" && yt(d.valor) ? " de YouTube" : "") + "</b><small>" + (d.tipo === "color" ? d.valor.toUpperCase() + " · se suma a la paleta del proyecto" : d.tipo === "enlace" ? "Se guarda como enlace con su título y nota." : "Se carga solo cuando lo tocas, para no gastar datos.") + "</small></span>";
    };
    $("d-r").oninput = (e) => ver(e.target.value);
    c.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => { $("d-r").value = b.dataset.v; ver(b.dataset.v); });
  },
  brujula(c) {
    let ejes = {}; const b = base("historia");
    c.innerHTML = '<div class="d-radar"><svg id="d-radar"></svg><p class="d-q" id="d-q">Mueve los puntos de cada eje. Toca o arrastra.</p><div class="d-top" id="d-top"></div></div>';
    const top = () => { $("d-top").innerHTML = lectura(ejes, b).slice(0, 3).map((f) => "<span>" + esc(f.n) + " " + pct(f.s) + "</span>").join(""); };
    radar($("d-radar"), () => ejes, (e) => { ejes = e; top(); }, $("d-q"), () => b);
    top();
  },
  pizarra(c) {
    c.innerHTML = '<div id="d-pz"></div>';
    const datos = { tarjetas: [{ id: "a", x: 0, y: 40, titulo: "La capitana", sub: "protagonista", texto: "Busca a su padre bajo el agua.", color: "#2a3fd1" }, { id: "b", x: 320, y: 0, titulo: "El contrabandista", sub: "aliado", texto: "Sabe más de lo que dice.", color: "#e0602f" }, { id: "c", x: 170, y: 250, titulo: "La guardiana", sub: "antagonista", texto: "Protege la campana.", color: "#0f7a4f" }],
      flechas: [{ id: "f1", de: "a", a: "b", lazo: "amistad", dir: "nada", texto: "" }, { id: "f2", de: "b", a: "c", lazo: "secreto", dir: "nada", texto: "" }, { id: "f3", de: "c", a: "a", lazo: "rivalidad", dir: "nada", texto: "" }] };
    const ed = montar($("d-pz"), { piz: { id: "guia-demo", nombre: "Demo", modo: "relaciones", datos }, editable: true, max: 12, secciones: [], referentes: [], guardar: async () => null, aviso: () => {}, alLimite: () => {} });
    return () => ed.destruir();
  },
  costos(c) {
    c.innerHTML = '<div class="d-calc"><label>Costo de producir una unidad ($)<input id="c-c" type="number" inputmode="numeric" value="6500" min="0" step="100"></label><label>Comisión de venta (%)<input id="c-com" type="number" inputmode="decimal" value="3.5" min="0" max="50" step="0.5"></label><label>Reinversión (%)<input id="c-r" type="number" inputmode="decimal" value="10" min="0" step="5"></label><label>Ganancia (%)<input id="c-g" type="number" inputmode="decimal" value="40" min="0" step="5"></label></div>' +
      '<div class="d-precio"><span><small>Precio sugerido</small><br><b id="c-p">—</b></span><small id="c-d"></small></div><div class="d-barra" id="c-bar"></div><div class="d-ley"><span><i style="background:#5b6275"></i>Costo</span><span><i style="background:#2a3fd1"></i>Reinversión</span><span><i style="background:#0f7a4f"></i>Ganancia</span><span><i style="background:#e0602f"></i>Comisión y redondeo</span></div>' +
      '<p class="d-nota">En tu cotización real, el costo sale solo de los precios de tus proveedores, con IVA, envío y dólar.</p>';
    const f = () => {
      const C = Math.max(0, +$("c-c").value || 0), com = Math.min(60, Math.max(0, +$("c-com").value || 0)) / 100, r = Math.max(0, +$("c-r").value || 0), g = Math.max(0, +$("c-g").value || 0);
      const exacto = C * (1 + (r + g) / 100) / (1 - com), P = Math.max(990, Math.ceil((exacto + 10) / 1000) * 1000 - 10);
      const partes = [[C, "#5b6275", "Costo"], [C * r / 100, "#2a3fd1", "Reinv."], [C * g / 100, "#0f7a4f", "Ganancia"], [P - C * (1 + (r + g) / 100), "#e0602f", ""]];
      $("c-p").textContent = "$" + P.toLocaleString("es-CL");
      $("c-d").textContent = "Te quedan $" + Math.round(P * (1 - com) - C).toLocaleString("es-CL") + " por unidad después de comisión";
      $("c-bar").innerHTML = partes.map(([v, col, n]) => '<span style="flex-grow:' + Math.max(0, v) + ";background:" + col + '">' + (v / P > 0.12 ? n : "") + "</span>").join("");
    };
    c.querySelectorAll("input").forEach((i) => i.oninput = f); f();
  },
  async oportunidades(c) {
    c.innerHTML = '<p class="d-nota">Cargando las próximas fechas reales…</p>';
    const hoy = new Date().toISOString().slice(0, 10);
    let ops = [];
    try { const r = await sb.from("oportunidades").select("nombre,tipo,postul_fin,evento_inicio,fechas_estimadas,lugar"); ops = r.data || []; } catch (e) {}
    if (!ops.length) try { ops = await (await fetch("../data/oportunidades.json")).json(); } catch (e) {}
    const prox = ops.map((o) => { const f = [o.postul_fin, o.evento_inicio].filter((x) => x && x >= hoy).sort()[0]; return f ? { ...o, f, cierre: f === o.postul_fin } : null; }).filter(Boolean).sort((a, b) => a.f.localeCompare(b.f)).slice(0, 4);
    const M = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
    c.innerHTML = prox.length ? '<div class="d-ops">' + prox.map((o) => { const [y, m, d] = o.f.split("-"), dias = Math.round((new Date(o.f) - new Date(hoy)) / 864e5);
      return '<div class="d-op"><span class="f"><b>' + +d + "</b><small>" + M[+m - 1] + '</small></span><span class="t"><b>' + esc(o.nombre) + "</b><small>" + (o.cierre ? "Cierra la postulación" : "Evento") + " · " + (dias === 0 ? "hoy" : "en " + dias + " días") + (o.fechas_estimadas ? " · fecha estimada" : "") + "</small></span></div>"; }).join("") + '</div><p class="d-nota">Estas son fechas reales del calendario de Forja. <a href="../oportunidades/">Ver el calendario completo</a></p>'
      : '<p class="d-nota">No hay fechas próximas cargadas ahora. <a href="../oportunidades/">Ver el calendario</a></p>';
  },
  vitrina(c) {
    c.innerHTML = '<div class="d-marco" id="d-vt"></div><p class="d-nota">Así se ve una vitrina. Esta es de ejemplo; la tuya la armas con copias de tu proyecto.</p>';
    return pintarVitrina($("d-vt"), { titulo: "Ciudad Sumergida", lema: "Un faro apagado, una ciudad bajo el agua y la capitana que bajará a buscarla.", firma: "un estudio de Valparaíso", tipo: "historia", formato: "novela", tono: "noche", acento: "#7a3fc4",
      historia: [{ id: "h1", titulo: "Premisa", texto: "Bajo el puerto hay una ciudad que se hundió hace más de un siglo.\n\nUna capitana de remolcador encuentra una campana que todavía suena." }],
      galeria: [{ id: "g1", tipo: "color", valor: "#1d3557" }, { id: "g2", tipo: "color", valor: "#e9c46a" }, { id: "g3", tipo: "color", valor: "#7a3fc4" }, { id: "g4", tipo: "cita", valor: "El mar devuelve todo, pero nunca a tiempo.", titulo: "La abuela" }],
      novedades: [{ id: "n1", fecha: "2026-11-01", titulo: "Terminé el primer acto", texto: "Ya está el borrador completo." }], enlaces: [{ id: "e1", nombre: "Instagram", url: "https://instagram.com" }] }, { previa: true });
  },
  biblia(c) {
    const P = [["Portada", 1], ["Escritura", 4], ["Referentes", 2], ["Brújula", 1], ["Pizarras", 2], ["Costos", 1], ["Oportunidades", 1], ["Bitácora", 1]];
    const on = new Set(P.map((p) => p[0]));
    const pintar = () => {
      const n = P.filter((p) => on.has(p[0])).reduce((a, p) => a + p[1], 0);
      c.innerHTML = '<div class="chips">' + P.map(([k]) => '<button type="button" data-k="' + k + '" aria-pressed="' + on.has(k) + '">' + k + "</button>").join("") + '</div><div class="d-pags">' +
        P.flatMap(([k, m]) => Array.from({ length: m }, () => '<span class="d-pag' + (on.has(k) ? "" : " fuera") + '" title="' + k + '"><i></i><i></i><i></i><i style="width:60%"></i></span>')).join("") +
        '</div><p class="d-nota">Unas ' + n + " páginas. Eliges las partes y la guardas como PDF desde la impresión del navegador.</p>";
      c.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { on.has(b.dataset.k) ? on.delete(b.dataset.k) : on.add(b.dataset.k); if (!on.size) on.add("Portada"); pintar(); });
    };
    pintar();
  },
};

/* ---------- buscador ---------- */
const SUG = [["Calcular el precio de mi juego", "costos"], ["Ordenar a mis personajes", "pizarra"], ["Encontrar un fondo", "oportunidades"], ["Mostrar mi proyecto", "vitrina"], ["Empezar a escribir", "taller"], ["Elegir el formato", "brujula"]];
$("g-sug").innerHTML = SUG.map(([n, t]) => '<button type="button" data-t="' + t + '">' + n + "</button>").join("");
$("g-sug").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { abrir(b.dataset.t, true); $("recorrido").scrollIntoView({ behavior: "smooth" }); });
const q = $("g-q"), res = $("g-res");
q.oninput = () => {
  const r = buscar(q.value);
  if (!q.value.trim()) { res.hidden = true; q.setAttribute("aria-expanded", "false"); return; }
  res.innerHTML = r.length ? r.slice(0, 5).map((t) => '<button type="button" data-t="' + t.id + '">' + icono(t.id, 18) + "<span><b>" + esc(t.n) + "</b><small>" + esc(t.corto) + "</small></span></button>").join("") : "<p>No encontré eso. Prueba con otras palabras, como «precio», «fondo» o «personajes».</p>";
  res.hidden = false; q.setAttribute("aria-expanded", "true");
  res.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { res.hidden = true; abrir(b.dataset.t, true); $("recorrido").scrollIntoView({ behavior: "smooth" }); });
};
q.onkeydown = (e) => { if (e.key === "Enter") { const r = buscar(q.value)[0]; if (r) { res.hidden = true; abrir(r.id, true); $("recorrido").scrollIntoView({ behavior: "smooth" }); } } if (e.key === "Escape") res.hidden = true; };
document.addEventListener("click", (e) => { if (!e.target.closest(".g-busca")) res.hidden = true; });

/* ---------- dudas ---------- */
const DUDAS = [
  ["¿Forja es gratis?", "Sí. El plan gratis no vence y sirve para trabajar de verdad: 3 proyectos en curso, con su Taller, referentes, pizarra, cotización y vitrina. Forja Más, que llega pronto, quita los límites y suma herramientas."],
  ["¿Alguien más puede ver mis proyectos?", "No. Todo lo que creas es privado de tu cuenta. Lo único público es lo que tú publicas en una vitrina."],
  ["¿Por qué no tengo contraseña?", "Entras con un enlace que llega a tu correo. Así no hay contraseñas que olvidar ni que se puedan filtrar. El correo llega en inglés («Your Magic Link»)."],
  ["¿Puedo subir archivos?", "No: Forja guarda enlaces y códigos (imágenes, videos, colores, citas), nunca archivos. Así funciona rápido en cualquier teléfono y tus archivos siguen donde ya los tienes."],
  ["¿Qué pasa si llego a un límite?", "Nada se borra. No puedes agregar más de eso hasta que archives o recortes, y siempre puedes ver, exportar, archivar o borrar."],
  ["¿Funciona en el celular?", "Sí, y se puede instalar como app desde el navegador. La Pizarra y el Taller tienen pantalla completa para trabajar cómodo."],
  ["¿Las fechas de oportunidades son seguras?", "Se revisan seguido, pero confírmalas siempre en la fuente. Si una dice «estimada», se calculó con ediciones anteriores."],
  ["¿Cómo vuelvo a ver los primeros pasos?", "En el menú de tu cuenta (tu inicial, arriba a la derecha), toca «Volver a ver las pistas». También tienes el botón «?» en cada página."],
];
$("g-dudas").innerHTML = DUDAS.map(([p, r]) => "<details><summary>" + esc(p) + "</summary><p>" + esc(r) + "</p></details>").join("");
$("g-cta").innerHTML = SES
  ? '<div class="g-cta"><div><h2>Tu forja te espera</h2><p>Vuelve a esta guía cuando quieras con el botón «?» de cada página.</p></div><a href="../proyectos/">Ir a mis proyectos</a></div>'
  : '<div class="g-cta"><div><h2>Planta tu primera idea</h2><p>Gratis, sin contraseña y desde cualquier dispositivo.</p></div><a href="../entrar/">Empezar gratis</a></div>';

const h = location.hash.slice(1);
abrir(tema(h) ? h : "plantar", false);
if (tema(h)) $("recorrido").scrollIntoView();
window.addEventListener("hashchange", () => { const x = location.hash.slice(1); if (tema(x) && x !== actual) abrir(x, false); });
</script>
