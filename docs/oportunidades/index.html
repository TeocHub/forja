<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Oportunidades</title>
<meta name="description" content="Ferias, fondos y convocatorias en Chile para videojuegos, cómic y juegos de mesa.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=Geist+Mono:wght@400..700&display=swap">
<style>
/* Layout: cartelera de convocatorias — resumen arriba, filtros, lista de fichas con dos contadores (postulación / evento) */
/* Colores de estado de cada convocatoria; el resto (grafito, letras) viene de forja.css */
:root{--open:var(--good); --open-soft:var(--good-soft); --soon:var(--bad); --soon-soft:color-mix(in srgb,var(--bad) 12%,var(--card)); --closed:var(--muted); --closed-soft:var(--suave); --wait:var(--warn); --wait-soft:var(--warn-soft)}

.wrap{max-width:900px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
/* lo que viene: una regla de días desde hoy; cada fecha cuelga en su día como un talón (cierra, abre o evento). Se desliza en el celular. */
.proximo{display:flex;flex-direction:column;gap:6px}
.px-cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.px-cab h2{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0}
.px-ley{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.px-ley span{display:inline-flex;align-items:center;gap:6px}
.px-ley i{width:9px;height:9px;border-radius:50%;background:var(--k)}
/* regla delgada con un punto por fecha; la franja marca qué parte de la regla se está viendo en la fila de talones */
.px-regla{position:relative;height:44px;margin:4px 6px 0;cursor:pointer;touch-action:pan-y}
.px-linea{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--fg);border-radius:2px}
.px-marca{position:absolute;top:13px;width:1.5px;height:6px;background:var(--fg);transform:translateX(-50%)}
.px-marca.mes{height:10px}
.px-mes{position:absolute;top:26px;transform:translateX(-50%);font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.px-mes.hoy{transform:none;color:var(--fg);font-weight:700}
.px-punto{position:absolute;top:8px;width:8px;height:8px;border-radius:50%;background:var(--k);border:1.5px solid var(--bg);transform:translateX(-50%);box-sizing:content-box}
.px-ventana{position:absolute;top:2px;height:22px;border-radius:4px;background:color-mix(in srgb,var(--fg) 10%,transparent);transition:left .2s ease,width .2s ease}
@media (prefers-reduced-motion:reduce){.px-ventana{transition:none}}
/* fila de talones: uno por fecha, en orden, se desliza */
.px-fila-w{position:relative}
.px-fila{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;overscroll-behavior-x:contain;scrollbar-width:thin;padding:2px 2px 8px}
.px-talon{flex:none;scroll-snap-align:start;width:216px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;min-height:76px;padding:8px 12px 8px 10px;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--k);border-radius:4px;text-decoration:none;color:var(--fg);line-height:1.25}
.px-talon:hover{border-color:var(--fg);border-top-color:var(--k)}
.px-dias{min-width:44px;text-align:center;font-family:var(--f-num);line-height:1}
.px-dias b{display:block;font-size:22px;font-weight:700}
.px-dias small{font-size:12px;color:var(--muted)}
.px-que{min-width:0;display:flex;flex-direction:column;gap:3px}
.px-que b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.px-que small{font-size:12px;color:var(--muted)}
.px-que small em{font-style:normal;color:var(--k);font-weight:700}
.px-flecha{position:absolute;top:calc(50% - 26px);width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-size:20px;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px var(--sombra)}
.px-flecha.izq{left:-14px}.px-flecha.der{right:-14px}
.px-flecha[hidden]{display:none}
@media (hover:none),(max-width:720px){.px-flecha{display:none}}
/* en pantallas anchas, dos filas de talones: se ven ocho a la vez */
@media (min-width:900px){.px-fila{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:216px}}
.px-vacio{font-size:15px;color:var(--muted);margin:4px 0 0}
.k-cierra{--k:var(--soon)} .k-abre{--k:var(--wait)} .k-evento{--k:var(--fg)} .k-curso{--k:var(--open)}
.item:target,.item.visto{outline:2px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.chip:focus-visible,select:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:0 8px;min-height:44px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-left:auto;border-radius:6px;min-height:44px;cursor:pointer}
.toggle input{width:20px;height:20px;margin:0}
.list{display:flex;flex-direction:column;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;border-left:4px solid var(--line)}
.item.s-open{border-left-color:var(--open)} .item.s-soon{border-left-color:var(--soon)} .item.s-wait{border-left-color:var(--wait)}
.top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.tag.tipo{color:var(--accent);border-color:var(--accent)}
.tag.est{border-style:dashed}
.item h2{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
.org{font-size:14px;color:var(--muted)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clock{border-radius:8px;padding:10px 12px;background:var(--closed-soft);min-width:0}
.clock .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.clock .big{font-family:var(--f-num);font-weight:700;font-size:18px;line-height:1.3}
.clock .dates{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock.open{background:var(--open-soft)} .clock.open .big{color:var(--open)}
.clock.soon{background:var(--soon-soft)} .clock.soon .big{color:var(--soon)}
.clock.wait{background:var(--wait-soft)} .clock.wait .big{color:var(--wait)}
.clock.closed .big{color:var(--closed)}
details summary{cursor:pointer;color:var(--accent);font-size:14px;border-radius:4px;min-height:44px;display:flex;align-items:center}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:10px 0 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:24px;color:var(--muted);text-align:center}
.legend{font-size:13px;color:var(--muted)}
@media (max-width:560px){.clocks{grid-template-columns:1fr}.toggle{margin-left:0}dl{grid-template-columns:1fr}dt{margin-top:6px}}
.logo{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em}
</style>
<link rel="stylesheet" href="../css/forja.css">
<script type="module">import { nav } from "../js/forja.js"; nav("oportunidades");</script>
</head>
<body>
<div class="wrap">
  <header>
    <nav data-forja-nav></nav>
    <h1>Oportunidades</h1>
    <p>Ferias, fondos y convocatorias en Chile para videojuegos, cómic y juegos de mesa.</p>
    <div class="meta" id="meta">Cargando…</div>
  </header>

  <section class="proximo" aria-labelledby="px-t">
    <div class="px-cab"><h2 id="px-t">Lo que viene</h2><div class="px-ley" id="px-ley" aria-hidden="true"></div></div>
    <p class="sr" id="viva" aria-live="polite">Revisando las fechas…</p>
    <div class="px-regla" id="px-regla" aria-hidden="true"></div>
    <div class="px-fila-w"><div class="px-fila" id="px-fila" role="list" aria-label="Próximas fechas"></div><button type="button" class="px-flecha izq" id="px-izq" aria-label="Fechas anteriores" hidden>‹</button><button type="button" class="px-flecha der" id="px-der" aria-label="Fechas siguientes" hidden>›</button></div>
  </section>

  <div class="filters" role="group" aria-label="Filtrar por área">
    <button class="chip" data-area="" aria-pressed="true" id="f-all">Todo</button>
    <button class="chip" data-area="videojuego" aria-pressed="false" id="f-vj">Videojuegos</button>
    <button class="chip" data-area="comic" aria-pressed="false" id="f-comic">Cómic y libro</button>
    <button class="chip" data-area="juegomesa" aria-pressed="false" id="f-jm">Juegos de mesa</button>
    <button class="chip" data-area="general" aria-pressed="false" id="f-gen">Emprendimiento</button>
    <select id="f-tipo" aria-label="Tipo">
      <option value="">Todos los tipos</option>
      <option value="fondo">Fondos</option>
      <option value="feria">Ferias y festivales</option>
      <option value="convocatoria">Convocatorias</option>
    </select>
    <label class="toggle"><input type="checkbox" id="f-past" checked> Ocultar lo ya terminado</label>
  </div>

  <p class="legend">Las fechas con ≈ son estimaciones basadas en ediciones anteriores; se reemplazan cuando el organizador las confirma.</p>

  <div class="list" id="list"><div class="empty">Cargando oportunidades…</div></div>
</div>

<script>
(function(){
  var items=[], state={area:"",tipo:"",hidePast:true}, metaDoc=null;
  var MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  try{var saved=JSON.parse(localStorage.getItem("radar-f")||"null");if(saved){state.area=saved.area||"";state.tipo=saved.tipo||"";state.hidePast=saved.hidePast!==false;}}catch(e){}

  function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  function pd(s){if(!s)return null;var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function diff(d){return Math.round((d-today())/864e5);}
  function fmt(d){return d?d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear():"";}
  function dias(n){return n===1?"1 día":n+" días";}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function postul(it){
    var a=pd(it.postul_inicio),b=pd(it.postul_fin),est=it.fechas_estimadas?"≈ ":"";
    if(!a&&!b) return {cls:"closed",big:it.postul_texto||"Sin convocatoria publicada",dates:"",k:"none"};
    var dates=(a?fmt(a):"?")+" → "+(b?fmt(b):"?");
    if(a&&diff(a)>0) return {cls:"wait",big:est+"Abre en "+dias(diff(a)),dates:dates,k:"wait",next:a};
    if(b&&diff(b)>=0){var n=diff(b);return {cls:n<=14?"soon":"open",big:(n===0?"Cierra hoy":"Abierta · quedan "+dias(n)),dates:dates,k:"open",next:b,left:n};}
    if(b) return {cls:"closed",big:"Cerrada",dates:dates,k:"closed"};
    return {cls:"open",big:"Abierta",dates:dates,k:"open"};
  }
  function evento(it){
    var a=pd(it.evento_inicio),b=pd(it.evento_fin)||a,est=it.fechas_estimadas?"≈ ":"";
    if(!a) return {cls:"closed",big:it.evento_texto||"Sin evento asociado",dates:"",k:"none"};
    var dates=fmt(a)+(b&&+b!==+a?" → "+fmt(b):"");
    if(diff(a)>0) return {cls:"wait",big:est+"En "+dias(diff(a)),dates:dates,k:"future",next:a,left:diff(a)};
    if(diff(b)>=0) return {cls:"open",big:"En curso",dates:dates,k:"now",next:b};
    return {cls:"closed",big:"Terminado",dates:dates,k:"past"};
  }
  function finished(it,p,e){return (p.k==="closed"||p.k==="none")&&(e.k==="past"||e.k==="none");}
  function sortKey(p,e){var c=[];if(p.next)c.push(+p.next);if(e.next)c.push(+e.next);return c.length?Math.min.apply(null,c):9e15;}

  function enDias(n,est){return n===0?"hoy":n===1?"mañana":(est?"en unos ":"en ")+n+" días";}
  // Fechas que vienen: cierres de postulaciones abiertas, aperturas y eventos (y los eventos en curso, en «hoy»).
  function proximas(rows){
    var f=[];
    rows.forEach(function(r){
      var est=!!r.it.fechas_estimadas;
      if(r.p.k==="open"&&r.p.left!=null)f.push({r:r,n:r.p.left,k:"cierra",q:"cierra",est:false});
      if(r.p.k==="wait")f.push({r:r,n:diff(r.p.next),k:"abre",q:"abre",est:est});
      if(r.e.k==="future")f.push({r:r,n:r.e.left,k:"evento",q:"evento",est:est});
      if(r.e.k==="now")f.push({r:r,n:0,k:"curso",q:"en curso",est:false});
    });
    return f.sort(function(a,b){return a.n-b.n||(a.k==="curso"?-1:1);});
  }
  function fraseViva(rows,f){
    var ab=f.filter(function(x){return x.k==="cierra";});
    if(ab.length)return (ab.length===1?"Hay una postulación abierta":"Hay "+ab.length+" postulaciones abiertas")+"; la primera cierra "+enDias(ab[0].n)+": "+ab[0].r.it.nombre+".";
    var x=f.filter(function(x){return x.k!=="curso";})[0];
    return "Ahora no hay postulaciones abiertas"+(x?"; la próxima fecha es "+x.r.it.nombre+", "+enDias(x.n,x.est)+".":".");
  }
  var MESL=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var FECHAS=[],RANGO=90;
  function pintarRegla(rows){
    var f=proximas(rows),reg=document.getElementById("px-regla"),fila=document.getElementById("px-fila");
    document.getElementById("viva").textContent=fraseViva(rows,f);
    var lejos=f.filter(function(x){return x.k!=="curso";});
    // 90 días; si no hay nada en ese plazo, se estira hasta la próxima fecha (máximo un año)
    RANGO=90;if(lejos.length&&lejos[0].n>80)RANGO=Math.min(365,lejos[0].n+21);
    f=f.filter(function(x){return x.n<=RANGO;});FECHAS=f;
    var LEY={curso:"En curso",cierra:"Cierra",abre:"Abre",evento:"Evento"};
    document.getElementById("px-ley").innerHTML=Object.keys(LEY).filter(function(k){return f.some(function(x){return x.k===k;});}).map(function(k){return '<span class="k-'+k+'"><i></i>'+LEY[k]+'</span>';}).join("");
    if(!f.length){reg.innerHTML="";fila.innerHTML='<p class="px-vacio">No hay fechas en los próximos meses. Abajo están todas, también las que ya pasaron.</p>';flechas();return;}
    var pct=function(n){return (n/RANGO*100)+"%";},h="",t=today();
    h+='<div class="px-ventana" id="px-ventana"></div><div class="px-linea"></div><span class="px-mes hoy" style="left:0">hoy</span>';
    for(var d=1;d<=RANGO;d++){
      var dia=new Date(t.getFullYear(),t.getMonth(),t.getDate()+d);
      if(dia.getDate()===1){h+='<span class="px-marca mes" style="left:'+pct(d)+'"></span>';if(d>6&&d<RANGO-4)h+='<span class="px-mes" style="left:'+pct(d)+'">'+MESL[dia.getMonth()]+'</span>';}
      else if(RANGO<=120&&dia.getDay()===1)h+='<span class="px-marca" style="left:'+pct(d)+'"></span>';
    }
    h+=f.map(function(x){return '<span class="px-punto k-'+x.k+'" style="left:'+pct(x.n)+'"></span>';}).join("");
    reg.innerHTML=h;
    fila.innerHTML=f.map(function(x,i){
      var dia=new Date(t.getFullYear(),t.getMonth(),t.getDate()+x.n);
      var num=x.k==="curso"?"·":x.n===0?"hoy":(x.est?"≈":"")+x.n,unidad=x.k==="curso"||x.n===0?"":(x.n===1?"día":"días");
      var cuando=x.k==="curso"?"ahora":dia.getDate()+" "+MESL[dia.getMonth()];
      return '<a role="listitem" class="px-talon k-'+x.k+'" data-i="'+i+'" data-id="'+esc(x.r.it.id)+'" href="#op-'+esc(x.r.it.id)+'" title="'+esc(x.r.it.nombre)+'">'+
        '<span class="px-dias"><b>'+(x.k==="curso"?'<em style="font-style:normal;color:var(--k)">●</em>':num)+'</b><small>'+unidad+'</small></span>'+
        '<span class="px-que"><b>'+esc(x.r.it.nombre)+'</b><small><em>'+x.q+'</em> · '+cuando+'</small></span></a>';
    }).join("");
    ventana();
  }
  // Franja sobre la regla: va de la primera a la última fecha que se ve en la fila.
  function ventana(){
    var fila=document.getElementById("px-fila"),v=document.getElementById("px-ventana");flechas();
    if(!v||!FECHAS.length)return;
    var r=fila.getBoundingClientRect(),vis=[].filter.call(fila.querySelectorAll(".px-talon"),function(el){var b=el.getBoundingClientRect();return b.right>r.left+20&&b.left<r.right-20;});
    if(!vis.length)return;
    var a=FECHAS[+vis[0].dataset.i].n,b=FECHAS[+vis[vis.length-1].dataset.i].n;
    v.style.left="calc("+(a/RANGO*100)+"% - 6px)";v.style.width="calc("+((b-a)/RANGO*100)+"% + 12px)";
  }
  function flechas(){
    var fila=document.getElementById("px-fila");
    document.getElementById("px-izq").hidden=fila.scrollLeft<8;
    document.getElementById("px-der").hidden=fila.scrollLeft+fila.clientWidth>=fila.scrollWidth-8;
  }
  function render(){
    document.querySelectorAll(".chip").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.area===state.area));});
    document.getElementById("f-tipo").value=state.tipo;
    document.getElementById("f-past").checked=state.hidePast;
    var rows=items.map(function(it){var p=postul(it),e=evento(it);return {it:it,p:p,e:e,key:sortKey(p,e),done:finished(it,p,e)};});
    if(items.length)pintarRegla(rows);
    var vis=rows.filter(function(r){
      if(state.area&&(r.it.areas||[]).indexOf(state.area)<0)return false;
      if(state.tipo&&r.it.tipo!==state.tipo)return false;
      if(state.hidePast&&r.done)return false;return true;
    }).sort(function(a,b){return a.key-b.key||String(a.it.nombre).localeCompare(b.it.nombre);});
    var list=document.getElementById("list");
    if(!items.length){list.innerHTML='<div class="empty">Todavía no hay oportunidades guardadas. Aparecerán aquí cuando la revisión diaria las agregue.</div>';return;}
    if(!vis.length){list.innerHTML='<div class="empty">Nada coincide con estos filtros. Prueba con "Todo" o muestra lo ya terminado.</div>';return;}
    var TIPO={fondo:"Fondo",feria:"Feria / festival",convocatoria:"Convocatoria"};
    var AREA={videojuego:"Videojuegos",comic:"Cómic y libro",juegomesa:"Juegos de mesa",general:"Emprendimiento"};
    list.innerHTML=vis.map(function(r){
      var it=r.it,p=r.p,e=r.e,s=p.k==="open"?(p.cls==="soon"?"s-soon":"s-open"):(p.k==="wait"?"s-wait":"");
      var tags='<span class="tag tipo">'+esc(TIPO[it.tipo]||it.tipo)+'</span>'+(it.areas||[]).map(function(a){return '<span class="tag">'+esc(AREA[a]||a)+'</span>';}).join("")+(it.fechas_estimadas?'<span class="tag est">Fechas estimadas</span>':'');
      var det=[["Premio o apoyo",it.premio],["Costo",it.costo],["Requisitos",it.requisitos],["Qué llevar o preparar",it.que_llevar],["Lugar",it.lugar],["Notas",it.notas]].filter(function(x){return x[1];}).map(function(x){return "<dt>"+x[0]+"</dt><dd>"+esc(x[1])+"</dd>";}).join("");

        (det?'<details><summary>Ver premios, requisitos y detalles</summary><dl>'+det+'</dl></details>':'')+'</article>';
    }).join("");
  }
  var suave=function(){return matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth";};

  document.getElementById("px-regla").addEventListener("click",function(ev){
