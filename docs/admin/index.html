<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Moderación</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: moderación — pestañas (reportes, mensajes, sugerencias, suspendidas, Explorar, correos, registro); cada caso es una tarjeta con sus pruebas y sus decisiones */

.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:where(button,a,select,textarea):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--f-display);font-size:clamp(26px,5vw,34px);margin:0}
.lead{margin:4px 0 0;color:var(--muted);max-width:66ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs b{font-family:var(--f-num);font-size:12px;margin-left:5px;padding:0 6px;border-radius:999px;background:var(--ember);color:#fff}
.caso{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.caso-cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.caso h2{font-family:var(--f-display);font-size:19px;margin:0}
.caso h2 small{font-family:var(--f-num);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.tag.mal{color:var(--bad);border-color:var(--bad)}
.rep{border-left:3px solid var(--line);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:3px}
.rep b{font-size:14px}
.rep p{margin:0;white-space:pre-wrap}
.rep small{color:var(--muted);font-size:12.5px}
.rep .sosp{color:var(--e-pausa);font-weight:700}
.acc{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;padding:6px 12px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.peligro{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.prim{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.btn:disabled{opacity:.5}
.forma{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.forma label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.forma select,.forma textarea{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 9px}
.forma textarea{min-height:110px;resize:vertical}
.forma .campo{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:7px 9px}
.forma b{font-size:14px;margin-top:6px}
.check-l{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--fg)!important;font-size:14px!important}
.lead{margin:0;color:var(--muted);font-size:14px}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
.texto{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.reg{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:14px}
.reg span{font-family:var(--f-num);font-size:12px;color:var(--muted)}
dialog.ver{border:0;padding:0;width:min(1000px,96vw);height:90vh;border-radius:16px;overflow:hidden}
dialog.ver::backdrop{background:rgba(10,12,20,.6)}
.ver-cab{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--fg);color:var(--bg);font-size:13px}
.ver-cab button{font:inherit;border:0;background:none;color:inherit;font-size:22px;cursor:pointer}
#ver-c{height:calc(90vh - 42px);overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="fx-empty">Cargando…</div></main>
</div>
<dialog class="ver" id="ver"><div class="ver-cab"><span id="ver-t">Vista de moderación</span><button type="button" id="ver-x" aria-label="Cerrar">×</button></div><div id="ver-c"></div></dialog>
<script type="module">
import { sb, $, esc, toast, navApp, conSesion, limite, hace, u, NOMBRE_DOC, fechaDia } from "../js/forja.js";
import { pintarVitrina, CSS_VITRINA } from "../js/vitrina.js";
import { FUNCIONES, AREAS, AREAS_SUGERENCIA } from "../js/planes.js";
document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_VITRINA + "</style>");
navApp(null);
const MOTIVOS = { estafa: "Estafa o engaño", ofensivo: "Odio, acoso o violencia", menores: "Pone en riesgo a menores", derechos: "Obras ajenas como propias", datos: "Datos personales de otros", spam: "Spam o enlaces dañinos", otro: "Otra cosa" };
// Plantillas para explicarle al dueño el porqué (siempre se pueden editar antes de enviar).
const PLANTILLA = {
  estafa: "Tu vitrina promete o pide algo que no pudimos verificar como real. Para volver a publicarla, muestra el estado real del proyecto y elimina cualquier pedido de pago que no puedas cumplir.",
  ofensivo: "Tu vitrina incluye contenido que ataca o acosa a personas o grupos. Quita ese contenido para poder publicarla de nuevo.",
  menores: "Tu vitrina incluye contenido que pone en riesgo a menores de edad, lo que está prohibido en Forja.",
  derechos: "Tu vitrina usa obras (imágenes, música, personajes o marcas) de otras personas como si fueran tuyas o para vender. Quítalas o indica claramente su autoría y que no se venden como propias.",
  datos: "Tu vitrina muestra datos personales de otra persona sin su consentimiento. Quítalos para poder publicarla de nuevo.",
  spam: "Tu vitrina parece estar vacía, repetida o pensada para promocionar otra cosa. Agrega el contenido real de tu proyecto para publicarla de nuevo.",
  otro: "",
};
let D = null, pest = "reportes";

conSesion($("app"), async () => {
  const { data: adm } = await sb.rpc("soy_admin");
  if (adm !== true) { $("app").innerHTML = '<div class="vacio">Esta página es solo para el equipo de moderación de Forja.</div>'; return; }
  await cargar();
});
async function cargar() {
  const { data, error } = await sb.rpc("mod_panel");
  if (error) { $("app").innerHTML = '<div class="vacio">No se pudo cargar el panel: ' + esc(error.message) + "</div>"; return; }
  D = data; pintar();
}
const TABS = [["reportes", "Reportes"], ["mensajes", "Mensajes y apelaciones"], ["sugerencias", "Sugerencias"], ["suspendidas", "Suspendidas"], ["explorar", "En Explorar"], ["correos", "Correos"], ["documentos", "Documentos"], ["registro", "Registro"]];
function pintar() {
  const n = { reportes: D.reportes.length, mensajes: D.mensajes.length, sugerencias: (D.sugerencias || []).length };
  $("app").innerHTML = "<h1>Moderación</h1><p class=\"lead\">Cada decisión la toma una persona y queda en el registro. Al suspender, explica siempre el porqué: el dueño lo recibe como aviso y puede apelar.</p>" +
    '<div class="tabs" role="tablist">' + TABS.map(([k, t]) => '<button type="button" role="tab" data-t="' + k + '" aria-selected="' + (k === pest) + '">' + t + (n[k] ? "<b>" + n[k] + "</b>" : "") + "</button>").join("") + '</div><div id="lista"></div>';
  $("app").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { pest = b.dataset.t; pintar(); });
  ({ reportes, mensajes, sugerencias, suspendidas, explorar, correos, documentos, registro })[pest]();
}
const verBtn = (id, t) => '<button type="button" class="btn" data-ver="' + id + '" data-tt="' + esc(t || "") + '">Ver vitrina</button>';
function enlazarVer() {
  $("lista").querySelectorAll("[data-ver]").forEach((b) => b.onclick = async () => {
    const { data, error } = await sb.rpc("mod_vitrina", { v: b.dataset.ver });
    if (error || !data) { toast("No se pudo abrir la vitrina."); return; }
    $("ver-t").textContent = "Vista de moderación · " + (b.dataset.tt || data.slug) + (data.suspendida ? " · SUSPENDIDA" : "");
    $("ver").showModal(); pintarVitrina($("ver-c"), data.datos, { previa: true });
  });
}
$("ver-x").onclick = () => $("ver").close();

function reportes() {
  if (!D.reportes.length) { $("lista").innerHTML = '<div class="vacio">No hay reportes pendientes.</div>'; return; }
  $("lista").innerHTML = D.reportes.map((c) => {
    return '<article class="caso" data-v="' + c.vitrina_id + '"><div class="caso-cab"><h2>' + esc(c.titulo || "Sin título") + "<small>" + esc(c.slug) + "</small></h2>" +
      (c.suspendida ? '<span class="tag mal">Suspendida</span>' : c.en_explorar ? '<span class="tag">En Explorar</span>' : '<span class="tag">Solo enlace</span>') + "</div>" +
      c.reportes.map((r) => { const h = r.historial || {}, sosp = (h.mala_fe || 0) > 0 || (h.desestimados || 0) >= 3 || (r.cuenta_dias || 0) < 3;
        return '<div class="rep"><b>' + esc(MOTIVOS[r.motivo] || r.motivo) + "</b>" + (r.detalle ? "<p>" + esc(r.detalle) + "</p>" : "") +
          "<small>Quien reporta: cuenta " + esc(r.autor) + "… de " + (r.cuenta_dias ?? "?") + " días · antes: " + (h.aceptados || 0) + " aceptados, " + (h.desestimados || 0) + " desestimados, " + (h.mala_fe || 0) + " de mala fe · " + hace(r.creado_en) + "</small>" +
          (sosp ? '<small class="sosp">Ojo: revisa con cuidado (cuenta nueva o historial de reportes desestimados).</small>' : "") + "</div>"; }).join("") +
      '<div class="acc">' + verBtn(c.vitrina_id, c.titulo) + '<button type="button" class="btn" data-res="desestimado">No infringe</button><button type="button" class="btn" data-res="mala_fe">Reportes de mala fe</button>' +
      (c.en_explorar ? '<button type="button" class="btn" data-fuera>Sacar de Explorar…</button>' : "") + '<button type="button" class="btn peligro" data-susp>Suspender…</button></div><div class="f"></div></article>';
  }).join("");
  enlazarVer();
  $("lista").querySelectorAll("[data-res]").forEach((b) => b.onclick = async () => {
    const v = b.closest("[data-v]").dataset.v;
    if (b.dataset.res === "mala_fe" && b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Todos de mala fe? Toca de nuevo"; return; }
    const { error } = await sb.rpc("mod_resolver", { v, decision: b.dataset.res });
    if (error) { toast(limite(error) || error.message); return; }
    toast(b.dataset.res === "mala_fe" ? "Marcados como de mala fe." : "Resuelto: no infringe. Se avisó a quien reportó."); await cargar();
  });
  $("lista").querySelectorAll("[data-susp]").forEach((b) => b.onclick = () => formSuspender(b.closest("[data-v]")));
  $("lista").querySelectorAll("[data-fuera]").forEach((b) => b.onclick = () => formExplorar(b.closest("[data-v]")));
}
function formSuspender(caso) {
  const f = caso.querySelector(".f"), motivoInicial = (D.reportes.find((c) => c.vitrina_id === caso.dataset.v)?.reportes[0] || {}).motivo || "otro";
  f.innerHTML = '<div class="forma"><label>Motivo<select id="s-m">' + Object.entries(MOTIVOS).map(([k, n]) => '<option value="' + k + '"' + (k === motivoInicial ? " selected" : "") + ">" + n + "</option>").join("") + "</select></label>" +
    '<label>Mensaje para el dueño (lo recibe tal cual, explica qué cambiar)<textarea id="s-t">' + esc(PLANTILLA[motivoInicial]) + "</textarea></label>" +
    '<div class="acc" style="border:0;padding:0"><button type="button" class="btn" id="s-no">Cancelar</button><button type="button" class="btn peligro" id="s-si">Suspender y avisar</button></div></div>';
  f.querySelector("#s-m").onchange = (e) => { f.querySelector("#s-t").value = PLANTILLA[e.target.value]; };
  f.querySelector("#s-no").onclick = () => { f.innerHTML = ""; };
  f.querySelector("#s-si").onclick = async () => {
    const mensaje = f.querySelector("#s-t").value.trim(); if (!mensaje) { toast("Explica el motivo al dueño."); return; }
    const { error } = await sb.rpc("mod_suspender", { v: caso.dataset.v, motivo: f.querySelector("#s-m").value, mensaje });
    if (error) { toast(limite(error) || error.message); return; }
    toast("Vitrina suspendida. El dueño recibió el aviso."); await cargar();
  };
}
function formExplorar(caso, mostrar = false) {
  const f = caso.querySelector(".f");
  f.innerHTML = '<div class="forma"><label>Mensaje para el dueño (opcional)<textarea id="e-t">' + (mostrar ? "" : "Tu vitrina no cumple por ahora con lo necesario para aparecer en Explorar. Sigue visible para quien tenga su enlace.") + "</textarea></label>" +
    '<div class="acc" style="border:0;padding:0"><button type="button" class="btn" id="e-no">Cancelar</button><button type="button" class="btn prim" id="e-si">' + (mostrar ? "Permitir de nuevo" : "Sacar de Explorar") + "</button></div></div>";
  f.querySelector("#e-no").onclick = () => { f.innerHTML = ""; };
  f.querySelector("#e-si").onclick = async () => {
    const { error } = await sb.rpc("mod_explorar", { v: caso.dataset.v, mostrar, mensaje: f.querySelector("#e-t").value.trim() });
    if (error) { toast(limite(error) || error.message); return; }
    toast(mostrar ? "Puede volver a Explorar." : "Fuera de Explorar. Se avisó al dueño."); await cargar();
  };
}
function mensajes() {
  if (!D.mensajes.length) { $("lista").innerHTML = '<div class="vacio">No hay mensajes abiertos.</div>'; return; }
  const T = { apelacion: "Apelación", privacidad: "Datos personales", contacto: "Contacto" };
  $("lista").innerHTML = D.mensajes.map((m) => '<article class="caso" data-m="' + m.id + '"' + (m.vitrina ? ' data-v="' + m.vitrina.id + '"' : "") + '><div class="caso-cab"><h2>' + T[m.tipo] + "<small>cuenta " + esc(m.autor) + "… · " + hace(m.creado_en) + "</small></h2>" +
    (m.tipo === "privacidad" ? '<span class="tag mal">Plazo legal: 30 días</span>' : "") + "</div>" +
    (m.vitrina && m.vitrina.suspension ? '<p class="texto"><b>Se suspendió por:</b> ' + esc(MOTIVOS[m.vitrina.suspension.motivo] || "") + "\n" + esc(m.vitrina.suspension.mensaje || "") + "</p>" : "") +
    '<p class="texto">' + esc(m.texto) + "</p>" +
    '<div class="forma"><label>Respuesta (le llega como aviso)<textarea class="r-t"></textarea></label><div class="acc" style="border:0;padding:0">' + (m.vitrina ? verBtn(m.vitrina.id, m.vitrina.slug) : "") +
    '<button type="button" class="btn prim" data-resp>Responder</button>' + (m.vitrina && m.vitrina.suspendida ? '<button type="button" class="btn" data-rest>Aceptar apelación: restaurar y responder</button>' : "") + "</div></div></article>").join("");
  enlazarVer();
  $("lista").querySelectorAll("[data-resp], [data-rest]").forEach((b) => b.onclick = async () => {
    const c = b.closest("[data-m]"), t = c.querySelector(".r-t").value.trim();
    if (!t) { toast("Escribe la respuesta."); return; }
    const rest = b.hasAttribute("data-rest");
    if (rest) { const r = await sb.rpc("mod_restaurar", { v: c.dataset.v, mensaje: t }); if (r.error) { toast(limite(r.error) || r.error.message); return; } }
    const { error } = await sb.rpc("mod_responder", { m: c.dataset.m, respuesta: t, avisar: !rest });
    if (error) { toast(limite(error) || error.message); return; }
    toast("Respuesta enviada."); await cargar();
  });
}
/* ---------- sugerencias de la comunidad (casilla de planes/) ---------- */
const TEMA_SUG = { ...Object.fromEntries(AREAS.map((a) => [a.k, a.n])), ...AREAS_SUGERENCIA };
const EST_SUG = { leida: "Leída", anotada: "Anotada", descartada: "Por ahora no" };
function sugerencias() {
  const S = D.sugerencias || [], V = D.sugerencias_vistas || [], A = D.sugerencias_areas || {};
  const resumen = Object.keys(A).length ? '<p class="lead" style="margin:0 0 12px">Sin contar las descartadas: ' + Object.entries(A).sort((x, y) => y[1] - x[1]).map(([k, c]) => esc(TEMA_SUG[k] || k) + " <b>" + c + "</b>").join(" · ") + "</p>" : "";
  $("lista").innerHTML = resumen + (S.length ? S.map((s) => '<article class="caso" data-s="' + s.id + '"><div class="caso-cab"><h2>' + esc(TEMA_SUG[s.area] || s.area) + "<small>cuenta " + esc(s.autor) + "… de " + (s.cuenta_dias ?? "?") + (s.cuenta_dias === 1 ? " día · " : " días · ") + s.del_autor + (s.del_autor === 1 ? " sugerencia" : " sugerencias") + " · " + hace(s.creado_en) + "</small></h2></div>" +
    '<p class="texto">' + esc(s.texto) + "</p>" +
    '<div class="forma"><label>Respuesta (opcional; le llega como aviso)<textarea class="r-t" style="min-height:70px" placeholder="Ej.: La anotamos para el Taller. ¡Gracias por escribir!"></textarea></label>' +
    '<div class="acc" style="border:0;padding:0"><button type="button" class="btn prim" data-est="anotada">La anotamos</button><button type="button" class="btn" data-est="leida">Leída</button><button type="button" class="btn" data-est="descartada">Por ahora no</button></div></div></article>').join("")
    : '<div class="vacio">No hay sugerencias nuevas.</div>') +
    (V.length ? '<h2 style="font-family:var(--f-display);font-size:18px;margin:22px 0 10px">Revisadas hace poco</h2>' + V.map((s) => '<article class="caso"><div class="caso-cab"><h2>' + esc(TEMA_SUG[s.area] || s.area) + "<small>" + hace(s.revisado_en) + '</small></h2><span class="tag">' + EST_SUG[s.estado] + "</span></div>" +
      '<p class="texto">' + esc(s.texto) + "</p>" + (s.respuesta ? '<p class="lead" style="margin:0"><b>Respondimos:</b> ' + esc(s.respuesta) + "</p>" : "") + "</article>").join("") : "");
  $("lista").querySelectorAll("[data-est]").forEach((b) => b.onclick = async () => {
    const c = b.closest("[data-s]"), respuesta = c.querySelector(".r-t").value.trim();
    c.querySelectorAll("button").forEach((x) => (x.disabled = true));
    const { error } = await sb.rpc("mod_sugerencia", { s: c.dataset.s, estado: b.dataset.est, respuesta: respuesta || null });
    if (error) { toast(limite(error) || error.message); c.querySelectorAll("button").forEach((x) => (x.disabled = false)); return; }
    toast(respuesta ? "Listo. Se le avisó a quien la escribió." : "Listo."); await cargar();
  });
}
function suspendidas() {
  if (!D.suspendidas.length) { $("lista").innerHTML = '<div class="vacio">No hay vitrinas suspendidas.</div>'; return; }
  $("lista").innerHTML = D.suspendidas.map((s) => '<article class="caso" data-v="' + s.vitrina_id + '"><div class="caso-cab"><h2>' + esc(s.titulo || s.slug) + "<small>" + esc(s.slug) + '</small></h2><span class="tag mal">' + esc(MOTIVOS[(s.suspension || {}).motivo] || "") + "</span></div>" +
    '<p class="texto">' + esc((s.suspension || {}).mensaje || "") + "</p>" +
    '<div class="forma"><label>Mensaje al restaurar (opcional)<textarea class="r-t"></textarea></label><div class="acc" style="border:0;padding:0">' + verBtn(s.vitrina_id, s.titulo) + '<button type="button" class="btn prim" data-rest>Restaurar</button></div></div></article>').join("");
  enlazarVer();
  $("lista").querySelectorAll("[data-rest]").forEach((b) => b.onclick = async () => {
    const c = b.closest("[data-v]"); const { error } = await sb.rpc("mod_restaurar", { v: c.dataset.v, mensaje: c.querySelector(".r-t").value.trim() });
    if (error) { toast(limite(error) || error.message); return; } toast("Restaurada. Se avisó al dueño."); await cargar();
  });
}
function explorar() {
  if (!D.explorar.length) { $("lista").innerHTML = '<div class="vacio">Ninguna vitrina aparece todavía en Explorar.</div>'; return; }
  $("lista").innerHTML = D.explorar.map((x) => '<article class="caso" data-v="' + x.vitrina_id + '"><div class="caso-cab"><h2>' + esc(x.titulo || x.slug) + "<small>" + esc(x.slug) + " · " + hace(x.publicado_en) + '</small></h2></div><div class="acc">' + verBtn(x.vitrina_id, x.titulo) + '<a class="btn" href="../vitrina/?v=' + esc(x.slug) + '" target="_blank" rel="noopener">Abrir pública ↗</a><button type="button" class="btn" data-fuera>Sacar de Explorar…</button></div><div class="f"></div></article>').join("");
  enlazarVer();
  $("lista").querySelectorAll("[data-fuera]").forEach((b) => b.onclick = () => formExplorar(b.closest("[data-v]")));
}
/* ---------- correos: anunciar herramientas listas y enviar el boletín ---------- */
const SITIO = new URL("../", location.href).href;
const fechaLarga = (f) => new Date(f + "T12:00:00").toLocaleDateString("es-CL", { day: "numeric", month: "long" });
async function correos() {
  $("lista").innerHTML = '<div class="vacio">Cargando…</div>';
  const hoy = new Date().toISOString().slice(0, 10), en45 = new Date(Date.now() + 45 * 864e5).toISOString().slice(0, 10), hace30 = new Date(Date.now() - 30 * 864e5).toISOString();
  const [est, int, op, vi] = await Promise.all([sb.rpc("mod_correos"), sb.rpc("mod_intereses"),
    sb.from("oportunidades").select("id,nombre,postul_inicio,postul_fin,evento_inicio,fuente").or("and(postul_fin.gte." + hoy + ",postul_fin.lte." + en45 + "),and(postul_inicio.gte." + hoy + ",postul_inicio.lte." + en45 + "),and(evento_inicio.gte." + hoy + ",evento_inicio.lte." + en45 + ")"),
    sb.from("vitrinas_publicadas").select("slug,titulo,lema,publicado_en").eq("en_explorar", true).gte("publicado_en", hace30).order("publicado_en", { ascending: false }).limit(6)]);
  if (est.error) { $("lista").innerHTML = '<div class="vacio">' + esc(est.error.message) + "</div>"; return; }
  const E = est.data, I = int.data || [];
  const cuando = (o) => o.postul_fin && o.postul_fin >= hoy && o.postul_fin <= en45 ? "Cierra el " + fechaLarga(o.postul_fin) : o.postul_inicio && o.postul_inicio >= hoy && o.postul_inicio <= en45 ? "Abre el " + fechaLarga(o.postul_inicio) : "Evento: " + fechaLarga(o.evento_inicio);
  const OPS = (op.data || []).map((o) => ({ id: o.id, nombre: o.nombre, cuando: cuando(o), url: o.fuente || "", orden: o.postul_fin || o.postul_inicio || o.evento_inicio })).sort((a, b) => a.orden.localeCompare(b.orden));
  const VIS = vi.data || [];
  const fun = FUNCIONES.map((f) => ({ ...f, n: (I.find((x) => x.funcion === f.k) || {}).pendientes || 0 })).sort((a, b) => b.n - a.n);
  $("lista").innerHTML =
    '<article class="caso"><div class="caso-cab"><h2>Estado de los envíos</h2></div><p class="texto">' + E.pendientes + " en cola · " + E.hoy + " enviados en 24 h · " + E.fallidos + " fallidos · " + E.boletin + " suscritos al boletín\nSalen desde forja@ por Resend, de a poco: hasta 40 por hora y 90 por día, bajo el límite del plan gratis (100 al día).</p>" +
      (E.errores.length ? E.errores.map((e) => '<p class="texto" style="color:var(--bad)">' + esc(e.tipo) + " · " + esc(e.error) + "</p>").join("") : "") + "</article>" +
    '<article class="caso" id="c-fun"><div class="caso-cab"><h2>Anunciar una herramienta lista</h2></div><p class="lead">Le llega solo a quienes tocaron «Avísame» en esa herramienta y no se han dado de baja. Cada persona recibe el aviso una vez.</p><div class="forma">' +
      '<label>Herramienta<select id="f-k">' + fun.map((f) => '<option value="' + f.k + '">' + esc(f.t) + " · " + f.n + (f.n === 1 ? " persona" : " personas") + "</option>").join("") + "</select></label>" +
      '<label>Título<input id="f-t" class="campo"></label><label>Texto<textarea id="f-x"></textarea></label><label>Enlace del botón<input id="f-u" class="campo"></label>' +
      '<div class="acc" style="border:0;padding:0"><button type="button" class="btn" id="f-prueba">Enviarme una prueba</button><button type="button" class="btn prim" id="f-env">Enviar</button></div></div></article>' +
    '<article class="caso" id="c-bol"><div class="caso-cab"><h2>Boletín</h2><span class="tag">' + E.boletin + " suscritos</span></div><p class=\"lead\">Una vez al mes como mucho. Lo que más sirve: herramientas nuevas, oportunidades que abren o cierran pronto y proyectos de la comunidad. Envíate una prueba antes.</p><div class=\"forma\">" +
      '<label>Asunto<input id="b-a" class="campo" placeholder="Forja en ' + new Date().toLocaleDateString("es-CL", { month: "long" }) + '"></label><label>Introducción<textarea id="b-i" placeholder="Dos o tres líneas para abrir."></textarea></label>' +
      '<label>Novedades de Forja (en cada una, la primera línea es el título y el resto el texto; separa una de otra con una línea que diga ---)<textarea id="b-n" style="min-height:140px"></textarea></label>' +
      "<b>Oportunidades de las próximas 6 semanas</b>" + (OPS.length ? OPS.map((o) => '<label class="check-l"><input type="checkbox" data-op="' + esc(o.id) + '" checked> ' + esc(o.nombre) + " <small>· " + esc(o.cuando) + "</small></label>").join("") : '<p class="lead">No hay fechas en las próximas semanas.</p>') +
      "<b>Proyectos de Explorar del último mes</b>" + (VIS.length ? VIS.map((v) => '<label class="check-l"><input type="checkbox" data-vi="' + esc(v.slug) + '"> ' + esc(v.titulo || v.slug) + "</label>").join("") : '<p class="lead">Aún no hay vitrinas nuevas en Explorar.</p>') +
      '<label>Cierre (opcional)<textarea id="b-c" style="min-height:70px"></textarea></label>' +
      '<div class="acc" style="border:0;padding:0"><button type="button" class="btn" id="b-prueba">Enviarme una prueba</button><button type="button" class="btn prim" id="b-env">Enviar a ' + E.boletin + " suscritos</button></div></div></article>" +
    '<article class="caso"><div class="caso-cab"><h2>Últimos avisos de vitrinas</h2></div><p class="lead">Lo que los proyectos enviaron a sus seguidores. Si algo rompe las normas, se modera la vitrina como siempre.</p>' +
      (E.vitrinas.length ? E.vitrinas.map((v) => '<p class="texto"><b>' + esc(v.titulo) + "</b> · " + esc(v.slug) + " · " + v.destinatarios + " · " + hace(v.en) + "\n" + esc(v.texto) + "</p>").join("") : '<p class="lead">Ninguno todavía.</p>') + "</article>";
  // herramienta
  const llenar = () => { const f = FUNCIONES.find((x) => x.k === $("f-k").value); $("f-t").value = f.t; $("f-x").value = f.d; $("f-u").value = SITIO + "proyectos/"; };
  $("f-k").onchange = llenar; llenar();
  const datosF = () => ({ funcion: $("f-k").value, titulo: $("f-t").value.trim(), texto: $("f-x").value.trim(), enlace: $("f-u").value.trim() });
  $("f-prueba").onclick = async () => { const { error } = await sb.rpc("mod_probar", { tipo: "funcion", datos: datosF() }); toast(error ? error.message : "Prueba en la cola: te llega en unos minutos."); };
  $("f-env").onclick = async (e) => {
    const b = e.target, d = datosF(); if (!d.titulo || !d.texto) { toast("Falta el título o el texto."); return; }
    if (b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Enviar de verdad? Toca de nuevo"; return; }
    const { data, error } = await sb.rpc("mod_anunciar_funcion", d); if (error) { toast(error.message); return; }
    toast(data + (data === 1 ? " aviso en la cola." : " avisos en la cola.")); correos();
  };
  // boletín
  const datosB = () => ({
    asunto: $("b-a").value.trim(), intro: $("b-i").value.trim(), cierre: $("b-c").value.trim(),
    novedades: $("b-n").value.split(/\n\s*-{3,}\s*\n/).map((x) => x.trim()).filter(Boolean).map((x) => { const l = x.split("\n"); return { titulo: l[0].trim(), texto: l.slice(1).join("\n").trim() }; }),
    oportunidades: OPS.filter((o) => $("lista").querySelector('[data-op="' + CSS.escape(o.id) + '"]').checked).map(({ nombre, cuando, url }) => ({ nombre, cuando, url })),
    vitrinas: VIS.filter((v) => $("lista").querySelector('[data-vi="' + CSS.escape(v.slug) + '"]').checked).map(({ slug, titulo, lema }) => ({ slug, titulo, lema })),
  });
  $("b-prueba").onclick = async () => { const d = datosB(); if (!d.asunto) { toast("Escribe el asunto."); return; } const { error } = await sb.rpc("mod_boletin", { datos: d, prueba: true }); toast(error ? error.message : "Prueba en la cola: te llega en unos minutos."); };
  $("b-env").onclick = async (e) => {
    const b = e.target, d = datosB(); if (!d.asunto) { toast("Escribe el asunto."); return; }
    if (b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Enviar a todos? Toca de nuevo"; return; }
    const { data, error } = await sb.rpc("mod_boletin", { datos: d, prueba: false }); if (error) { toast(error.message); return; }
    toast(data + " boletines en la cola. Salen de a poco."); correos();
  };
}
/* --- Documentos: versiones de los documentos legales ---
   Una versión nueva vive como borrador en el repositorio (legal/<versión>/ y legal/versiones.json) y no existe para nadie
   hasta que se avisa aquí a TODAS las cuentas (correo de servicio por Resend, en tandas, más un aviso en Forja).
   Rige 15 días después del aviso y la base no deja activarla antes. La huella (SHA-256 del texto) amarra el aviso al texto
   probado: si el texto cambia después de la prueba hay que probar de nuevo, y una versión ya avisada no se puede cambiar. */
async function huellaDe(version, docs) {
  const textos = await Promise.all(docs.map((d) => fetch(u("legal/" + version + "/" + d + ".json"), { cache: "no-store" }).then((r) => r.text())));
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(docs.join(",") + "\n" + textos.join("\n")));
  return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
async function documentos() {
  $("lista").innerHTML = '<div class="vacio">Cargando…</div>';
  const [pn, M] = await Promise.all([sb.rpc("mod_legal_panel"), fetch(u("legal/versiones.json"), { cache: "no-store" }).then((r) => r.json())]);
  if (pn.error) { $("lista").innerHTML = '<div class="vacio">' + esc(pn.error.message) + "</div>"; return; }
  const P = pn.data, db = new Map(P.versiones.map((v) => [v.version, v]));
  const huellas = await Promise.all(M.versiones.map((m) => huellaDe(m.id, m.docs).catch(() => "")));
  const fila = (m, i) => {
    const v = db.get(m.id), h = huellas[i];
    const estado = !v || !v.avisada_en ? "Borrador sin avisar" : v.reemplazada_por ? "Avisada, reemplazada por " + v.reemplazada_por + " (no rigió)" : v.version === P.vigente ? "Vigente desde el " + fechaDia(v.rige) : v.rige > P.hoy || v.pendientes ? "Avisada: rige el " + fechaDia(v.rige) : "Anterior (rigió desde el " + fechaDia(v.rige) + ")";
    let cuerpo = '<p class="texto">' + esc(m.resumen) + "</p><p class=\"lead\">Documentos: " + m.docs.map((d) => esc(NOMBRE_DOC[d] || d)).join(", ") + (m.inactivas ? " · incluye la regla de cuentas inactivas" : "") + "</p>" +
      '<div class="acc" style="border:0;padding:0"><a class="btn" href="' + u("documentos/?v=" + encodeURIComponent(m.id)) + '" target="_blank" rel="noopener">Revisar lo que cambia</a><a class="btn" href="' + u("terminos/?v=" + encodeURIComponent(m.id) + "&comparar=1") + '" target="_blank" rel="noopener">Comparar los Términos</a></div>';
    if (v && v.avisada_en) {
      if (v.huella && h && v.huella !== h) cuerpo += '<p class="texto" style="color:var(--bad)">El texto de esta versión cambió después de avisarla. Una versión avisada no se puede cambiar: devuelve el texto en el repositorio y, si hace falta un cambio, crea una versión nueva y avísala.</p>';
      if (v.destinatarios != null) cuerpo += '<p class="texto">Aviso por correo: ' + v.enviados + " de " + v.destinatarios + " enviados · " + v.pendientes + " en la cola · " + v.fallidos + " fallidos" +
        (v.pendientes ? "\nMientras queden avisos en la cola, esta versión no se activa aunque llegue su fecha." : "") + (v.fallidos ? "\nLos fallidos no se reintentan solos: revisa el error en la pestaña Correos." : "") + "</p>";
    } else {
      const probada = v && v.probada_en && v.huella === h;
      cuerpo += '<div class="forma"><b>Para publicarla</b><p class="lead">1. Revisa lo que cambia y los cinco documentos. 2. Envíate la prueba del aviso y léela en tu correo. 3. Avisa a todas las cuentas (' + P.cuentas + "). Rige 15 días después del aviso" + (P.cuentas > 80 ? ", más los días que tarda la cola en enviarlo a todas" : "") + ", y no se puede activar antes.</p>" +
        (v && v.probada_en && v.huella !== h ? '<p class="texto" style="color:var(--warn)">El texto cambió después de la última prueba: envíate otra antes de avisar.</p>' : "") +
        '<div class="acc" style="border:0;padding:0"><button type="button" class="btn" data-probar="' + esc(m.id) + '">' + (probada ? "Enviarme otra prueba" : "Enviarme una prueba del aviso") + "</button>" +
        '<button type="button" class="btn prim" data-avisar="' + esc(m.id) + '"' + (probada ? "" : " disabled") + ">Avisar a todas las cuentas</button></div>" +
        (probada ? '<p class="lead">Prueba enviada ' + hace(v.probada_en) + ". Si avisas hoy, rige el " + fechaDia(new Date(Date.now() + (15 + Math.max(Math.ceil(P.cuentas / 80) - 1, 0)) * 864e5).toLocaleDateString("en-CA", { timeZone: "America/Santiago" })) + ".</p>" : '<p class="lead">El botón para avisar se activa después de enviarte la prueba.</p>') + "</div>";
    }
    return '<article class="caso"><div class="caso-cab"><h2>Versión ' + esc(m.id) + '</h2><span class="tag' + (!v || !v.avisada_en ? " mal" : "") + '">' + esc(estado) + "</span></div>" + cuerpo + "</article>";
  };
  const I = P.inactivas;
  $("lista").innerHTML = '<p class="lead" style="margin-bottom:12px">Ninguna versión nueva se publica sin avisarla antes a todas las cuentas por correo, como aviso de servicio. La vigente hoy es la ' + esc(P.vigente || "—") + ".</p>" +
    M.versiones.map((m, i) => [m, i]).reverse().map(([m, i]) => fila(m, i)).join("") +
    '<article class="caso"><div class="caso-cab"><h2>Cuentas inactivas</h2><span class="tag">' + (I.desde ? "Regla activa desde el " + esc(fechaDia(I.desde)) : "Regla aún no vigente") + "</span></div>" +
    '<p class="texto">' + I.aviso1 + " con el primer aviso (90 días) · " + I.aviso2 + " con el segundo (120 días) · " + I.borradas + " borradas (150 días)</p>" +
    '<p class="lead">Se revisa sola cada día. Nunca toca cuentas con plan pagado, del equipo Digital Monster o con una vitrina publicada, y solo borra si los dos avisos salieron. Entrar a Forja reinicia el conteo.</p></article>';
  const vers = (id) => M.versiones.find((x) => x.id === id), hDe = (id) => huellas[M.versiones.findIndex((x) => x.id === id)];
  $("lista").querySelectorAll("[data-probar]").forEach((b) => b.onclick = async () => {
    const m = vers(b.dataset.probar); b.disabled = true;
    const { data, error } = await sb.rpc("mod_legal_probar", { version: m.id, resumen: m.resumen, documentos: m.docs, inactivas: !!m.inactivas, huella: hDe(m.id) });
    b.disabled = false; if (error) { toast(limite(error) || error.message); return; }
    toast("Prueba en la cola: te llega en unos minutos. Si avisas hoy, rige el " + fechaDia(data) + "."); documentos();
  });
  $("lista").querySelectorAll("[data-avisar]").forEach((b) => b.onclick = async () => {
    const m = vers(b.dataset.avisar);
    if (b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Avisar a las " + P.cuentas + " cuentas? No se puede deshacer. Toca de nuevo"; return; }
    b.disabled = true;
    const { data, error } = await sb.rpc("mod_legal_avisar", { version: m.id, huella: hDe(m.id) });
    if (error) { b.disabled = false; toast(/PROBAR_DE_NUEVO/.test(error.message) ? "El texto cambió desde la prueba: envíate otra antes de avisar." : /YA_AVISADA/.test(error.message) ? "Esta versión ya se avisó." : error.message); return; }
    try { sessionStorage.removeItem("forja-legal"); } catch (e) {}
    toast("Aviso en la cola para " + data.destinatarios + " cuentas. Rige el " + fechaDia(data.rige) + "."); documentos();
  });
}
function registro() {
  const A = { suspender: "Suspendió", restaurar: "Restauró", reportes_desestimado: "Desestimó reportes", reportes_mala_fe: "Marcó mala fe", explorar_quitar: "Sacó de Explorar", explorar_permitir: "Permitió Explorar", responder: "Respondió un mensaje", sugerencia: "Revisó una sugerencia", anunciar_funcion: "Anunció una herramienta", boletin: "Envió el boletín", documentos_aviso: "Avisó una versión nueva de los documentos", cuenta_inactiva: "Se borró una cuenta inactiva" };
  $("lista").innerHTML = D.registro.length ? '<div class="caso"><div class="reg">' + D.registro.map((r) => "<span>" + esc(String(r.en).slice(0, 16).replace("T", " ")) + "</span><div><b>" + esc(A[r.accion] || r.accion) + "</b>" + (r.detalle && (r.detalle.mensaje || r.detalle.motivo) ? " · " + esc(MOTIVOS[r.detalle.motivo] || "") + " " + esc((r.detalle.mensaje || "").slice(0, 120)) : "") + "</div>").join("") + "</div></div>" : '<div class="vacio">Aún no hay decisiones registradas.</div>';
}
