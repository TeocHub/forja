<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Moderación</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=Geist+Mono:wght@400..700&family=Familjen+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: moderación — al costado (arriba en tablet angosta y celular) las ocho pestañas con su ícono y lo pendiente; al centro
   la pestaña abierta. Cada caso es un expediente sobre la mesa, con sus papeletas (reportes) y sus decisiones; los correos se
   escriben a la izquierda y se ven a la derecha tal como llegan (correos.js, el mismo que usa la Edge Function). */
.wrap{max-width:1320px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mod{display:grid;grid-template-columns:232px minmax(0,1fr);gap:28px;align-items:start}
.m-lado{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;padding:18px 0;border-radius:14px;background:var(--mesa);border:1px solid var(--line)}
.m-tit{padding:0 18px;display:flex;flex-direction:column;gap:2px}
.m-tit small{font:400 11px var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.m-tit b{font-family:var(--f-display);font-weight:800;font-stretch:var(--ancho);font-size:22px;line-height:1.05}
.m-tabs{display:flex;flex-direction:column;gap:4px}
.m-tabs button{min-height:50px;margin-left:12px;margin-right:-1px;padding:0 14px;border:1px solid transparent;border-right:0;border-radius:10px 0 0 10px;background:transparent;color:var(--fg);display:flex;align-items:center;gap:10px;font:700 15px var(--f-body);text-align:left;cursor:pointer}
.m-tabs button .fx-ico{color:var(--muted);flex:none}
.m-tabs button:hover{background:color-mix(in srgb,var(--card) 55%,transparent)}
.m-tabs button[aria-selected=true]{background:var(--bg);border-color:var(--line)}
.m-tabs button[aria-selected=true] .fx-ico{color:var(--fg)}
.m-tabs .co{display:none}
.m-tabs .n{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:6px;display:grid;place-items:center;font:700 12px var(--f-num);background:var(--btn);color:var(--btn-tx)}
.m-cuerpo{display:flex;flex-direction:column;gap:18px;min-width:0}
.m-cab{display:flex;flex-direction:column;gap:6px}
.m-cab h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.6vw,44px);line-height:1.02;letter-spacing:-.03em;margin:0}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:72ch}
@media (max-width:960px){
  .mod{grid-template-columns:minmax(0,1fr);gap:16px}
  .m-lado{top:0;z-index:6;flex-direction:row;align-items:center;padding:6px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--mesa) 94%,transparent);backdrop-filter:blur(8px)}
  .m-lado::-webkit-scrollbar{display:none}
  .m-tit{display:none}
  .m-tabs{flex-direction:row;gap:4px}
  .m-tabs button{margin:0;border:1px solid transparent;border-radius:10px;white-space:nowrap;min-height:46px;font-size:14px;padding:0 12px}
}
@media (max-width:560px){.m-tabs .lg{display:none}.m-tabs .co{display:inline}.m-tabs button{flex-direction:column;justify-content:center;gap:2px;font-size:11.5px;min-width:72px;padding:4px 6px;position:relative}.m-tabs .n{position:absolute;top:3px;right:6px;height:18px;min-width:18px;font-size:10.5px;padding:0 4px}}

/* expedientes y papeletas */
.mesa{display:flex;flex-direction:column;gap:16px}
.caso{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.caso-cab{display:flex;justify-content:space-between;gap:8px 14px;align-items:flex-start;flex-wrap:wrap}
.caso-cab>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.ficha{font:400 11.5px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.caso h2{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.timbre{display:inline-flex;align-items:center;font:700 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:4px;padding:3px 9px 2px;margin:3px;transform:rotate(-2.5deg);white-space:nowrap}
.timbre.tinta{color:var(--fg);transform:rotate(1.5deg)}
.timbre.mal{color:var(--bad)}
.timbre.ojo{color:var(--warn)}
.papeles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px;border-radius:12px;background:var(--mesa)}
.papeleta{position:relative;background:var(--card);border:1px solid var(--line);border-left:3px dashed var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:0 4px 10px var(--sombra)}
.papeleta:nth-child(2n){transform:rotate(.6deg)}.papeleta:nth-child(2n+1){transform:rotate(-.5deg)}
.papeleta b{font-family:var(--f-display);font-weight:800;font-size:16px}
.papeleta p{margin:0;white-space:pre-wrap;font-size:14.5px}
.papeleta small{color:var(--muted);font-size:12.5px}
.papeleta .sosp{color:var(--warn);font-weight:700}
.carta{margin:0;white-space:pre-wrap;background:var(--mesa);border-radius:10px;padding:14px 16px;font-size:15px;line-height:1.55;border-left:3px solid var(--line)}
.carta.nota{border-left-color:var(--bad)}
.carta.nota b{display:block;font:700 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--bad);margin-bottom:4px}
.acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.acc.sin{border:0;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:14px;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:0 14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--fg)}
.btn.peligro{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.prim{background:var(--btn);color:var(--btn-tx);border-color:var(--btn);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.btn .fx-ico{width:17px;height:17px}
/* botones que timbran una decisión (sugerencias) */
.sellos{display:flex;gap:10px;flex-wrap:wrap}
.sello{font:700 12px var(--f-num);letter-spacing:.1em;text-transform:uppercase;min-height:42px;padding:0 14px;border:2px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:4px;background:transparent;cursor:pointer;color:var(--muted);margin:3px}
.sello.si{color:var(--fg);transform:rotate(-1.5deg)}
.sello:hover{background:var(--suave)}
.forma{display:flex;flex-direction:column;gap:10px;background:var(--mesa);border:1px solid var(--line);border-radius:12px;padding:14px}
.forma label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--fg)}
.forma label small{font-weight:400;color:var(--muted)}
.forma select,.forma textarea,.forma .campo{font:inherit;font-size:15px;font-weight:400;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:9px 11px;min-height:44px}
.forma textarea{min-height:110px;resize:vertical;line-height:1.5}
.forma .sub{font:700 11px var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.marcas{display:flex;flex-wrap:wrap;gap:8px}
.marca-l{display:inline-flex;align-items:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;font-size:14px;font-weight:400!important;cursor:pointer;flex-direction:row!important}
.marca-l:has(input:checked){border-color:var(--fg);background:var(--suave)}
.marca-l input{width:18px;height:18px;accent-color:var(--fg);margin:0}
.marca-l small{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.vacio{border:1.5px dashed var(--line);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.vacio .fx-ico{width:30px;height:30px;color:var(--muted)}
.vacio b{color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:18px}
/* números grandes (estado de envíos, áreas de sugerencias, cuentas inactivas) */
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cifra{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.cifra b{font:600 28px var(--f-num);line-height:1.1}
.cifra span{font-size:13px;color:var(--muted)}
.cifra.mal b{color:var(--bad)}
.h2s{font-family:var(--f-display);font-weight:800;font-size:22px;margin:10px 0 0}
/* registro: una bitácora con renglones */
.bitacora{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px}
.renglon{display:grid;grid-template-columns:132px minmax(0,1fr);gap:4px 14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.renglon:last-child{border-bottom:0}
.renglon time{font:400 12px var(--f-num);color:var(--muted);padding-top:2px}
.dia{font:700 11px var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.renglon{grid-template-columns:minmax(0,1fr)}}
/* escribir un correo y verlo como llega */
.taller-c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:16px;align-items:start}
@media (max-width:1100px){.taller-c{grid-template-columns:minmax(0,1fr)}}
.pv{position:sticky;top:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--mesa)}
@media (max-width:1100px){.pv{position:static}}
.pv-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.pv-as{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.pv-as small{font:400 10.5px var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pv-as b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-op{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pv-op button{font:inherit;font-size:13px;min-height:36px;padding:0 11px;border:0;border-left:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.pv-op button:first-child{border-left:0}
.pv-op button[aria-pressed=true]{background:var(--btn);color:var(--btn-tx);font-weight:700}
.pv-marco{padding:14px;display:flex;justify-content:center;max-height:780px;overflow:auto}
.pv-marco iframe{display:block;width:100%;max-width:640px;border:0;border-radius:8px;background:#F4F4F2;min-height:300px}
.pv.cel .pv-marco iframe{max-width:375px;box-shadow:0 0 0 8px #161616,0 10px 30px var(--sombra);border-radius:22px}
.pv pre{margin:0;width:100%;white-space:pre-wrap;font:400 13px/1.55 var(--f-num);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.pv-nota{margin:0;padding:8px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--card)}
/* pasos de una versión de los documentos: Revisar → Probar → Avisar, como tres marcas de una regla */
.pasos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field)}
.paso{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-left:1px solid var(--line);color:var(--muted);font-size:13px}
.paso:first-child{border-left:0}
.paso i{display:block;width:2px;height:10px;background:currentColor;margin-bottom:4px}
.paso b{font-family:var(--f-display);font-weight:800;font-size:15px;color:inherit}
.paso.ya{color:var(--fg);background:var(--suave)}.paso.ya i{height:16px}
.paso.aqui{color:var(--fg)}.paso.aqui i{height:22px;background:var(--cat)}
details.ver-correo>summary{list-style:none;cursor:pointer;display:inline-flex}
details.ver-correo>summary::-webkit-details-marker{display:none}
details.ver-correo[open]>summary{margin-bottom:12px}
dialog.ver{border:0;padding:0;width:min(1000px,96vw);height:90vh;border-radius:14px;overflow:hidden;background:var(--card)}
dialog.ver::backdrop{background:rgba(18,18,18,.6)}
.ver-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px 6px 14px;background:var(--btn);color:var(--btn-tx);font:400 12px var(--f-num);letter-spacing:.06em;text-transform:uppercase}
.ver-cab button{font:inherit;border:0;background:none;color:inherit;font-size:24px;min-width:44px;min-height:40px;cursor:pointer}
#ver-c{height:calc(90vh - 52px);overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="fx-empty">Cargando…</div></main>
</div>
<dialog class="ver" id="ver"><div class="ver-cab"><span id="ver-t">Vista de moderación</span><button type="button" id="ver-x" aria-label="Cerrar">×</button></div><div id="ver-c"></div></dialog>
<script type="module">
import { sb, $, esc, toast, navApp, conSesion, limite, hace, u, NOMBRE_DOC, fechaDia, ico, ICONOS } from "../js/forja.js";
import { pintarVitrina, CSS_VITRINA } from "../js/vitrina.js";
import { FUNCIONES, AREAS, AREAS_SUGERENCIA } from "../js/planes.js";
import { armar } from "../js/correos.js";
import { MOTIVO_PRECIO, dinero, porUnidad } from "../js/precios.js";
import { nombrePieza } from "../js/piezas.js";
document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_VITRINA + "</style>");
navApp(null);
const MOTIVOS = { estafa: "Estafa o engaño", ofensivo: "Odio, acoso o violencia", menores: "Pone en riesgo a menores", derechos: "Obras ajenas como propias", datos: "Datos personales de otros", spam: "Spam o enlaces dañinos", otro: "Otra cosa" };
// Plantillas para explicarle al dueño el porqué (siempre se pueden editar antes de enviar).
const PLANTILLA = {
  estafa: "Tu vitrina promete o pide algo que no pudimos verificar como real. Para volver a publicarla, muestra el estado real del proyecto y elimina cualquier pedido de pago que no puedas cumplir.",
  ofensivo: "Tu vitrina incluye contenido que ataca o acosa a personas o grupos. Quita ese contenido para poder publicarla de nuevo.",
  menores: "Tu vitrina incluye contenido que pone en riesgo a menores de edad, lo que está prohibido en Forja.",
  derechos: "Tu vitrina usa obras (imágenes, música, personajes o marcas) de otras personas como si fueran tuyas o para vender. Quítalas o indica claramente su autoría y que no se venden como propias.",
  datos: "Tu vitrina muestra datos personales de otra persona sin su consentimiento. Quítalos para poder publicarla de nuevo.",
  spam: "Tu vitrina parece estar vacía, repetida o pensada para promocionar otra cosa. Agrega el contenido real de tu proyecto para publicarla de nuevo.",
  otro: "",
};
// Íconos propios de Moderación, dibujados como los de taller (trazo, puntas redondas).
const MI = { bandera: "M5 21V4 M5 4h11l-2 4 2 4H5", sobre: "M3 6h18v12H3z M3 6l9 7 9-7", papeleta: "M6 3h12v18l-3-2-3 2-3-2-3 2z M9 8h6 M9 12h6",
  avion: "M21 3L3 10.5l7 2.5 2.5 7z M10 13l5-5", hoja: "M6 3h9l4 4v14H6z M14.5 3v4.5H19 M9 12h7 M9 16h5", reloj: "M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 7v5l3 2" };
Object.assign(ICONOS, MI);
// Las ocho pestañas: nombre, ícono y para qué sirve.
const TABS = [
  ["reportes", "Reportes", "bandera", "Vitrinas y precios compartidos que alguien reportó. Nada se oculta solo: mira las pruebas y decide."],
  ["mensajes", "Mensajes y apelaciones", "sobre", "Lo que escriben desde Mi cuenta y las apelaciones de vitrinas suspendidas. La respuesta les llega como aviso."],
  ["sugerencias", "Sugerencias", "papeleta", "Ideas de la comunidad desde la casilla de Planes. Tímbralas y, si quieres, responde."],
  ["suspendidas", "Suspendidas", "pausa", "Vitrinas que no se pueden ver ni publicar hasta que se restauren."],
  ["explorar", "En Explorar", "brujula", "Las vitrinas que hoy aparecen en Explorar."],
  ["correos", "Correos", "avion", "Avisos de herramientas listas y el boletín. Escribe a la izquierda y mira a la derecha cómo llega."],
  ["documentos", "Documentos", "hoja", "Versiones de los documentos legales y cuentas inactivas. Ninguna versión se publica sin avisarla antes a todas las cuentas."],
  ["registro", "Registro", "reloj", "Cada decisión queda anotada aquí."],
];
let D = null, pest = (location.hash.slice(1) && TABS.some((t) => t[0] === location.hash.slice(1))) ? location.hash.slice(1) : "reportes";

conSesion($("app"), async () => {
  const { data: adm } = await sb.rpc("soy_admin");
  if (adm !== true) { $("app").innerHTML = vacio("bandera", "Solo para moderación", "Esta página es solo para el equipo de moderación de Forja."); return; }
  await cargar();
});
async function cargar() {
  const { data, error } = await sb.rpc("mod_panel");
  if (error) { $("app").innerHTML = vacio("bandera", "No se pudo cargar el panel", error.message); return; }
  D = data; pintar();
}
const vacio = (i, t, x) => '<div class="vacio">' + ico(i, 30) + "<b>" + esc(t) + "</b>" + (x ? "<span>" + esc(x) + "</span>" : "") + "</div>";
const num = (n) => String(n).padStart(2, "0");
function pintar() {
  const n = { reportes: D.reportes.length + (D.precios || []).length, mensajes: D.mensajes.length, sugerencias: (D.sugerencias || []).length };
  const t = TABS.find((x) => x[0] === pest);
  $("app").innerHTML = '<div class="mod"><aside class="m-lado" aria-label="Pestañas de moderación"><div class="m-tit"><small>Forja</small><b>Moderación</b></div>' +
    '<div class="m-tabs" role="tablist" aria-orientation="vertical">' + TABS.map(([k, nombre, i]) => '<button type="button" role="tab" id="tab-' + k + '" aria-controls="lista" data-t="' + k + '" aria-selected="' + (k === pest) + '">' + ico(i, 21) + '<span class="lg">' + nombre + '</span><span class="co">' + nombre.split(" ").pop() .replace(/^apelaciones$/, "Mensajes") + "</span>" + (n[k] ? '<span class="n" aria-label="' + n[k] + ' pendientes">' + n[k] + "</span>" : "") + "</button>").join("") + "</div></aside>" +
    '<div class="m-cuerpo"><header class="m-cab"><h1>' + t[1] + '</h1><p class="lead">' + t[3] + '</p></header><div id="lista" role="tabpanel" aria-labelledby="tab-' + pest + '"></div></div></div>';
  $("app").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { pest = b.dataset.t; history.replaceState(null, "", "#" + pest); pintar(); });
  ({ reportes, mensajes, sugerencias, suspendidas, explorar, correos, documentos, registro })[pest]();
}
const verBtn = (id, t) => '<button type="button" class="btn" data-ver="' + id + '" data-tt="' + esc(t || "") + '">' + ico("ojo", 17) + "Ver vitrina</button>";
function enlazarVer() {
  $("lista").querySelectorAll("[data-ver]").forEach((b) => b.onclick = async () => {
    const { data, error } = await sb.rpc("mod_vitrina", { v: b.dataset.ver });
    if (error || !data) { toast("No se pudo abrir la vitrina."); return; }
    $("ver-t").textContent = "Vista de moderación · " + (b.dataset.tt || data.slug) + (data.suspendida ? " · suspendida" : "");
    $("ver").showModal(); pintarVitrina($("ver-c"), data.datos, { previa: true });
  });
}
$("ver-x").onclick = () => $("ver").close();

/* ---------- reportes: cada vitrina es un expediente con sus papeletas ---------- */
function reportes() {
  const P = D.precios || [];
  if (!D.reportes.length && !P.length) { $("lista").innerHTML = vacio("bandera", "No hay reportes pendientes", "Cuando alguien reporte una vitrina o un precio compartido, aparece aquí."); return; }
  $("lista").innerHTML = (D.reportes.length ? '<div class="mesa">' + D.reportes.map((c, i) =>

    if (b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Avisar a las " + P.cuentas + " cuentas? No se puede deshacer. Toca de nuevo"; return; }
    b.disabled = true;
    const { data, error } = await sb.rpc("mod_legal_avisar", { version: m.id, huella: hDe(m.id) });
    if (error) { b.disabled = false; toast(/PROBAR_DE_NUEVO/.test(error.message) ? "El texto cambió desde la prueba: envíate otra antes de avisar." : /YA_AVISADA/.test(error.message) ? "Esta versión ya se avisó." : error.message); return; }
    try { sessionStorage.removeItem("forja-legal"); } catch (e) {}
    toast("Aviso en la cola para " + data.destinatarios + " cuentas. Rige el " + fechaDia(data.rige) + "."); documentos();
  });
}
/* ---------- registro: una bitácora por día ---------- */
function registro() {
  const A = { suspender: "Suspendió", restaurar: "Restauró", reportes_desestimado: "Desestimó reportes", reportes_mala_fe: "Marcó mala fe", explorar_quitar: "Sacó de Explorar", explorar_permitir: "Permitió Explorar", responder: "Respondió un mensaje", sugerencia: "Revisó una sugerencia", anunciar_funcion: "Anunció una herramienta", boletin: "Envió el boletín", documentos_aviso: "Avisó una versión nueva de los documentos", cuenta_inactiva: "Se borró una cuenta inactiva (150 días)", inactiva_aviso: "Aviso por inactividad", inactiva_vuelve: "Una cuenta avisada volvió a entrar", inactiva_error: "No se pudo revisar una cuenta inactiva", precio_quitado: "Quitó un precio compartido", precio_cerrado: "Cerró reportes de un precio que ya no estaba", precio_desestimado: "Desestimó reportes de un precio", precio_mala_fe: "Marcó mala fe (precio)" };
  const extra = (r) => { const d = r.detalle || {};
    if (r.accion === "inactiva_aviso") return " · " + (d.etapa === 2 ? "segundo (120 días)" : "primero (90 días)") + (d.borra ? ", se borraría el " + esc(fechaDia(d.borra)) : "");
    if (r.accion === "inactiva_vuelve") return " · tenía el " + (d.etapa === 2 ? "segundo" : "primer") + " aviso; todo se reinició";
    if (r.accion === "inactiva_error") return " · código " + esc(d.error || "");
    if (/^precio_/.test(r.accion)) return " · " + esc(d.proveedor || "") + (d.mensaje ? " · " + esc(d.mensaje.slice(0, 120)) : "");
    return d.mensaje || d.motivo ? " · " + esc(MOTIVOS[d.motivo] || "") + " " + esc((d.mensaje || "").slice(0, 120)) : ""; };
  if (!D.registro.length) { $("lista").innerHTML = vacio("reloj", "Aún no hay decisiones registradas", ""); return; }
  let dia = "";
  $("lista").innerHTML = '<div class="bitacora">' + D.registro.map((r) => { const f = String(r.en), d = f.slice(0, 10), cab = d !== dia ? '<div class="dia">' + esc(fechaDia(d)) + "</div>" : ""; dia = d;
    return cab + '<div class="renglon"><time datetime="' + esc(f) + '">' + esc(f.slice(11, 16)) + "</time><div><b>" + esc(A[r.accion] || r.accion) + "</b>" + extra(r) + "</div></div>"; }).join("") + "</div>";
}
