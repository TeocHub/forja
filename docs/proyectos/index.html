<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Proyectos</title>
<meta name="description" content="Tus proyectos y cotizaciones en Forja.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=Geist+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: inventario — barra para plantar ideas (la categoría como etiqueta colgante) y fichas en mosaico, cada una con su F de avance, su etiqueta y su timbre */

.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5vw,44px);line-height:1.02;letter-spacing:-.03em;margin:0}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
button,input{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,input,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:20px}
#app>div:empty{display:none}

.semilla{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.semilla:focus-within{border-color:var(--fg)}
.semilla .line{display:flex;gap:8px;align-items:center}
.semilla input{flex:1;min-width:0;font-family:var(--f-display);font-size:21px;font-weight:700;font-stretch:var(--ancho);border:0;background:transparent;padding:6px 4px}
.semilla input::placeholder{color:var(--muted)}
.semilla input:focus-visible{outline:none}
.plantar{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-tx);border-radius:10px;padding:0 20px;min-height:48px;white-space:nowrap}
.plantar .fx-chispa{fill:var(--tc);stroke:var(--tc)}
.plantar:disabled{opacity:.6}
.a-semillero{font-size:13px;color:var(--muted);text-decoration:none;border-top:1px dashed var(--line);padding-top:8px}
.a-semillero b{color:var(--fg)}
.a-semillero:hover{color:var(--fg)}
.a-semillero.fuerte{color:var(--fg);font-size:14px}
.tipos{display:flex;flex-wrap:wrap;gap:8px}
.tipos .fx-etq{min-height:40px}

.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cupo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:16px 0 12px;display:flex;flex-direction:column;gap:8px}
.cupo-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cupo-top span{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.cupo p{margin:0;font-size:14px}
.cupo.lleno{border-color:var(--fg)}
.cupo.pasado{border-color:var(--warn);background:var(--warn-soft)}
.cupo.mas{flex-direction:row;gap:10px;align-items:baseline}
.cupo-top b{font-family:var(--f-num);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.candado{vertical-align:-1px;color:var(--e-pausa)}
.semilla input:disabled{cursor:not-allowed}
.como{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;border-top:1px dashed var(--line);padding-top:10px}
.como-t{font-size:13px;color:var(--muted);margin-right:2px}
.como button{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:0 12px;min-height:40px;cursor:pointer}
.como button[aria-checked="true"]{border-color:var(--fg);color:var(--fg);background:var(--suave);font-weight:700}
.como-d{flex-basis:100%;font-size:12.5px;color:var(--muted)}
.buscador{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.b-fila{display:flex;gap:8px;flex-wrap:wrap}
.b-fila input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 14px;min-height:44px;font-size:15px}
.b-fila select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;min-height:44px;font:inherit;color:var(--fg)}
.estados-f{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.estados-f button{flex:none;display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;min-height:44px;font-size:14px}
.estados-f button i{width:15px;height:15px;background:currentColor;-webkit-mask:var(--sello) center/contain no-repeat;mask:var(--sello) center/contain no-repeat;color:var(--muted)}
.estados-f button .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.estados-f button[aria-pressed="true"]{border-color:var(--fg);background:var(--suave);font-weight:700}
.estados-f button[aria-pressed="true"] i{color:var(--fg)}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;text-decoration:none;color:var(--fg);min-height:168px;--f-hueco:var(--card);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.tile:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:0 8px 20px var(--sombra)}
.tile .arriba{grid-column:1;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0}
.tile .fx-f{grid-column:2;grid-row:1/3;width:52px;height:52px;margin:-4px -4px 0 0}
.tile .av{display:flex;align-items:center;gap:8px;flex:1;max-width:60%}
.tile .av .fx-avance{flex:1}
.tile .av b{font-family:var(--f-num);font-size:12px;color:var(--fg)}
.tile.e-pausa{background:repeating-linear-gradient(135deg,var(--card) 0 14px,var(--field) 14px 28px)}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile .fx-etq{font-size:12.5px;padding:3px 12px 3px 22px}
.tile .fx-etq::before{left:8px}
.tile .fx-estado{font-size:10.5px;padding:2px 7px 1px}
.tile .fx-estado::before{width:12px;height:12px}
.tile h3{grid-column:1/-1;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.1;letter-spacing:-.02em;margin:6px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.tile .res{grid-column:1/-1;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pie{grid-column:1/-1;align-self:end;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.tile .estado{font-family:var(--f-num);font-size:11px;letter-spacing:.04em}
.tile.e-archivado{opacity:.6}
.tile .de,.tile .en-vitrina,.tile .reservado{grid-column:1/-1}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px 22px;color:var(--muted);text-align:center}
.vacio b{color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:19px;display:block;margin-bottom:4px}

.cot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.cot:hover{border-color:var(--tc)}
.cot h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.cot .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.cot small{color:var(--muted);font-size:12px;margin-top:auto}
.skeleton{height:140px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--field),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.tile{transition:none}}
.en-vitrina{justify-self:start;display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.en-vitrina .fx-ico{width:14px;height:14px}
.compartidos{margin-top:32px}.compartidos h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 2px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.tile .de{font-size:12.5px;color:var(--muted)}
.reservado{justify-self:start;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.eq-k{margin:0 0 2px;font-family:var(--f-num);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="skeleton"></div></main>
</div>

<script type="module">
import { sb, $, esc, toast, hace, fecha, navApp, espacio, espacioActual, conSesion, avisos, plan, LIMITES, tope, limite, editable, MAS_PRONTO, MAS_LINK, fAvance, etiqueta, chispa, ico } from "../js/forja.js";
import { TIPOS, ESTADOS, tc, avance } from "../js/guias.js";
import { sendero } from "../js/ayuda.js";
import { FORMATOS } from "../js/brujula.js";
import { CREADORES, CREADOR_INICIAL, ETAPAS, estado as estadoRuta, etapaIndice, etapaNombre } from "../js/ruta.js";
import { plantarProyecto } from "../js/semillero.js";
navApp("proyectos");
if (location.hash === "#cotizaciones") location.replace("../cotizaciones/");

// Enlaces antiguos (../proyectos/#p=…) llevan a la nueva página de proyecto.
const viejo = location.hash.match(/^#p=([0-9a-f-]{36})/);
if (viejo) location.replace("../proyecto/?p=" + viejo[1]);

let ESP = null, EA = null, COMP = [], LECT = [], PL = { mas: false }, PROYS = [], COTS = [], AV = {}, vista = location.hash === "#cotizaciones" ? "cot" : "proy", tipoNuevo = "historia";
let F = { tipo: "", estado: "", q: "", orden: "recientes" };
try { Object.assign(F, JSON.parse(localStorage.getItem("forja-filtros") || "{}")); F.q = ""; } catch (e) {}
const guardarF = () => { try { localStorage.setItem("forja-filtros", JSON.stringify(F)); } catch (e) {} };

conSesion($("app"), async () => {
  ESP = await espacio(); EA = await espacioActual();
  if (EA && EA.tipo === "personal") [COMP, LECT] = await Promise.all([sb.rpc("mis_compartidos").then((r) => r.data || []), sb.rpc("mis_lecturas").then((r) => (r.data || []).filter((x) => x.abierta))]);
  if (!ESP) throw new Error("sin espacio");
  PL = await plan();
  const [p, se, vi, tx, rf] = await Promise.all([
    sb.from("proyectos").select("id,nombre,tipo,estado,resumen,ejes,formato,acceso,ruta,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false }),
    sb.from("secciones").select("proyecto_id,avance,peso").eq("espacio_id", ESP),
    sb.from("vitrinas").select("proyecto_id,publicada").eq("espacio_id", ESP),
    sb.from("secciones").select("id", { count: "exact", head: true }).eq("espacio_id", ESP).neq("texto", ""),
    sb.from("referentes").select("id", { count: "exact", head: true }).eq("espacio_id", ESP),
  ]);
  // primeros pasos: se marcan solos con lo que ya existe
  HECHO.taller = (tx.count || 0) > 0; HECHO.referentes = (rf.count || 0) > 0;
  (vi.data || []).forEach((v) => { if (v.publicada) VIT.add(v.proyecto_id); });
  const por = {}; (se.data || []).forEach((x) => (por[x.proyecto_id] = por[x.proyecto_id] || []).push(x));
  Object.keys(por).forEach((k) => { AV[k] = avance(por[k]); });
  if (p.error) throw p.error;
  PROYS = p.data || [];
  HECHO.plantar = PROYS.length > 0; HECHO.vitrina = VIT.size > 0;
  // La ruta cuenta como vista si alguna vez se abrió la pestaña o si algún proyecto ya tiene etapa o técnicas marcadas.
  try { HECHO.ruta = localStorage.getItem("forja-vio-ruta") === "1"; } catch (e) {}
  HECHO.ruta = HECHO.ruta || PROYS.some((x) => x.ruta && (x.ruta.etapa || Object.keys(x.ruta.hechos || {}).length));
  pintar();
});

function pintar() {
  $("app").innerHTML =
    (EQUIPO() ? '<header><p class="eq-k">Equipo</p><h1>' + esc(EA.nombre) + '</h1><p class="lead">' + ({ dueno: "Los proyectos del equipo. Administras quién entra y qué ve cada persona.", editor: "Los proyectos del equipo. Puedes plantar ideas y editar los que están abiertos al equipo.", lector: "Los proyectos del equipo. Por ahora puedes verlos; quien administra el equipo puede darte permiso para editar." })[EA.rol] + ' <a href="../equipo/">Personas del equipo</a></p></header>'
      : '<header><h1>Proyectos</h1><p class="lead">Todo lo que estás creando. Cada proyecto se abre en su propia página.</p></header>') +
    '<div id="avisos"></div><div id="sendero"></div><div id="panel"></div>' +
    (COMP.length ? '<section class="compartidos"><h2>Compartidos contigo</h2><p class="hint">Proyectos de otras personas en los que te invitaron. No ocupan tu cupo.</p><div class="comp-grid">' +
      COMP.map((p) => '<a class="tile e-' + p.estado + '" href="../proyecto/?p=' + p.id + '" style="--tc:' + tc(p.tipo) + ";--ec:var(--e-" + p.estado + ')"><span class="arriba">' + etiqueta(p.tipo, TIPOS[p.tipo]) + '<span class="fx-estado e-' + p.estado + '">' + esc(ESTADOS[p.estado]) + "</span></span><h3>" + esc(p.nombre) + '</h3><span class="de">De ' + esc(p.de || "otra persona") + (p.edita ? "" : " · puedes mirar") + "</span>" + (p.resumen ? '<span class="res">' + esc(p.resumen) + "</span>" : "") + '<span class="pie"><span></span><span>' + hace(p.actualizado_en) + "</span></span></a>").join("") + "</div></section>" : "");
  if (LECT.length) $("app").insertAdjacentHTML("beforeend", '<section class="compartidos"><h2>Para leer y opinar</h2><p class="hint">Rondas de prueba de otras personas a las que te invitaron. Ves solo una copia; tus respuestas las lee quien creó el proyecto.</p><div class="comp-grid">' +
    LECT.map((x) => '<a class="tile lectura" href="../prueba/?t=' + x.token + '" style="--tc:' + tc(x.tipo) + '"><span class="arriba">' + etiqueta(x.tipo, TIPOS[x.tipo] || "Proyecto") + '<span class="k">' + esc(x.titulo) + "</span></span><h3>" + esc(x.proyecto) + '</h3><span class="de">' + (Object.keys(x.respuestas || {}).length ? "Ya respondiste " + Object.keys(x.respuestas).length + (Object.keys(x.respuestas).length === 1 ? " pregunta" : " preguntas") : "Aún no respondes") + (x.cierra ? " · cierra el " + fecha(x.cierra + "T12:00:00") : "") + "</span></a>").join("") + "</div></section>");
  avisos($("avisos"));
  proyectos();
  if (!EQUIPO()) sendero($("sendero"), HECHO, PROYS[0] ? PROYS[0].id : null);
}

const EQUIPO = () => EA && EA.tipo === "equipo";
const activos = () => PROYS.filter((p) => p.estado !== "archivado").length;
function cupo() {
  if (EQUIPO()) return "";
  const n = activos(), max = tope(PL, "proyectos"), lleno = max !== null && n >= max, pasado = max !== null && n > max;
  if (max === null) return '<div class="cupo mas"><b>' + PL.nombre + "</b><span>Proyectos, palabras y referentes sin límite.</span></div>";
  return '<div class="cupo' + (PL.mas ? " de-mas" : "") + (lleno ? " lleno" : "") + (pasado ? " pasado" : "") + '"><div class="cupo-top"><b>' + PL.nombre + "</b><span>" + n + " de " + max + " proyectos en curso</span></div>" +
    '<div class="fx-avance"><i style="width:' + Math.min(100, (n / max) * 100) + '%"></i></div>' +
    (pasado ? '<p>Tienes ' + n + " proyectos en curso y tu plan permite " + max + ": quedaron en <b>solo lectura</b>. Archiva " + (n - max) + (n - max === 1 ? " proyecto" : " proyectos") + " para seguir editando. Nada se borra.</p>"
      : lleno ? "<p>Llegaste al máximo. Para plantar otra idea, archiva un proyecto (queda guardado y se puede ver)." + (PL.mas ? ' Forja Estudio no tiene límite de proyectos. <a href="../planes/">Ver planes</a>' : " " + MAS_PRONTO + MAS_LINK) + "</p>"
      : '<p class="hint">Archivar un proyecto libera su cupo; lo archivado se puede ver y exportar siempre. <a href="../planes/">Ver planes</a></p>') + "</div>";
}
let creadorNuevo = (() => { try { const c = localStorage.getItem("forja-creador"); return CREADORES[c] ? c : CREADOR_INICIAL; } catch (e) { return CREADOR_INICIAL; } })();
function proyectos() {
  const sinCupo = tope(PL, "proyectos") !== null && activos() >= tope(PL, "proyectos"), lector = EQUIPO() && EA.rol === "lector";
  $("panel").innerHTML = cupo() + (lector ? '<div id="semilla" hidden></div>' :
    '<form class="semilla" id="semilla"><div class="line"><label class="fx-sr" for="s-nombre">Nombre de la idea</label>' +
    '<input type="text" id="s-nombre" maxlength="160" placeholder="' + (sinCupo ? "Archiva un proyecto para plantar otra idea" : "¿Qué idea traes hoy?") + '" autocomplete="off"' + (sinCupo ? " disabled" : "") + '><button class="plantar" type="submit" style="--tc:' + tc(tipoNuevo) + '"' + (sinCupo ? " disabled" : "") + ">" + chispa(16) + "Plantar</button></div>" +
    '<div class="tipos" role="group" aria-label="Tipo de proyecto">' +
    Object.entries(TIPOS).map(([k, n]) => '<button type="button" class="tipo fx-etq" data-t="' + k + '" style="--tc:' + tc(k) + '" aria-pressed="' + (k === tipoNuevo) + '">' + n + "</button>").join("") +
    '</div><div class="como" role="radiogroup" aria-label="Cómo trabajas en este proyecto"><span class="como-t">¿Cómo trabajas?</span>' +
    Object.entries(CREADORES).map(([k, c]) => '<button type="button" role="radio" data-cr="' + k + '" aria-checked="' + (k === creadorNuevo) + '" title="' + esc(c.d) + '">' + c.n + "</button>").join("") +
    '<span class="como-d" id="como-d">' + esc(CREADORES[creadorNuevo].d) + '</span></div>' +
    '<a class="a-semillero' + (sinCupo ? " fuerte" : "") + '" href="../semillero/">' + (sinCupo ? "Mientras tanto, anota la idea en el <b>Semillero</b>: las ideas sueltas no gastan cupo." : "¿Todavía es solo una frase? Anótala en el <b>Semillero</b> y plántala cuando te siga dando vueltas.") + "</a></form>") + '<div class="buscador" id="buscador"></div><div id="mosaico" style="margin-top:12px"></div>';
  if (!lector) $("semilla").querySelectorAll(".tipo").forEach((b) => b.onclick = () => {
    tipoNuevo = b.dataset.t; $("semilla").querySelectorAll(".tipo").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    $("semilla").querySelector(".plantar").style.setProperty("--tc", tc(tipoNuevo));
  });
  if (!lector) $("semilla").querySelectorAll("[data-cr]").forEach((b) => b.onclick = () => {
    creadorNuevo = b.dataset.cr; try { localStorage.setItem("forja-creador", creadorNuevo); } catch (e) {}
    $("semilla").querySelectorAll("[data-cr]").forEach((x) => x.setAttribute("aria-checked", String(x === b)));
    $("como-d").textContent = CREADORES[creadorNuevo].d;
  });
  if (!lector) $("semilla").onsubmit = async (e) => {
    e.preventDefault();
    const nombre = $("s-nombre").value.trim();
    if (!nombre) { $("s-nombre").focus(); return; }
    const btn = e.target.querySelector(".plantar"); btn.disabled = true;
    // Nace con las secciones que suele necesitar su tipo (la misma función que usa el Semillero).
    const r = await plantarProyecto({ espacio: ESP, nombre, tipo: tipoNuevo, creador: creadorNuevo });
    if (r.error) { btn.disabled = false; toast(limite(r.error) || "No se pudo guardar. Revisa tu conexión."); return; }
    location.href = "../proyecto/?p=" + r.id;
  };
  const ESTO = ["semilla", "desarrollo", "pausa", "listo", "archivado"];
  const cuenta = (e) => PROYS.filter((p) => p.estado === e).length;
  const tiposUsados = [...new Set(PROYS.map((p) => p.tipo))];
  if (!PROYS.length) { $("mosaico").innerHTML = (EQUIPO() ? '<div class="vacio"><b>El equipo aún no tiene proyectos</b>' + (lector ? "Cuando alguien plante uno abierto al equipo, aparecerá aquí." : "Planta una idea arriba, o mueve aquí uno de tus proyectos personales desde su página.") + "</div>" : '<div class="vacio"><b>Tu mesa está vacía</b>Escribe arriba una idea, aunque sea una frase, y elige qué tipo de proyecto es.</div>'); return; }
  $("buscador").innerHTML =
    '<div class="b-fila"><label class="fx-sr" for="f-q">Buscar</label><input id="f-q" type="search" placeholder="Buscar por nombre o resumen…" autocomplete="off">' +
    '<label class="fx-sr" for="f-orden">Ordenar</label><select id="f-orden"><option value="recientes">Más recientes</option><option value="nombre">Por nombre</option><option value="mas">Más avanzados</option><option value="menos">Menos avanzados</option></select></div>' +
    '<div class="estados-f" role="group" aria-label="Filtrar por estado"><button data-e="" aria-pressed="false">En curso<span class="n">' + PROYS.filter((p) => p.estado !== "archivado").length + "</span></button>" +
    ESTO.filter(cuenta).map((e) => '<button data-e="' + e + '" class="e-' + e + '" aria-pressed="false"><i aria-hidden="true"></i>' + ESTADOS[e] + '<span class="n">' + cuenta(e) + "</span></button>").join("") + "</div>" +
    (tiposUsados.length > 1 ? '<div class="tipos" role="group" aria-label="Filtrar por categoría"><button class="tipo fx-etq" style="--tc:var(--fg)" data-t="" aria-pressed="false">Todas las categorías</button>' + tiposUsados.map((t) => '<button class="tipo fx-etq" style="--tc:' + tc(t) + '" data-t="' + t + '" aria-pressed="false">' + TIPOS[t] + "</button>").join("") + "</div>" : "");
  if (!tiposUsados.includes(F.tipo)) F.tipo = "";
  if (F.estado && !cuenta(F.estado)) F.estado = "";
  $("f-orden").value = F.orden;
  const dibujar = () => {
    $("buscador").querySelectorAll("[data-e]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.e === F.estado)));
    $("buscador").querySelectorAll("[data-t]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === F.tipo)));
    const q = F.q.trim().toLowerCase();
    let vis = PROYS.filter((p) => (F.estado ? p.estado === F.estado : p.estado !== "archivado") && (!F.tipo || p.tipo === F.tipo) &&
      (!q || (p.nombre + " " + (p.resumen || "")).toLowerCase().includes(q)));
    const av = (p) => AV[p.id] || 0;
    if (F.orden === "nombre") vis.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
    else if (F.orden === "mas") vis.sort((a, b) => av(b) - av(a));
    else if (F.orden === "menos") vis.sort((a, b) => av(a) - av(b));
    $("mosaico").innerHTML = vis.length ? '<div class="mosaico">' + vis.map(tile).join("") + "</div>" : '<div class="vacio">Ningún proyecto coincide. Prueba con otra palabra u otro filtro.</div>';
  };
  $("buscador").querySelectorAll("[data-e]").forEach((b) => b.onclick = () => { F.estado = F.estado === b.dataset.e ? "" : b.dataset.e; guardarF(); dibujar(); });
  $("buscador").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { F.tipo = b.dataset.t; guardarF(); dibujar(); });
  $("f-q").oninput = (e) => { F.q = e.target.value; dibujar(); };
  $("f-orden").onchange = (e) => { F.orden = e.target.value; guardarF(); dibujar(); };
  dibujar();
}

const VIT = new Set(); // proyectos con vitrina publicada
const HECHO = { plantar: false, ruta: false, taller: false, referentes: false, vitrina: false };
function tile(p) {
  const elegido = FORMATOS.find((f) => f.k === p.formato), av = AV[p.id] || 0, ro = !editable(p, activos(), PL);
  const et = estadoRuta(p.ruta).etapa, ei = et ? etapaIndice(et) : -1, enom = et ? etapaNombre(et, p.tipo) : "";
  return '<a class="tile e-' + p.estado + '" href="../proyecto/?p=' + p.id + '" style="--tc:' + tc(p.tipo) + ";--ec:var(--e-" + p.estado + ')">' +
    '<span class="arriba">' + etiqueta(p.tipo, TIPOS[p.tipo] + (elegido && elegido.n !== TIPOS[p.tipo] ? " · " + elegido.n : "")) + '<span class="fx-estado e-' + p.estado + '">' + esc(ESTADOS[p.estado]) + "</span></span>" +
    fAvance(ei, 52, ei >= 0 ? "Etapa " + (ei + 1) + " de 7: " + enom : "Sin etapa marcada en la Ruta") +
    "<h3>" + (ro ? '<svg class="candado" viewBox="0 0 16 16" width="15" height="15" aria-label="Solo lectura" role="img"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg> ' : "") + esc(p.nombre) + "</h3>" + (VIT.has(p.id) ? '<span class="en-vitrina">' + ico("vitrina", 14) + "En vitrina</span>" : "") + (p.acceso === "reservado" ? '<span class="reservado">Reservado</span>' : "") + (p.resumen ? '<span class="res">' + esc(p.resumen) + "</span>" : "") +
    '<span class="pie"><span class="av"><span class="fx-avance" role="img" aria-label="Avance ' + av + '%"><i style="width:' + av + '%"></i></span><b>' + av + '%</b></span><span>' + (ei >= 0 ? esc(enom) + " · " : "") + hace(p.actualizado_en) + "</span></span></a>";
}

</script>
