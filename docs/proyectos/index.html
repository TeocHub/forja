<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Proyectos</title>
<meta name="description" content="Tus proyectos y cotizaciones en Forja.">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: inventario — barra para plantar ideas, pestañas Proyectos / Cotizaciones, fichas en mosaico */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
a{color:var(--accent)}
button,input{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,input,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:20px}

.semilla{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.semilla:focus-within{border-color:var(--accent)}
.semilla .line{display:flex;gap:8px;align-items:center}
.semilla input{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:500;border:0;background:transparent;padding:6px 4px}
.semilla input::placeholder{color:var(--muted)}
.semilla input:focus-visible{outline:none}
.plantar{font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--card);border-radius:10px;padding:8px 14px;white-space:nowrap}
.plantar:disabled{opacity:.6}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px 3px 9px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tipo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tipo[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);font-weight:700}

.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cupo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0 12px;display:flex;flex-direction:column;gap:8px;--ec:var(--accent)}
.cupo-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.cupo-top span{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.cupo p{margin:0;font-size:14px}
.cupo.lleno{--ec:var(--e-semilla);border-color:color-mix(in srgb,var(--e-semilla) 45%,var(--line))}
.cupo.pasado{--ec:var(--e-pausa);border-color:var(--e-pausa);background:color-mix(in srgb,var(--e-pausa) 7%,var(--card))}
.cupo.mas{flex-direction:row;gap:10px;align-items:baseline;border-color:var(--ember)}
.cupo.mas b{color:var(--ember)}
.candado{vertical-align:-1px;color:var(--e-pausa)}
.semilla input:disabled{cursor:not-allowed}
.buscador{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.b-fila{display:flex;gap:8px;flex-wrap:wrap}
.b-fila input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:15px}
.b-fila select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font:inherit;color:var(--fg)}
.estados-f{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.estados-f button{flex:none;display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px;font-size:14px}
.estados-f button i{width:9px;height:9px;border-radius:50%;background:var(--ec)}
.estados-f button .n{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.estados-f button[aria-pressed="true"]{border-color:var(--ec,var(--fg));background:color-mix(in srgb,var(--ec,var(--fg)) 12%,var(--card));font-weight:700}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr;gap:4px 10px;text-decoration:none;color:var(--fg);overflow:hidden;min-height:140px;transition:transform .15s ease,border-color .15s ease}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tc)}
.tile:hover{border-color:var(--tc);transform:translateY(-2px)}
.tile .arriba{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tile .av{display:flex;align-items:center;gap:8px;flex:1;max-width:60%}
.tile .av .fx-avance{flex:1}
.tile .av b{font-family:var(--f-num);font-size:12px;color:var(--fg)}
.tile.e-pausa{background:repeating-linear-gradient(135deg,var(--card) 0 14px,color-mix(in srgb,var(--e-pausa) 5%,var(--card)) 14px 28px)}
.tile.e-listo{border-color:color-mix(in srgb,var(--e-listo) 45%,var(--line))}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.tile h3{grid-column:1/-1;font-family:var(--f-display);font-size:19px;line-height:1.2;margin:4px 0 0;overflow-wrap:anywhere;text-wrap:balance}
.tile .res{grid-column:1/-1;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .mini{grid-column:2;grid-row:1/4;width:56px;height:56px}
.tile .pie{grid-column:1/-1;align-self:end;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.tile .estado{font-family:var(--f-num);font-size:11px;letter-spacing:.04em}
.tile.e-archivado{opacity:.6}
.filtros{display:flex;flex-wrap:wrap;gap:6px}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px 22px;color:var(--muted);text-align:center}
.vacio b{color:var(--fg);font-family:var(--f-display);font-size:18px;display:block;margin-bottom:4px}

.cots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--tc)}
.cot:hover{border-color:var(--tc)}
.cot h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.cot .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--field);border:1px solid var(--line)}
.cot small{color:var(--muted);font-size:12px;margin-top:auto}
.skeleton{height:140px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--field),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.tile{transition:none}}
.en-vitrina{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--good);letter-spacing:.02em}
.compartidos{margin-top:32px}.compartidos h2{font-family:var(--f-display);font-size:20px;margin:0 0 2px}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.tile .de{font-size:12.5px;color:var(--muted)}
.reservado{align-self:flex-start;font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px;letter-spacing:.02em}
.eq-k{margin:0 0 2px;font-family:var(--f-num);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="skeleton"></div></main>
</div>

<script type="module">
import { sb, $, esc, toast, hace, navApp, espacio, espacioActual, conSesion, avisos, plan, LIMITES, limite, editable, MAS_PRONTO, MAS_LINK } from "../js/forja.js";
import { TIPOS, ESTADOS, tc, PLANTILLA, SECCIONES, pesoDe, avance } from "../js/guias.js";
import { sendero } from "../js/ayuda.js";
import { FORMATOS } from "../js/brujula.js";
navApp("proyectos");
if (location.hash === "#cotizaciones") location.replace("../cotizaciones/");

// Enlaces antiguos (../proyectos/#p=…) llevan a la nueva página de proyecto.
const viejo = location.hash.match(/^#p=([0-9a-f-]{36})/);
if (viejo) location.replace("../proyecto/?p=" + viejo[1]);

let ESP = null, EA = null, COMP = [], PL = { mas: false }, PROYS = [], COTS = [], AV = {}, vista = location.hash === "#cotizaciones" ? "cot" : "proy", tipoNuevo = "historia";
let F = { tipo: "", estado: "", q: "", orden: "recientes" };
try { Object.assign(F, JSON.parse(localStorage.getItem("forja-filtros") || "{}")); F.q = ""; } catch (e) {}
const guardarF = () => { try { localStorage.setItem("forja-filtros", JSON.stringify(F)); } catch (e) {} };

conSesion($("app"), async () => {
  ESP = await espacio(); EA = await espacioActual();
  if (EA && EA.tipo === "personal") COMP = (await sb.rpc("mis_compartidos")).data || [];
  if (!ESP) throw new Error("sin espacio");
  PL = await plan();
  const [p, se, vi, tx, rf, pz] = await Promise.all([
    sb.from("proyectos").select("id,nombre,tipo,estado,resumen,ejes,formato,acceso,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false }),
    sb.from("secciones").select("proyecto_id,avance,peso").eq("espacio_id", ESP),
    sb.from("vitrinas").select("proyecto_id,publicada").eq("espacio_id", ESP),
    sb.from("secciones").select("id", { count: "exact", head: true }).eq("espacio_id", ESP).neq("texto", ""),
    sb.from("referentes").select("id", { count: "exact", head: true }).eq("espacio_id", ESP),
    sb.from("pizarras").select("id", { count: "exact", head: true }).eq("espacio_id", ESP),
  ]);
  // primeros pasos: se marcan solos con lo que ya existe
  HECHO.taller = (tx.count || 0) > 0; HECHO.referentes = (rf.count || 0) > 0; HECHO.pizarra = (pz.count || 0) > 0;
  (vi.data || []).forEach((v) => { if (v.publicada) VIT.add(v.proyecto_id); });
  const por = {}; (se.data || []).forEach((x) => (por[x.proyecto_id] = por[x.proyecto_id] || []).push(x));
  Object.keys(por).forEach((k) => { AV[k] = avance(por[k]); });
  if (p.error) throw p.error;
  PROYS = p.data || [];
  HECHO.plantar = PROYS.length > 0; HECHO.vitrina = VIT.size > 0;
  pintar();
});

function pintar() {
  $("app").innerHTML =
    (EQUIPO() ? '<header><p class="eq-k">Equipo</p><h1>' + esc(EA.nombre) + '</h1><p class="lead">' + ({ dueno: "Los proyectos del equipo. Administras quién entra y qué ve cada persona.", editor: "Los proyectos del equipo. Puedes plantar ideas y editar los que están abiertos al equipo.", lector: "Los proyectos del equipo. Por ahora puedes verlos; quien administra el equipo puede darte permiso para editar." })[EA.rol] + ' <a href="../equipo/">Personas del equipo</a></p></header>'
      : '<header><h1>Proyectos</h1><p class="lead">Todo lo que estás creando. Cada proyecto se abre en su propia página.</p></header>') +
    '<div id="avisos"></div><div id="sendero"></div><div id="panel"></div>' +
    (COMP.length ? '<section class="compartidos"><h2>Compartidos contigo</h2><p class="hint">Proyectos de otras personas en los que te invitaron. No ocupan tu cupo.</p><div class="comp-grid">' +
      COMP.map((p) => '<a class="tile e-' + p.estado + '" href="../proyecto/?p=' + p.id + '" style="--tc:' + tc(p.tipo) + ";--ec:var(--e-" + p.estado + ')"><span class="arriba"><span class="k">' + esc(TIPOS[p.tipo]) + '</span><span class="fx-estado e-' + p.estado + '">' + esc(ESTADOS[p.estado]) + "</span></span><h3>" + esc(p.nombre) + '</h3><span class="de">De ' + esc(p.de || "otra persona") + (p.edita ? "" : " · puedes mirar") + "</span>" + (p.resumen ? '<span class="res">' + esc(p.resumen) + "</span>" : "") + '<span class="pie"><span></span><span>' + hace(p.actualizado_en) + "</span></span></a>").join("") + "</div></section>" : "");
  avisos($("avisos"));
  proyectos();
  if (!EQUIPO()) sendero($("sendero"), HECHO, PROYS[0] ? PROYS[0].id : null);
}

const EQUIPO = () => EA && EA.tipo === "equipo";
const activos = () => PROYS.filter((p) => p.estado !== "archivado").length;
function cupo() {
  if (EQUIPO()) return "";
  if (PL.mas) return '<div class="cupo mas"><b>Forja Más</b><span>Proyectos, palabras y referentes sin límite.</span></div>';
  const n = activos(), max = LIMITES.proyectos, lleno = n >= max, pasado = n > max;
  return '<div class="cupo' + (lleno ? " lleno" : "") + (pasado ? " pasado" : "") + '"><div class="cupo-top"><b>Plan gratis</b><span>' + n + " de " + max + " proyectos en curso</span></div>" +
    '<div class="fx-avance"><i style="width:' + Math.min(100, (n / max) * 100) + '%"></i></div>' +
    (pasado ? '<p>Tienes ' + n + " proyectos en curso y el plan gratis permite " + max + ": quedaron en <b>solo lectura</b>. Archiva " + (n - max) + (n - max === 1 ? " proyecto" : " proyectos") + " para seguir editando. Nada se borra.</p>"
      : lleno ? "<p>Llegaste al máximo. Para plantar otra idea, archiva un proyecto (queda guardado y se puede ver). " + MAS_PRONTO + MAS_LINK + "</p>"
      : '<p class="hint">Archivar un proyecto libera su cupo; lo archivado se puede ver y exportar siempre. <a href="../planes/">Ver planes</a></p>') + "</div>";
}
function proyectos() {
  const sinCupo = !PL.mas && activos() >= LIMITES.proyectos, lector = EQUIPO() && EA.rol === "lector";
  $("panel").innerHTML = cupo() + (lector ? '<div id="semilla" hidden></div>' :
    '<form class="semilla" id="semilla"><div class="line"><label class="fx-sr" for="s-nombre">Nombre de la idea</label>' +
    '<input type="text" id="s-nombre" maxlength="160" placeholder="' + (sinCupo ? "Archiva un proyecto para plantar otra idea" : "¿Qué idea traes hoy?") + '" autocomplete="off"' + (sinCupo ? " disabled" : "") + '><button class="plantar" type="submit"' + (sinCupo ? " disabled" : "") + '>Plantar</button></div>' +
    '<div class="tipos" role="group" aria-label="Tipo de proyecto">' +
    Object.entries(TIPOS).map(([k, n]) => '<button type="button" class="tipo" data-t="' + k + '" style="--tc:' + tc(k) + '" aria-pressed="' + (k === tipoNuevo) + '">' + n + "</button>").join("") +
    '</div></form>') + '<div class="buscador" id="buscador"></div><div id="mosaico" style="margin-top:12px"></div>';
  if (!lector) $("semilla").querySelectorAll(".tipo").forEach((b) => b.onclick = () => {
    tipoNuevo = b.dataset.t; $("semilla").querySelectorAll(".tipo").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  if (!lector) $("semilla").onsubmit = async (e) => {
    e.preventDefault();
    const nombre = $("s-nombre").value.trim();
    if (!nombre) { $("s-nombre").focus(); return; }
    const btn = e.target.querySelector(".plantar"); btn.disabled = true;
    const { data, error } = await sb.from("proyectos").insert({ espacio_id: ESP, nombre, tipo: tipoNuevo }).select("id").single();
    if (error) { btn.disabled = false; toast(limite(error) || "No se pudo guardar. Revisa tu conexión."); return; }
    // Nace con las secciones que suele necesitar su tipo.
    await sb.from("secciones").insert(PLANTILLA[tipoNuevo].map((g, i) => ({ espacio_id: ESP, proyecto_id: data.id, titulo: SECCIONES[g].t, guia: g, orden: i, peso: pesoDe(g) })));
    location.href = "../proyecto/?p=" + data.id;
  };
  const ESTO = ["semilla", "desarrollo", "pausa", "listo", "archivado"];
  const cuenta = (e) => PROYS.filter((p) => p.estado === e).length;
  const tiposUsados = [...new Set(PROYS.map((p) => p.tipo))];
  if (!PROYS.length) { $("mosaico").innerHTML = (EQUIPO() ? '<div class="vacio"><b>El equipo aún no tiene proyectos</b>' + (lector ? "Cuando alguien plante uno abierto al equipo, aparecerá aquí." : "Planta una idea arriba, o mueve aquí uno de tus proyectos personales desde su página.") + "</div>" : '<div class="vacio"><b>Tu mesa está vacía</b>Escribe arriba una idea, aunque sea una frase, y elige qué tipo de proyecto es.</div>'); return; }
  $("buscador").innerHTML =
    '<div class="b-fila"><label class="fx-sr" for="f-q">Buscar</label><input id="f-q" type="search" placeholder="Buscar por nombre o resumen…" autocomplete="off">' +
    '<label class="fx-sr" for="f-orden">Ordenar</label><select id="f-orden"><option value="recientes">Más recientes</option><option value="nombre">Por nombre</option><option value="mas">Más avanzados</option><option value="menos">Menos avanzados</option></select></div>' +
    '<div class="estados-f" role="group" aria-label="Filtrar por estado"><button data-e="" aria-pressed="false">En curso<span class="n">' + PROYS.filter((p) => p.estado !== "archivado").length + "</span></button>" +
    ESTO.filter(cuenta).map((e) => '<button data-e="' + e + '" style="--ec:var(--e-' + e + ')" aria-pressed="false"><i></i>' + ESTADOS[e] + '<span class="n">' + cuenta(e) + "</span></button>").join("") + "</div>" +
    (tiposUsados.length > 1 ? '<div class="tipos" role="group" aria-label="Filtrar por categoría"><button class="tipo" style="--tc:var(--fg)" data-t="" aria-pressed="false">Todas las categorías</button>' + tiposUsados.map((t) => '<button class="tipo" style="--tc:' + tc(t) + '" data-t="' + t + '" aria-pressed="false">' + TIPOS[t] + "</button>").join("") + "</div>" : "");
  if (!tiposUsados.includes(F.tipo)) F.tipo = "";
  if (F.estado && !cuenta(F.estado)) F.estado = "";
  $("f-orden").value = F.orden;
  const dibujar = () => {
    $("buscador").querySelectorAll("[data-e]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.e === F.estado)));
    $("buscador").querySelectorAll("[data-t]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === F.tipo)));
    const q = F.q.trim().toLowerCase();
    let vis = PROYS.filter((p) => (F.estado ? p.estado === F.estado : p.estado !== "archivado") && (!F.tipo || p.tipo === F.tipo) &&
      (!q || (p.nombre + " " + (p.resumen || "")).toLowerCase().includes(q)));
    const av = (p) => AV[p.id] || 0;
    if (F.orden === "nombre") vis.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));
    else if (F.orden === "mas") vis.sort((a, b) => av(b) - av(a));
    else if (F.orden === "menos") vis.sort((a, b) => av(a) - av(b));
    $("mosaico").innerHTML = vis.length ? '<div class="mosaico">' + vis.map(tile).join("") + "</div>" : '<div class="vacio">Ningún proyecto coincide. Prueba con otra palabra u otro filtro.</div>';
  };
  $("buscador").querySelectorAll("[data-e]").forEach((b) => b.onclick = () => { F.estado = F.estado === b.dataset.e ? "" : b.dataset.e; guardarF(); dibujar(); });
  $("buscador").querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { F.tipo = b.dataset.t; guardarF(); dibujar(); });
  $("f-q").oninput = (e) => { F.q = e.target.value; dibujar(); };
  $("f-orden").onchange = (e) => { F.orden = e.target.value; guardarF(); dibujar(); };
  dibujar();
}

const VIT = new Set(); // proyectos con vitrina publicada
const HECHO = { plantar: false, taller: false, referentes: false, pizarra: false, vitrina: false };
function tile(p) {
  const elegido = FORMATOS.find((f) => f.k === p.formato), av = AV[p.id] || 0, ro = !editable(p, activos(), PL);
  return '<a class="tile e-' + p.estado + '" href="../proyecto/?p=' + p.id + '" style="--tc:' + tc(p.tipo) + ";--ec:var(--e-" + p.estado + ')">' +
    '<span class="arriba"><span class="k">' + esc(TIPOS[p.tipo]) + (elegido && elegido.n !== TIPOS[p.tipo] ? " · " + esc(elegido.n) : "") + '</span><span class="fx-estado e-' + p.estado + '">' + esc(ESTADOS[p.estado]) + "</span></span>" +
    "<h3>" + (ro ? '<svg class="candado" viewBox="0 0 16 16" width="15" height="15" aria-label="Solo lectura" role="img"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg> ' : "") + esc(p.nombre) + "</h3>" + (VIT.has(p.id) ? '<span class="en-vitrina">● En vitrina</span>' : "") + (p.acceso === "reservado" ? '<span class="reservado">Reservado</span>' : "") + (p.resumen ? '<span class="res">' + esc(p.resumen) + "</span>" : "") +
    '<span class="pie"><span class="av"><span class="fx-avance" role="img" aria-label="Avance ' + av + '%"><i style="width:' + av + '%"></i></span><b>' + av + '%</b></span><span>' + hace(p.actualizado_en) + "</span></span></a>";
}
