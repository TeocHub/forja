<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Proyecto</title>
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: página de proyecto — cabecera editable y cinco partes (Ruta · Idea · Crear · Probar · Mostrar), cada una con su mesa de herramientas; el Taller es índice de secciones + hoja de escritura */

.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,select,input,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
#app{display:flex;flex-direction:column;gap:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.peligro{color:var(--bad)}
.btn.chico{padding:3px 9px;font-size:13px}
.vol{font-size:14px;text-decoration:none}

/* cabecera */
.cabeza{display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--tc);padding-left:14px}
.cabeza input.nombre{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;width:100%}
.cabeza input.nombre:hover{border-color:var(--line)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ctrl select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:14px}
.estados{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.estados button{white-space:nowrap;flex:none;border:0;background:transparent;padding:4px 11px;font-size:13px;color:var(--muted)}
.estados button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.eq-fila{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.eq-que{color:var(--muted)}.eq-que b{color:var(--fg)}
.eq-presencia{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13.5px}
.eq-presencia i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:eqlat 2s ease-in-out infinite}
@keyframes eqlat{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.eq-presencia i{animation:none}}
.eq-acc{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.eq-conf{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding-top:6px}
.eq-conf[hidden]{display:none}
.eq-conf p{margin:0}
.eq-botones{display:flex;gap:8px;flex-wrap:wrap}
.btn.primario{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.eq-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.eq-modos button{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.eq-modos button small{color:var(--muted);font-size:13px}
.eq-modos button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.eq-personas{display:flex;flex-direction:column;gap:6px}
.eq-personas label{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;overflow-wrap:anywhere}
.eq-personas select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--field);color:var(--fg)}
.per-intro{color:var(--muted);font-size:14px}
.per{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.per-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;overflow-wrap:anywhere}
.per-extra{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px}
.per-quitar{margin-left:auto;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.per-quitar[data-seguro="1"]{color:var(--bad);font-weight:700}
.per-guardar[hidden]{display:none}
.ar-chips{display:flex;flex-wrap:wrap;gap:6px}
.ar-chip{font:inherit;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:5px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;line-height:1.25;min-width:96px;text-align:left}
button.ar-chip{cursor:pointer}
.ar-chip span{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.ar-chip.v-editar{border-color:var(--good);background:var(--good-soft)}.ar-chip.v-editar span{color:var(--good)}
.ar-chip.v-ver{border-color:var(--line)}.ar-chip.v-ver span{color:var(--muted)}
.ar-chip.v-no{border-style:dashed;opacity:.65}.ar-chip.v-no b{text-decoration:line-through}
.per-pend{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.per-pend small{color:var(--muted)}
.per-pend button{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline}
.per-nueva{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.per-fila{display:flex;gap:8px;flex-wrap:wrap}
.per-fila input{flex:1 1 220px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);color:var(--fg)}
.per-presets{display:flex;flex-wrap:wrap;gap:6px}
.per-presets button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:transparent;color:var(--muted);cursor:pointer}
.per-presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.eq-aviso{margin:0 0 8px;border-left:3px solid var(--good);background:var(--good-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.lectura{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border:1.5px solid var(--e-pausa);background:color-mix(in srgb,var(--e-pausa) 8%,var(--card));border-radius:12px;padding:10px 14px;font-size:14px}
.lectura b{color:var(--e-pausa)}
:disabled{cursor:not-allowed}
.total.tope{display:flex;flex-direction:column;gap:5px;--ec:var(--accent)}
@media (max-width:820px){.total.tope{display:flex;flex:none;min-width:160px;padding:4px 8px}}
.total.tope.cerca{--ec:var(--e-pausa)}
.total.tope small{font-family:var(--f-body);font-size:12px;color:var(--e-pausa)}
.pronto-fila{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.pronto-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px}
.pronto-cab b{font-family:var(--f-display);font-size:15px}
.pronto-cab a{font-size:13px}
.pronto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
/* ruta */
.sigue{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 12px 10px 14px}
.sg-izq{display:flex;flex-direction:column;gap:4px;min-width:150px}
.sg-k{font-family:var(--f-num);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.sg-via{display:flex;gap:4px}
.sg-via i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.sg-via i.ya{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sg-via i.aqui{background:var(--accent);width:22px}
.sg-n{font-size:12.5px;color:var(--muted)}
.sg-txt{flex:1 1 260px;margin:0;font-size:14px;color:var(--muted)}
.sg-txt b{color:var(--fg)}
.sg-acc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sg-x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;border-radius:6px}
.sg-x:hover{color:var(--fg);background:var(--field)}
.ruta{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.rt-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px 18px}
.rt-cab p{margin:4px 0 0}
.rt-ajustes{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rt-como{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.rt-como button{border:0;background:transparent;color:var(--muted);font-size:13px;padding:5px 12px}
.rt-como button[aria-checked="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.rt-abrir{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.rt-abrir select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px}
.rt-como-d{margin:-6px 0 0;font-size:13px;color:var(--muted)}
.rt-via{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));overflow-x:auto;scrollbar-width:thin;position:relative;padding:4px 2px 2px}
.rt-via button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 4px 8px;text-align:center;color:var(--muted)}
.rt-via button::before{content:"";position:absolute;top:19px;left:0;right:0;height:2px;background:var(--line);z-index:0}
.rt-via button:first-child::before{left:50%}.rt-via button:last-child::before{right:50%}
.rt-via button.con::before{background:color-mix(in srgb,var(--tc) 40%,var(--line))}
.rt-num{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:13px;font-weight:700;background:var(--card);border:2px solid var(--line);color:var(--muted)}
.rt-via button.con .rt-num{border-color:color-mix(in srgb,var(--tc) 55%,var(--line));color:var(--fg)}
.rt-via button.aqui .rt-num{background:var(--tc);border-color:var(--tc);color:#fff}
.rt-via button[aria-selected="true"] .rt-num{box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 22%,transparent)}
.rt-nom{font-size:13px;line-height:1.25;text-wrap:balance}
.rt-via button[aria-selected="true"] .rt-nom{color:var(--fg);font-weight:700}
.rt-via small{font-size:11px;color:var(--tc);min-height:14px}
.rt-etapa{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.rt-et-cab{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.rt-et-cab>div{flex:1 1 260px}
.rt-et-cab h3{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.15}
.rt-et-cab p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.rt-big{font-family:var(--f-display);font-size:44px;line-height:.9;font-weight:700;color:color-mix(in srgb,var(--tc) 70%,var(--fg))}
.rt-aqui{font-size:12.5px;font-weight:700;color:var(--tc);border:1.5px solid var(--tc);border-radius:999px;padding:3px 10px}
.rt-explora{margin:0}
.rt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.rt-tec{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.rt-tec h4{margin:0;font-family:var(--f-display);font-size:16.5px;line-height:1.2}
.rt-tec p{margin:0;font-size:13.5px;color:var(--muted)}
.rt-tec.hecha{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 5%,var(--bg))}
.rt-tec.bloq{opacity:.75}
.rt-tec-top{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:20px}
.rt-min{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.rt-pronto,.rt-mas,.rt-ok{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:1px 8px}
.rt-pronto{color:var(--warn);background:var(--warn-soft)}
.rt-mas{color:var(--ember);background:var(--ember-soft);text-decoration:none}
.rt-ok{color:var(--good);background:var(--good-soft)}
.rt-pasos{display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);padding-top:8px}
.rt-pasos span{display:flex;gap:8px;font-size:13px;line-height:1.4}
.rt-pasos i{flex:none;font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:10.5px;background:color-mix(in srgb,var(--tc) 14%,var(--card));color:var(--fg)}
.rt-tec-acc{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.rt-todas{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:14px;padding:0;text-decoration:underline;text-underline-offset:3px}
.rt-nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:640px){.rt-via{grid-template-columns:repeat(7,92px)}.rt-etapa{padding:14px}.rt-big{font-size:34px}.sigue .sg-acc{width:100%}}
/* vitrina */
.vit-vivo{font-size:13px;font-weight:700;color:var(--good)}
.vit-hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;align-items:center}
.vit-acc{display:flex;gap:8px;flex-wrap:wrap}
.vit-acc .btn{text-decoration:none;display:inline-flex;align-items:center}
.vit-ilus{width:100%;height:auto}
.vit-ilus rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.vit-ilus .h{fill:color-mix(in srgb,var(--tc,var(--accent)) 22%,var(--card));stroke:none}
.vit-ilus .t{fill:var(--tc,var(--accent));stroke:none}
.vit-ilus .l{fill:var(--line);stroke:none}
.vit-ilus .g{fill:color-mix(in srgb,var(--tc,var(--accent)) 12%,var(--field));stroke:none}
@media (max-width:640px){.vit-hero{grid-template-columns:1fr}.vit-ilus{display:none}}
/* pizarra: pestañas de pizarras, elección de modo y cabecera */
.piz-cab{display:flex;flex-direction:column;gap:8px}
.piz-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.piz-chips [data-piz]{flex:none;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px 6px 8px;position:relative}
.piz-chips [data-piz] svg{width:38px;height:29px;flex:none}
.piz-chips [data-piz] span{display:flex;flex-direction:column;line-height:1.2}
.piz-chips [data-piz] b{font-family:var(--f-display);font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piz-chips [data-piz] small{font-size:11.5px;color:var(--muted)}
.piz-chips [data-piz][aria-selected="true"]{border-color:var(--tc);box-shadow:inset 0 -3px 0 var(--tc)}
.piz-candado{color:var(--muted);display:flex;margin-left:2px}
.piz-chips .piz-candado svg{width:14px;height:14px}
.piz-chips .piz-candado svg *{fill:currentColor;stroke:none}
.piz-nueva{flex:none;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted)}
.piz-nueva:hover,.piz-nueva[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.piz-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.piz-op{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px 14px}
.piz-op:hover:not(:disabled){border-color:var(--tc);box-shadow:0 6px 20px rgba(10,14,30,.07)}
.piz-op svg{width:100%;max-width:120px;height:auto;margin-bottom:4px}
.piz-op b{font-family:var(--f-display);font-size:16px}
.piz-op span{font-size:13px;color:var(--muted);line-height:1.45}
.piz-op em{position:absolute;top:10px;right:10px;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 45%,var(--line));border-radius:999px;padding:1px 8px;background:var(--ember-soft)}
.piz-op.bloq svg{opacity:.55}
.piz-chips svg *,.piz-op svg *{fill:color-mix(in srgb,var(--tc,var(--accent)) 16%,var(--card));stroke:var(--tc,var(--accent));stroke-width:2}
.piz-chips svg .l,.piz-op svg .l{fill:none;stroke:var(--muted);stroke-width:2}
.piz-chips svg .l.r,.piz-op svg .l.r{stroke:var(--ember)}
.piz-chips svg .l.d,.piz-op svg .l.d{stroke-dasharray:4 4}
.piz-chips svg .col,.piz-op svg .col{fill:color-mix(in srgb,var(--muted) 10%,var(--card));stroke:var(--line)}
.piz-chips svg .pin,.piz-op svg .pin{fill:var(--ember);stroke:none}
.piz-nota{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1.5px dashed var(--ember);background:var(--ember-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.piz-lock{margin:10px 0 0;align-items:center}
.piz-lock svg{color:var(--e-pausa);flex:none}
.piz-titulo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:14px 0 10px}
.piz-titulo input{font-family:var(--f-display);font-weight:700;font-size:20px;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;min-width:0;flex:1 1 220px}
.piz-titulo input:hover:not(:disabled){border-color:var(--line)}
.piz-modo{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.piz-pie{margin:10px 0 0}
.ref.destello{animation:destello 1.6s ease-out}
@keyframes destello{0%,40%{box-shadow:0 0 0 3px var(--ember)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.ref.destello{animation:none;box-shadow:0 0 0 3px var(--ember)}}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sel select{font-size:15px}
.estado-w{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--ec) 8%,var(--card));border:1.5px solid color-mix(in srgb,var(--ec) 40%,var(--line));border-radius:14px;padding:10px 12px}
.estados button[aria-checked="true"]{background:var(--ec);color:#fff;font-weight:700}
.estados button[aria-checked="true"]::before{content:"● ";font-size:10px}
.avance-w{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avance-w .fx-avance{flex:1;height:8px}
.avance-w b{color:var(--fg);font-family:var(--f-num)}
.fx-tabs .punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:5px;vertical-align:2px}
.sugerencia{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1.5px dashed var(--ember);background:var(--ember-soft);border-radius:14px;padding:12px 14px}
.sugerencia .ops{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sugerencia .ops .hint{background:none;border:0;padding:2px 0}
.sugerencia .ops .menos{text-decoration:line-through;color:var(--muted)}
.indice .aparte{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 2px;border-top:1px dashed var(--line);margin-top:6px}
@media (max-width:820px){.indice .aparte{flex:none;border:0;padding:8px 2px 0 8px;margin:0;align-self:center;border-left:1px dashed var(--line)}}

// «Pasar a fichas»: reparte en hojas las partes del texto que hablan de cada uno. Se elige qué pasar; lo demás queda en el conjunto.

// Agrega bloques de texto al final de secciones del Taller (crea las que falten). bloques: [{ guia, texto }]. Devuelve cuántas secciones cambiaron.
async function alTaller(bloques) {

  let n = 0;
  for (const [g, textos] of Object.entries(por)) {

    if (!s) [s] = await crearSecciones([{ guia: g, titulo: (SECCIONES[g] || { t: "Notas" }).t }]);
    if (!s) continue;
    const nuevo = textos.filter((t) => !s.texto.includes(t.trim()));

/* ================= REFERENTES ================= */
let filtroRef = "", obraForm = null; // obraForm: null | { id?: editando, clase, ficha }
const TREF = { imagen: "Imagen", video: "Video", audio: "Audio", enlace: "Enlace", color: "Color", cita: "Cita", obra: "Obra" };
const esURL = (v) => /^https?:\/\/[^\s<>"]+$/i.test(v);
function srcDeIframe(v) { const m = v.match(/<iframe[^>]*\ssrc=["']([^"']+)["']/i); return m ? m[1] : null; }
function detectar(v) {
  v = v.trim(); const ifr = srcDeIframe(v); if (ifr) v = ifr.startsWith("//") ? "https:" + ifr : ifr;
  if (/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) return { tipo: "color", valor: "#" + v.replace("#", "").toLowerCase() };
  if (!esURL(v)) return v ? { tipo: "cita", valor: v } : null;
  if (yt(v) || vimeo(v)) return { tipo: "video", valor: v };
  if (/open\.spotify\.com\/(embed\/)?(track|album|playlist|episode|show|artist)\//i.test(v) || /soundcloud\.com\//i.test(v)) return { tipo: "audio", valor: v };
  if (/\.(jpe?g|png|gif|webp|avif|svg)(\?|#|$)/i.test(v) || /(^https?:\/\/(i\.imgur\.com|i\.pinimg\.com|pbs\.twimg\.com|images\.unsplash\.com)\/)/i.test(v)) return { tipo: "imagen", valor: v };
  return { tipo: "enlace", valor: v };
}
function yt(u) { const m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i); return m && m[1]; }
function vimeo(u) { const m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i); return m && m[1]; }
function spotify(u) { const m = u.match(/open\.spotify\.com\/(?:embed\/)?(track|album|playlist|episode|show|artist)\/([\w]+)/i); return m && [m[1], m[2]]; }
const dominio = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };

// Obras: color por clase (los mismos de las categorías) y el estilo de cita elegido.
const OCOLOR = { libro: "var(--t-historia)", capitulo: "var(--t-historia)", videojuego: "var(--t-videojuego)", juegomesa: "var(--t-juegomesa)", pelicula: "var(--t-contenido)", cancion: "var(--t-producto)", web: "var(--t-otro)" };
const OBRAS = () => REFS.filter((r) => r.tipo === "obra");
const nAnalizadas = () => OBRAS().filter(O.analizada).length;
let estiloCita = (() => { try { const e = localStorage.getItem("forja-estilo-cita"); return O.ESTILOS[e] ? e : "apa"; } catch (e) { return "apa"; } })();
const estiloUsable = () => (PL.mas || estiloCita === "apa" ? estiloCita : "apa");
const puedeRefs = () => nivelDe("referentes") === "editar" && editable(P, ACT, PL);

  let det = null;

    else $("r-det").textContent = "";

    '<p class="veredicto" id="veredicto" aria-live="polite"></p>' +
    '<div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;align-items:center"><b style="font-family:var(--f-display)">¿Qué vas a hacer?</b>' +
    '<p class="hint" style="margin:0;text-align:center;max-width:58ch">La brújula solo compara tus respuestas con lo que suele lucir en cada formato. Elige el que tú quieras, aunque no sea el primero. Si eliges uno de otra categoría (por ejemplo, juego de mesa en una historia), el proyecto cambia de categoría y el Taller te sugiere las secciones que le faltan.</p>' + (P.tipo === "producto" ? '<p class="hint" style="margin:0;text-align:center">Para un producto la brújula sirve poco; úsala si tu producto también cuenta una historia.</p>' : "") + '' +
    '<div class="formatos" id="formatos"></div></div></section>';
  const B = () => base(P.tipo, P.formato);
  const etiqueta = () => { const f = FORMATOS.find((x) => x.k === P.formato); return f ? "<b>" + esc(f.n.toLowerCase()) + "</b>" : "la categoría <b>" + esc(TIPOS[P.tipo].toLowerCase()) + "</b>"; };
  let repintar = null;
  const pintarLectura = () => {
    if (repintar) repintar();
    dial($("dial"), P.ejes, P.formato, B());
    $("veredicto").innerHTML = veredicto(P.ejes, B(), etiqueta()) +
      (tocado(P.ejes) ? ' <button type="button" class="btn chico" id="b-reset" title="Vuelve a cómo suele ser este formato">Volver a la configuración inicial</button>' : "");
    if ($("b-reset")) $("b-reset").onclick = () => { P.ejes = {}; guardar({ ejes: {} }, "Configuración inicial restaurada"); pintarLectura(); };
    const l = Object.fromEntries(lectura(P.ejes, B()).map((f) => [f.k, f.s]));
    $("formatos").innerHTML = FORMATOS.map((f) => '<button type="button" data-f="' + f.k + '" aria-pressed="' + (P.formato === f.k) + '">' + f.n + " <small>" + pct(l[f.k]) + "</small></button>").join("") +
      '<button type="button" data-f="" aria-pressed="' + (!P.formato) + '">Aún no decido</button>';
    $("formatos").querySelectorAll("[data-f]").forEach((b) => b.onclick = async () => { await elegirFormato(b.dataset.f || null); pintarLectura(); });
  };
  const subir = debounce(() => guardar({ ejes: P.ejes }), 700);
  repintar = radar($("radar"), () => P.ejes, (e) => { P.ejes = e; pintarLectura(); subir(); }, $("pregunta"), B);
  pintarLectura();
}

/* ================= COSTOS ================= */
function costos() {
  if (!COT) {
    $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><h2>Costos</h2><p style="margin:0">Cada proyecto tiene una cotización propia: una lista de componentes (por ejemplo tablero, cartas, figuras o impresión) con los precios que te dan distintos proveedores. Forja calcula el costo real puesto en Chile y te dice cuál conviene según la cantidad.</p>' +
      '<p class="hint" style="margin:0">Empieza con los componentes que suele tener ' + esc(TIPOS[P.tipo].toLowerCase()) + '; los puedes quitar o agregar otros.</p><div><button class="btn prim" id="b-cot">Crear la cotización de este proyecto</button></div></section>';
    $("b-cot").onclick = async () => {
      const { data, error } = await sb.from("cotizaciones").insert({ espacio_id: ESP, proyecto_id: P.id, nombre: P.nombre, datos: {} }).select("id").single();
      if (error) { toast(limite(error) || "No se pudo crear la cotización."); return; }
      location.href = "../cotizador/?c=" + data.id;
    };
    $("panel").insertAdjacentHTML("beforeend", pronto(["versiones-precio", "campanas", "presupuesto-fondos"]));
    return;
  }
  const d = COT.datos || {}, comps = d.componentes || [], qs = d.cotizaciones || [];
  $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><div class="cab"><h2>Costos</h2><span class="hint">Actualizada ' + hace(COT.actualizado_en) + "</span></div>" +
    (comps.length ? '<div class="comps">' + comps.map((c) => { const n = qs.filter((q) => q.compId === c.id).length; return '<span class="' + (n ? "ok" : "") + '">' + esc(c.nombre) + (n ? " · " + n : " · sin precios") + "</span>"; }).join("") + "</div>" : '<p class="hint" style="margin:0">La cotización aún no tiene componentes.</p>') +
    '<p class="hint" style="margin:0">' + qs.length + (qs.length === 1 ? " precio registrado" : " precios registrados") + (d.cantidades && d.cantidades.length ? " · comparando " + d.cantidades.join(", ") + " unidades" : "") + '.</p><div><a class="btn prim" style="text-decoration:none;display:inline-block" href="../cotizador/?c=' + COT.id + '">Abrir la cotización</a> <a class="btn" style="text-decoration:none;display:inline-block" href="../cotizador/?c=' + COT.id + '#campana">Campaña y recompensas</a></div></section>';
  $("panel").insertAdjacentHTML("beforeend", '<div class="pronto-grid" style="margin-top:14px">' + tarjetaFuncion("campanas", "../cotizador/?c=" + COT.id + "#campana") + "</div>" + pronto(["versiones-precio", "campanas", "presupuesto-fondos"]));
}

/* ================= OPORTUNIDADES ================= */
function reloj(o) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const d = (s) => { if (!s) return null; const [y, m, dd] = s.split("-"); return Math.round((new Date(+y, m - 1, +dd) - hoy) / 864e5); };
  const pi = d(o.postul_inicio), pf = d(o.postul_fin), ei = d(o.evento_inicio), ef = d(o.evento_fin) ?? ei, est = o.fechas_estimadas ? "≈ " : "";
  if (pi != null && pi > 0) return { t: est + "postulación abre en " + pi + " días", k: pi };
  if (pf != null && pf >= 0) return { t: pf === 0 ? "postulación cierra hoy" : "postulación abierta · cierra en " + pf + " días", c: pf <= 14 ? "pronto" : "abierta", k: pf };
  if (ei != null && ei > 0) return { t: est + "evento en " + ei + " días", k: ei + 1000 };
  if (ef != null && ef >= 0) return { t: "evento en curso", k: 0 };
  return { t: o.postul_texto || o.evento_texto || "sin fechas próximas", fin: pf != null || ef != null, k: 9e9 };
}
async function oportunidades() {
  $("panel").innerHTML = '<div class="skeleton" style="margin-top:14px"></div>';
  if (!OPS) { const { data } = await sb.from("oportunidades").select("*").order("nombre"); OPS = data || []; }
  if (pest !== "oportunidades") return;
  const area = areaDe(P.tipo, P.formato), AREA = { videojuego: "videojuegos", comic: "cómic y libros", juegomesa: "juegos de mesa", general: "emprendimiento" };
  const sigo = new Set(SEGS.map((s) => s.oportunidad_id));
  const vivas = OPS.filter((o) => !sigo.has(o.id) && !reloj(o).fin).sort((a, b) => reloj(a).k - reloj(b).k);
  const sug = vivas.filter((o) => (o.areas || []).includes(area));
  const generales = vivas.filter((o) => !sug.includes(o) && (o.areas || []).includes("general"));
  const resto = vivas.filter((o) => !sug.includes(o) && !generales.includes(o));
  const card = (o, seg) => {
    const r = reloj(o);
    const det = [["Premio o apoyo", o.premio], ["Costo", o.costo], ["Requisitos", o.requisitos], ["Qué llevar", o.que_llevar], ["Lugar", o.lugar], ["Notas", o.notas]].filter((x) => x[1]).map((x) => "<dt>" + x[0] + "</dt><dd>" + esc(x[1]) + "</dd>").join("") + (o.fuente ? '<dt>Fuente</dt><dd><a href="' + esc(o.fuente) + '" target="_blank" rel="noopener">' + esc(dominio(o.fuente)) + "</a></dd>" : "");
    return '<article class="op ' + (r.c || "") + '"><h3>' + esc(o.nombre) + '</h3><span class="org">' + esc(o.organiza || "") + '</span><span class="reloj">' + esc(r.t) + "</span>" +
      (det ? "<details><summary>Detalles</summary><dl>" + det + "</dl></details>" : "") +
      '<div class="pie">' + (seg ? '<label class="fx-sr" for="st-' + o.id + '">Estado</label><select id="st-' + o.id + '" data-op="' + o.id + '">' + Object.entries(ESTOP).map(([k, n]) => '<option value="' + k + '"' + (k === seg.estado ? " selected" : "") + ">" + n + "</option>").join("") + '<option value="__quitar">Dejar de seguir</option></select>' : '<span></span><button class="btn chico" data-seguir="' + o.id + '">Seguir</button>') + "</div></article>";
  };
  const grupo = (titulo, sub, lista, abierto = true) => lista.length ? '<section style="display:flex;flex-direction:column;gap:10px;margin-top:18px"><div class="cab"><h2>' + titulo + '</h2><span class="hint">' + sub + "</span></div>" + (abierto ? '<div class="ops2">' + lista.map((o) => card(o)).join("") + "</div>" : '<details><summary class="hint" style="cursor:pointer;color:var(--accent)">Mostrar ' + lista.length + '</summary><div class="ops2" style="margin-top:10px">' + lista.map((o) => card(o)).join("") + "</div></details>") + "</section>" : "";
  $("panel").innerHTML =
    (SEGS.length ? '<section style="display:flex;flex-direction:column;gap:10px;margin-top:14px"><div class="cab"><h2>Las que sigues</h2><span class="hint">Anota en qué vas con cada una.</span></div><div class="ops2">' + SEGS.map((s) => { const o = OPS.find((x) => x.id === s.oportunidad_id); return o ? card(o, s) : ""; }).join("") + "</div></section>" : "") +
    (sug.length ? grupo("A qué te puedes presentar", "Según el tipo de proyecto" + (P.formato ? " y el formato elegido" : "") + ": " + AREA[area] + ".", sug)
      : '<div class="vacio" style="margin-top:14px">Ahora no hay convocatorias abiertas ni eventos próximos de ' + AREA[area] + '. La lista se revisa cada mañana.</div>') +
    grupo("Para cualquier emprendimiento", "Fondos y ferias generales que también te pueden servir.", generales, sug.length < 3) +
    grupo("Otras áreas", "Por si tu proyecto cruza a otro lado.", resto, false) + pronto(["alertas", "tareas"]);
  activarAvisame($("panel"));
  $("panel").onclick = async (e) => {
    const b = e.target.closest("[data-seguir]"); if (!b) return;
    const { error } = await sb.from("proyecto_oportunidades").insert({ proyecto_id: P.id, oportunidad_id: b.dataset.seguir, espacio_id: ESP });
    if (error) { toast(limite(error) || "No se pudo agregar."); return; }
    SEGS.push({ oportunidad_id: b.dataset.seguir, estado: "interesa" }); pintarTabs(); oportunidades();
  };
  $("panel").onchange = async (e) => {
    const s = e.target.closest("[data-op]"); if (!s) return;
    const op = s.dataset.op;
    if (s.value === "__quitar") {
      const { error } = await sb.from("proyecto_oportunidades").delete().eq("proyecto_id", P.id).eq("oportunidad_id", op);
      if (!error) { SEGS = SEGS.filter((x) => x.oportunidad_id !== op); pintarTabs(); oportunidades(); }
      return;
    }
    const { error } = await sb.from("proyecto_oportunidades").update({ estado: s.value }).eq("proyecto_id", P.id).eq("oportunidad_id", op);
    if (error) toast(limite(error) || "No se pudo guardar."); else SEGS.find((x) => x.oportunidad_id === op).estado = s.value;
  };
}

// La vitrina se edita en su propia página (../vitrina/editar/); aquí se ve su estado y se comparte.
function vitrina() {
  $("panel").style.setProperty("--tc", tc(P.tipo));
  const url = VIT ? new URL("../vitrina/?v=" + VIT.slug, location.href).href : "";
  $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><div class="cab"><h2>Vitrina</h2>' + (VIT && VIT.publicada ? '<span class="vit-vivo">● Publicada ' + hace(VIT.publicado_en) + "</span>" : VIT ? '<span class="hint">Borrador sin publicar</span>' : "") + "</div>" +
    '<div class="vit-hero"><div><p style="margin:0 0 8px;max-width:58ch">La página pública de tu proyecto, para compartir en redes, ferias, fondos o con una editorial. Tú eliges qué mostrar: la historia, imágenes, novedades y, con Forja Más, tus pizarras para explorarlas.</p>' +
    '<p class="hint" style="margin:0 0 14px">Nada de tu Taller, tu bitácora ni tus pizarras se publica solo: la vitrina usa copias que tú revisas antes de publicar.</p>' +
    '<div class="vit-acc"><a class="btn prim" href="../vitrina/editar/?p=' + P.id + '">' + (VIT ? "Editar la vitrina" : "Crear la vitrina") + "</a>" + (VIT && VIT.publicada ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ver la página ↗</a><button type="button" class="btn pz-libre" id="vit-copiar">Copiar enlace</button>' : "") + "</div></div>" +
    '<svg class="vit-ilus" viewBox="0 0 160 110" aria-hidden="true"><rect x="6" y="6" width="148" height="98" rx="10"/><rect class="h" x="6" y="6" width="148" height="44" rx="10"/><rect class="t" x="18" y="30" width="70" height="8" rx="3"/><rect class="l" x="18" y="60" width="56" height="5" rx="2"/><rect class="l" x="18" y="70" width="44" height="5" rx="2"/><rect class="g" x="90" y="58" width="24" height="18" rx="3"/><rect class="g" x="118" y="58" width="24" height="30" rx="3"/><rect class="g" x="90" y="80" width="24" height="12" rx="3"/></svg></div></section>';
  const c = $("vit-copiar"); if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(url); toast("Enlace copiado"); } catch (e) { toast(url); } };
}

function bitacora() {
  $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><div class="cab"><h2>Bitácora</h2><span class="hint">Avances, decisiones e ideas sueltas, con fecha.</span></div>' +
    '<form class="nueva" id="f-nota"><label class="fx-sr" for="f-texto">Nueva entrada</label><textarea id="f-texto" maxlength="20000" placeholder="¿Qué avanzaste o decidiste hoy?"></textarea>' +
    '<div class="fila"><span class="hint">Ctrl + Enter para guardar</span><button class="btn prim" type="submit">Anotar</button></div></form>' +
    '<div class="hilo" id="hilo" style="--tc:' + tc(P.tipo) + '"></div></section>';
  const pintar = () => {
    $("hilo").innerHTML = NOTAS.length ? NOTAS.map((n) => '<article class="nota"><time datetime="' + n.creado_en + '">' + fecha(n.creado_en) + '</time><button class="x" data-del="' + n.id + '" aria-label="Borrar entrada">borrar</button><p>' + esc(n.texto) + "</p></article>").join("")
      : '<p class="hint" style="margin:0">Todavía no hay entradas. La primera puede ser por qué te gusta esta idea.</p>';
  };
  pintar();
  $("f-texto").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("f-nota").requestSubmit(); };
  $("f-nota").onsubmit = async (e) => {
    e.preventDefault();
    const texto = $("f-texto").value.trim(); if (!texto) return;
    const { data, error } = await sb.from("notas").insert({ espacio_id: ESP, proyecto_id: P.id, texto }).select("id,texto,creado_en").single();
    if (error) { toast(limite(error) || "No se pudo anotar."); return; }
    NOTAS.unshift(data); $("f-texto").value = ""; pintar(); pintarTabs(); tocarProyecto();
  };
  $("hilo").onclick = async (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "¿seguro?"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "borrar"; } }, 3500); return; }
    const { error } = await sb.from("notas").delete().eq("id", b.dataset.del);
    if (error) { toast("No se pudo borrar."); return; }
    NOTAS = NOTAS.filter((n) => n.id !== b.dataset.del); pintar(); pintarTabs();
  };
}
