<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Proyecto</title>
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: página de proyecto — cabecera editable y pestañas (Taller, Referentes, Brújula, Costos, Oportunidades, Bitácora); el Taller es índice de secciones + hoja de escritura */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h2{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,select,input,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
#app{display:flex;flex-direction:column;gap:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.peligro{color:var(--bad)}
.btn.chico{padding:3px 9px;font-size:13px}
.vol{font-size:14px;text-decoration:none}

/* cabecera */
.cabeza{display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--tc);padding-left:14px}
.cabeza input.nombre{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,38px);line-height:1.15;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;width:100%}
.cabeza input.nombre:hover{border-color:var(--line)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.ctrl select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:14px}
.estados{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.estados button{white-space:nowrap;flex:none;border:0;background:transparent;padding:4px 11px;font-size:13px;color:var(--muted)}
.estados button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
.eq-fila{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.eq-que{color:var(--muted)}.eq-que b{color:var(--fg)}
.eq-presencia{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-size:13.5px}
.eq-presencia i{width:8px;height:8px;border-radius:50%;background:var(--good);animation:eqlat 2s ease-in-out infinite}
@keyframes eqlat{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.eq-presencia i{animation:none}}
.eq-acc{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.eq-conf{flex-basis:100%;display:flex;flex-direction:column;gap:10px;padding-top:6px}
.eq-conf[hidden]{display:none}
.eq-conf p{margin:0}
.eq-botones{display:flex;gap:8px;flex-wrap:wrap}
.btn.primario{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.eq-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.eq-modos button{font:inherit;text-align:left;cursor:pointer;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;color:var(--fg)}
.eq-modos button small{color:var(--muted);font-size:13px}
.eq-modos button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.eq-personas{display:flex;flex-direction:column;gap:6px}
.eq-personas label{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;overflow-wrap:anywhere}
.eq-personas select{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--field);color:var(--fg)}
.per-intro{color:var(--muted);font-size:14px}
.per{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.per-cab{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;overflow-wrap:anywhere}
.per-extra{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px}
.per-quitar{margin-left:auto;font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}
.per-quitar[data-seguro="1"]{color:var(--bad);font-weight:700}
.per-guardar[hidden]{display:none}
.ar-chips{display:flex;flex-wrap:wrap;gap:6px}
.ar-chip{font:inherit;display:inline-flex;flex-direction:column;align-items:flex-start;gap:0;padding:5px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;line-height:1.25;min-width:96px;text-align:left}
button.ar-chip{cursor:pointer}
.ar-chip span{font-size:11.5px;font-weight:700;letter-spacing:.02em}
.ar-chip.v-editar{border-color:var(--good);background:var(--good-soft)}.ar-chip.v-editar span{color:var(--good)}
.ar-chip.v-ver{border-color:var(--line)}.ar-chip.v-ver span{color:var(--muted)}
.ar-chip.v-no{border-style:dashed;opacity:.65}.ar-chip.v-no b{text-decoration:line-through}
.per-pend{display:flex;flex-direction:column;gap:4px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.per-pend small{color:var(--muted)}
.per-pend button{font:inherit;font-size:13px;background:none;border:0;color:var(--accent);cursor:pointer;text-decoration:underline}
.per-nueva{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.per-fila{display:flex;gap:8px;flex-wrap:wrap}
.per-fila input{flex:1 1 220px;font:inherit;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--field);color:var(--fg)}
.per-presets{display:flex;flex-wrap:wrap;gap:6px}
.per-presets button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;background:transparent;color:var(--muted);cursor:pointer}
.per-presets button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.eq-aviso{margin:0 0 8px;border-left:3px solid var(--good);background:var(--good-soft);border-radius:8px;padding:8px 12px;font-size:14px}
.lectura{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border:1.5px solid var(--e-pausa);background:color-mix(in srgb,var(--e-pausa) 8%,var(--card));border-radius:12px;padding:10px 14px;font-size:14px}
.lectura b{color:var(--e-pausa)}
:disabled{cursor:not-allowed}
.total.tope{display:flex;flex-direction:column;gap:5px;--ec:var(--accent)}
@media (max-width:820px){.total.tope{display:flex;flex:none;min-width:160px;padding:4px 8px}}
.total.tope.cerca{--ec:var(--e-pausa)}
.total.tope small{font-family:var(--f-body);font-size:12px;color:var(--e-pausa)}
.pronto-fila{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.pronto-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px}
.pronto-cab b{font-family:var(--f-display);font-size:15px}
.pronto-cab a{font-size:13px}
.pronto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
/* vitrina */
.vit-vivo{font-size:13px;font-weight:700;color:var(--good)}
.vit-hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;align-items:center}
.vit-acc{display:flex;gap:8px;flex-wrap:wrap}
.vit-acc .btn{text-decoration:none;display:inline-flex;align-items:center}
.vit-ilus{width:100%;height:auto}
.vit-ilus rect{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.vit-ilus .h{fill:color-mix(in srgb,var(--tc,var(--accent)) 22%,var(--card));stroke:none}
.vit-ilus .t{fill:var(--tc,var(--accent));stroke:none}
.vit-ilus .l{fill:var(--line);stroke:none}
.vit-ilus .g{fill:color-mix(in srgb,var(--tc,var(--accent)) 12%,var(--field));stroke:none}
@media (max-width:640px){.vit-hero{grid-template-columns:1fr}.vit-ilus{display:none}}
/* pizarra: pestañas de pizarras, elección de modo y cabecera */
.piz-cab{display:flex;flex-direction:column;gap:8px}
.piz-chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.piz-chips [data-piz]{flex:none;display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:6px 12px 6px 8px;position:relative}
.piz-chips [data-piz] svg{width:38px;height:29px;flex:none}
.piz-chips [data-piz] span{display:flex;flex-direction:column;line-height:1.2}
.piz-chips [data-piz] b{font-family:var(--f-display);font-size:14px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.piz-chips [data-piz] small{font-size:11.5px;color:var(--muted)}
.piz-chips [data-piz][aria-selected="true"]{border-color:var(--tc);box-shadow:inset 0 -3px 0 var(--tc)}
.piz-candado{color:var(--muted);display:flex;margin-left:2px}
.piz-chips .piz-candado svg{width:14px;height:14px}
.piz-chips .piz-candado svg *{fill:currentColor;stroke:none}
.piz-nueva{flex:none;border:1.5px dashed var(--line);background:none;border-radius:12px;padding:8px 14px;font-size:14px;color:var(--muted)}
.piz-nueva:hover,.piz-nueva[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.piz-modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.piz-op{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px 14px}
.piz-op:hover:not(:disabled){border-color:var(--tc);box-shadow:0 6px 20px rgba(10,14,30,.07)}
.piz-op svg{width:100%;max-width:120px;height:auto;margin-bottom:4px}
.piz-op b{font-family:var(--f-display);font-size:16px}
.piz-op span{font-size:13px;color:var(--muted);line-height:1.45}
.piz-op em{position:absolute;top:10px;right:10px;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 45%,var(--line));border-radius:999px;padding:1px 8px;background:var(--ember-soft)}
.piz-op.bloq svg{opacity:.55}
.piz-chips svg *,.piz-op svg *{fill:color-mix(in srgb,var(--tc,var(--accent)) 16%,var(--card));stroke:var(--tc,var(--accent));stroke-width:2}
.piz-chips svg .l,.piz-op svg .l{fill:none;stroke:var(--muted);stroke-width:2}
.piz-chips svg .l.r,.piz-op svg .l.r{stroke:var(--ember)}
.piz-chips svg .l.d,.piz-op svg .l.d{stroke-dasharray:4 4}
.piz-chips svg .col,.piz-op svg .col{fill:color-mix(in srgb,var(--muted) 10%,var(--card));stroke:var(--line)}
.piz-chips svg .pin,.piz-op svg .pin{fill:var(--ember);stroke:none}
.piz-nota{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1.5px dashed var(--ember);background:var(--ember-soft);border-radius:12px;padding:10px 14px;font-size:14px}
.piz-lock{margin:10px 0 0;align-items:center}
.piz-lock svg{color:var(--e-pausa);flex:none}
.piz-titulo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:14px 0 10px}
.piz-titulo input{font-family:var(--f-display);font-weight:700;font-size:20px;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;min-width:0;flex:1 1 220px}
.piz-titulo input:hover:not(:disabled){border-color:var(--line)}
.piz-modo{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.piz-pie{margin:10px 0 0}
.ref.destello{animation:destello 1.6s ease-out}
@keyframes destello{0%,40%{box-shadow:0 0 0 3px var(--ember)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.ref.destello{animation:none;box-shadow:0 0 0 3px var(--ember)}}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sel select{font-size:15px}
.estado-w{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--ec) 8%,var(--card));border:1.5px solid color-mix(in srgb,var(--ec) 40%,var(--line));border-radius:14px;padding:10px 12px}
.estados button[aria-checked="true"]{background:var(--ec);color:#fff;font-weight:700}
.estados button[aria-checked="true"]::before{content:"● ";font-size:10px}
.avance-w{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avance-w .fx-avance{flex:1;height:8px}
.avance-w b{color:var(--fg);font-family:var(--f-num)}
.fx-tabs .punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ember);margin-left:5px;vertical-align:2px}
.sugerencia{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1.5px dashed var(--ember);background:var(--ember-soft);border-radius:14px;padding:12px 14px}
.sugerencia .ops{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sugerencia .ops .hint{background:none;border:0;padding:2px 0}
.sugerencia .ops .menos{text-decoration:line-through;color:var(--muted)}
.indice .aparte{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 2px;border-top:1px dashed var(--line);margin-top:6px}
@media (max-width:820px){.indice .aparte{flex:none;border:0;padding:8px 2px 0 8px;margin:0;align-self:center;border-left:1px dashed var(--line)}}
.sugerencia .ops span{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--card);border:1px solid var(--line)}
.sugerencia .acc{display:flex;gap:6px}
.etapa{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.etapa-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.etapa-top b{font-family:var(--f-num);font-size:13px}
.etapas{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.etapas button{flex:1 0 auto;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 9px;font-size:13px;white-space:nowrap}
.etapas button[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.etapa-fina{display:flex;align-items:center;gap:12px}
.etapa-fina input[type=range]{flex:1;accent-color:var(--tc)}
.peso{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.peso input{width:64px;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 6px;font-family:var(--f-num)}
.indice button.sec{position:relative;overflow:hidden}
.indice button.sec::after{content:"";position:absolute;left:10px;right:10px;bottom:3px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--tc) var(--av),transparent var(--av))}
.indice button.sec.lista span:first-child::before{content:"✓ ";color:var(--good)}
.sello{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ember);color:var(--ember);border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px;background:none}
textarea.resumen{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;line-height:1.5}
.fx-tabs{position:sticky;top:0;z-index:5;background:var(--bg)}

.bloque{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.vacio{border:1.5px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}

/* taller */
.taller{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.taller{grid-template-columns:minmax(0,1fr)}}
.indice{position:sticky;top:52px;display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.indice{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}}
.indice button.sec{display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--muted)}
.indice button.sec .w{font-family:var(--f-num);font-size:11px}
.indice button.sec.lleno{color:var(--fg)}
.indice button.sec[aria-current="true"]{background:var(--card);color:var(--fg);font-weight:700;box-shadow:inset 3px 0 0 var(--tc)}
@media (max-width:820px){.indice button.sec{flex:none;border:1px solid var(--line);background:var(--card);white-space:nowrap}.indice button.sec[aria-current="true"]{box-shadow:none;border-color:var(--tc)}}
.indice .mas{margin-top:8px}
@media (max-width:820px){.indice .mas{margin-top:0;flex:none}}
.total{font-size:12px;color:var(--muted);font-family:var(--f-num);padding:8px 10px}
@media (max-width:820px){.total{display:none}}
.hoja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:12px;min-width:0}
.hoja.foco{position:fixed;inset:0;z-index:40;border-radius:0;overflow:auto;padding:clamp(18px,6vw,80px) max(18px,calc((100vw - 760px)/2))}
.hoja .tit{font-family:var(--f-display);font-weight:700;font-size:24px;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;width:100%}
.hoja .tit:hover{border-color:var(--line)}
.guia{border:1px solid var(--line);border-radius:12px;background:var(--field)}
.guia summary{cursor:pointer;padding:8px 12px;font-size:14px;color:var(--accent);list-style:none}
.guia summary::-webkit-details-marker{display:none}
.guia summary::before{content:"✦ ";color:var(--ember)}
.guia .pregs{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.guia .preg{font-size:14px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;cursor:pointer;background:none;border-top:0;border-right:0;border-bottom:0;text-align:left}
.guia .preg:hover{color:var(--fg);border-left-color:var(--ember)}
textarea.texto{width:100%;min-height:340px;resize:none;overflow:hidden;border:0;background:transparent;font-family:"Literata",Georgia,serif;font-size:17px;line-height:1.75;padding:4px 0;outline:none}
.hoja.foco textarea.texto{font-size:19px;min-height:70vh}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.barra .acc{display:flex;flex-wrap:wrap;gap:6px}
.est{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.menu-sec{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:14px}
.menu-sec .ops{display:flex;flex-wrap:wrap;gap:6px}
.menu-sec .ops button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 11px;font-size:13px}
.menu-sec .ops button:hover{border-color:var(--accent)}
.menu-sec .fila{display:flex;gap:6px}
.menu-sec input{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 10px}

/* referentes */
.agregar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.agregar input,.agregar textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 12px}
.agregar .extra{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px}
@media (max-width:640px){.agregar .extra{grid-template-columns:minmax(0,1fr)}}
.agregar select{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px}
.detecta{grid-column:1/-1;font-size:13px;color:var(--muted);min-height:1.4em}
.filtro{display:flex;flex-wrap:wrap;gap:6px}
.filtro button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px}
.filtro button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.muro{columns:3 260px;column-gap:12px}
.ref{break-inside:avoid;margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ref .media{position:relative;background:var(--field)}
.ref img{display:block;width:100%;height:auto}
.ref .play{position:absolute;inset:0;display:grid;place-items:center;border:0;background:linear-gradient(transparent,rgba(0,0,0,.25));color:#fff;font-size:15px;font-weight:700}
.ref .play span{background:rgba(0,0,0,.6);border-radius:999px;padding:8px 16px}
.ref iframe{display:block;width:100%;border:0}
.ref .video iframe{aspect-ratio:16/9;height:auto}
.ref .swatch{height:120px;display:flex;align-items:flex-end;padding:10px 12px;font-family:var(--f-num);font-weight:700}
.ref blockquote{margin:0;padding:18px 18px 8px;font-family:"Literata",Georgia,serif;font-size:17px;line-height:1.6}
.ref blockquote::before{content:"“";font-size:40px;line-height:0;vertical-align:-14px;color:var(--ember);margin-right:2px}
.ref .link{padding:14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--fg)}
.ref .link small{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.03em}
.ref .link b{font-family:var(--f-display);font-size:16px;overflow-wrap:anywhere}
.ref .cuerpo{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ref .cuerpo b{font-family:var(--f-display);font-size:15px}
.ref .cuerpo p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.ref .cuerpo .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ref .cuerpo .meta button{border:0;background:none;color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0;padding:0 3px}
.ref .cuerpo .meta button:hover{color:var(--accent)}
.ref .cuerpo textarea,.ref .cuerpo input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px 8px;font-size:14px}

/* brújula */
.brujula{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.brujula{grid-template-columns:minmax(0,1fr)}}
.leyenda-b{display:flex;justify-content:center;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:2px 0 0}
.leyenda-b i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);margin-right:-8px}
.leyenda-b i.l2{border-top:2px dashed var(--ember)}
.pregunta{min-height:2.8em;text-align:center;font-size:13px;color:var(--muted);max-width:44ch;margin:4px auto 0}
.veredicto{font-size:15px;max-width:58ch;margin:0 auto;text-align:center}
.formatos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.formatos button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:baseline}
.formatos button small{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.formatos button[aria-pressed="true"]{border-color:var(--ember);background:var(--ember-soft);font-weight:700}

/* costos y oportunidades */
.comps{display:flex;flex-wrap:wrap;gap:6px}
.comps span{font-size:13px;border-radius:8px;padding:3px 10px;background:var(--field);border:1px solid var(--line)}
.comps span.ok{border-color:var(--good);background:var(--good-soft)}
.ops2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.op{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--line)}
.op.pronto{border-left-color:var(--ember)} .op.abierta{border-left-color:var(--good)}
.op h3{font-family:var(--f-display);font-size:16px;margin:0;line-height:1.25}
.op .org{font-size:13px;color:var(--muted)}
.op .reloj{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.op.pronto .reloj{color:var(--ember)} .op.abierta .reloj{color:var(--good)}
.op .pie{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.op select{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 6px;font-size:13px}
.op details{font-size:13px}
.op details summary{cursor:pointer;color:var(--accent)}
.op dl{margin:6px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:3px 10px}
.op dt{color:var(--muted)} .op dd{margin:0;overflow-wrap:anywhere}

/* bitácora */
.nueva textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px}
.nueva .fila{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.hilo{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:18px}
.hilo::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.nota{position:relative}
.nota::before{content:"";position:absolute;left:-18px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--tc)}
.nota:first-child::before{background:var(--tc)}
.nota time{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.nota p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.nota .x{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px;margin-left:6px}
.nota .x:hover{color:var(--bad)}
.pie-ficha{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:8px}
.skeleton{height:160px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--field),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="skeleton"></div></main>
</div>

<script type="module">
import { sb, $, esc, toast, debounce, fecha, hace, navApp, espacio, espacios, accesoProyecto, conSesion, plan, LIMITES, limite, editable, MAS_PRONTO, MAS_LINK, proximamente, activarAvisame } from "../js/forja.js";
import { funcion } from "../js/planes.js";
import { TIPOS, ESTADOS, tc, areaDe, SECCIONES, PLANTILLA, PLANTILLA_FORMATO, FORMATOS_DE, formatoCabe, tipoDe, sugeridas, pesoDe, ETAPAS, etapaDe, avance } from "../js/guias.js";
import { FORMATOS, radar, dial, veredicto, lectura, tocado, pct, base, CSS_BRUJULA } from "../js/brujula.js";
import { montar, MODOS, cuentaTarjetas, normal as normalPiz, CSS_PIZARRA } from "../js/pizarra.js";
import { pista } from "../js/ayuda.js";
navApp("proyectos");
document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_BRUJULA + CSS_PIZARRA + "</style>");

const ID = new URLSearchParams(location.search).get("p");
const PESTANAS = [["taller", "Taller"], ["referentes", "Referentes"], ["brujula", "Brújula"], ["pizarra", "Pizarra"], ["costos", "Costos"], ["oportunidades", "Oportunidades"], ["bitacora", "Bitácora"], ["vitrina", "Vitrina"]];
// Cada pestaña pertenece a un área; las personas invitadas pueden editar, ver o no ver cada área.
const AREA_DE = { taller: "taller", referentes: "referentes", brujula: "taller", pizarra: "pizarra", costos: "costos", oportunidades: "oportunidades", bitacora: "bitacora", vitrina: "vitrina" };
const AREAS = [["taller", "Taller y ficha"], ["referentes", "Referentes"], ["pizarra", "Pizarra"], ["costos", "Costos"], ["oportunidades", "Oportunidades"], ["bitacora", "Bitácora"], ["vitrina", "Vitrina"]];
const nivelDe = (k) => (ACC && ACC.areas ? ACC.areas[AREA_DE[k]] : "editar");
const visibles = () => PESTANAS.filter(([k]) => nivelDe(k));
const ESTOP = { interesa: "Me interesa", postulando: "Postulando", postulado: "Postulé", aceptado: "Aceptado", descartado: "Descartado" };
let ESP, P, ACC = null, VER = false, PERS = null, YO = null, EQS = [], CANAL = null, OTROS = [], PL = { mas: false }, ACT = 0, RO = false, SECS = [], REFS = [], NOTAS = [], COT = null, SEGS = [], OPS = null, PIZ = [], VIT = null, pizSel = null, EDITOR = null, pest = "taller", secActual = null;

if (!/^[0-9a-f-]{36}$/.test(ID || "")) location.replace("../proyectos/");
else conSesion($("app"), async (ses) => {
  YO = ses.user;
  // El proyecto manda: su espacio, su plan y lo que la persona puede hacer en él (personal o equipo).
  ACC = await accesoProyecto(ID);
  if (!ACC) { $("app").innerHTML = '<a class="vol" href="../proyectos/">← Proyectos</a><div class="fx-empty">Este proyecto no existe o no tienes acceso a él.</div>'; return; }
  ESP = ACC.espacio; PL = { mas: !!ACC.mas }; VER = ACC.acceso !== "editar";
  EQS = ACC.invitado ? [] : (await espacios()).filter((x) => x.tipo === "equipo" && x.rol !== "lector");
  PERS = (await sb.rpc("proyecto_personas", { p: ID })).data || null;
  if (ACC.tipo === "equipo") try { localStorage.setItem("forja-espacio", ESP); } catch (e) {}
  const ac = await sb.from("proyectos").select("id", { count: "exact", head: true }).eq("espacio_id", ESP).neq("estado", "archivado");
  ACT = ac.count || 0;
  const [pr, se, re, no, co, po, pz, vi] = await Promise.all([
    sb.from("proyectos").select("*").eq("id", ID).maybeSingle(),
    sb.from("secciones").select("id,titulo,guia,texto,orden,avance,peso").eq("proyecto_id", ID).order("orden"),
    sb.from("referentes").select("*").eq("proyecto_id", ID).order("creado_en", { ascending: false }),
    sb.from("notas").select("id,texto,creado_en").eq("proyecto_id", ID).order("creado_en", { ascending: false }),
    sb.from("cotizaciones").select("id,nombre,datos,actualizado_en").eq("proyecto_id", ID).maybeSingle(),
    sb.from("proyecto_oportunidades").select("oportunidad_id,estado").eq("proyecto_id", ID),
    sb.from("pizarras").select("id,nombre,modo,datos,creado_en").eq("proyecto_id", ID).order("creado_en"),
    sb.from("vitrinas").select("id,slug,publicada,publicado_en,actualizado_en").eq("proyecto_id", ID).maybeSingle(),
  ]);
  P = pr.data; VIT = vi.data || null;
  if (P) try { localStorage.setItem("forja-ultimo-proyecto", P.id); } catch (e) {}
  if (!P) { $("app").innerHTML = '<a class="vol" href="../proyectos/">← Proyectos</a><div class="fx-empty">Este proyecto no existe o no es tuyo.</div>'; return; }
  SECS = se.data || []; REFS = re.data || []; NOTAS = no.data || []; COT = co.data; SEGS = po.data || []; PIZ = pz.data || [];
  const h = location.hash.slice(1); if (PESTANAS.some(([k]) => k === h) && nivelDe(h)) pest = h;
  armar();
}, "Tus proyectos son privados: solo los ves tú.");

const guardar = async (cambios, aviso) => {
  Object.assign(P, cambios);
  const { error } = await sb.from("proyectos").update(cambios).eq("id", P.id);
  if (error) toast(limite(error) || "No se pudo guardar el cambio."); else if (aviso) toast(aviso);
  return error;
};
const tocarProyecto = debounce(() => sb.from("proyectos").update({ nombre: P.nombre }).eq("id", P.id), 4000);
const palabras = (t) => (t.trim().match(/\S+/g) || []).length;

/* ================= estructura ================= */
function armar() {
  document.title = "Forja · " + P.nombre;
  if (!nivelDe(pest)) pest = (visibles()[0] || ["taller"])[0];
  RO = calcRO();
  $("app").innerHTML =
    '<a class="vol" href="../proyectos/">← Proyectos</a>' +
    '<section class="cabeza" id="cabeza" style="--tc:' + tc(P.tipo) + ";--ec:var(--e-" + P.estado + ')">' +
    '<label class="fx-sr" for="f-nombre">Nombre del proyecto</label><input class="nombre" id="f-nombre" maxlength="160" value="' + esc(P.nombre) + '">' +
    '<div class="ctrl"><label class="sel"><span>Categoría</span><select id="f-tipo">' + Object.entries(TIPOS).map(([k, n]) => '<option value="' + k + '"' + (k === P.tipo ? " selected" : "") + ">" + n + "</option>").join("") + "</select></label>" +
    '<label class="sel" id="w-formato"><span>Formato</span><select id="f-formato"></select></label></div>' +
    '<div class="estado-w"><div class="estados" role="radiogroup" aria-label="Estado del proyecto">' + Object.entries(ESTADOS).map(([k, n]) => '<button type="button" role="radio" data-est="' + k + '" style="--ec:var(--e-' + k + ')" aria-checked="' + (k === P.estado) + '">' + n + "</button>").join("") + "</div>" +
    '<div class="avance-w" id="avance-w"></div></div>' +
    '<label class="fx-sr" for="f-resumen">Resumen</label><textarea class="resumen" id="f-resumen" maxlength="4000" placeholder="¿De qué se trata, en pocas líneas? Se puede reescribir cuando la idea cambie.">' + esc(P.resumen || "") + "</textarea></section>" +
    equipoFila() +
    (RO ? '<div class="lectura" role="status"><b>Solo lectura</b><span>' + (nivelDe(pest) !== "editar" ? (ACC.invitado ? "En esta parte del proyecto puedes mirar, pero no editar. Si necesitas cambiar algo, pídeselo a quien te invitó." : "Puedes ver este proyecto del equipo, pero no editarlo. Si necesitas editarlo, pídele permiso a quien administra el equipo.") : P.estado === "archivado"
      ? "Este proyecto está archivado. Puedes verlo y exportarlo; para editarlo cámbialo a otro estado (usa uno de tus " + LIMITES.proyectos + " cupos del plan gratis)."
      : "Tienes " + ACT + " proyectos en curso y el plan gratis permite " + LIMITES.proyectos + ". Archiva " + (ACT - LIMITES.proyectos) + " (este u otro, desde Mi forja) para seguir editando. Nada se borra.") + "</span></div>" : "") +
    '<div class="fx-tabs" role="tablist" id="tabs"></div><div id="panel" role="tabpanel"></div>' +
    '<div class="pie-ficha"><a class="btn" style="text-decoration:none" href="../biblia/?p=' + P.id + '" target="_blank" rel="noopener">Exportar la biblia del proyecto (PDF)</a><span id="zona-borrar">' + (ACC.rol === "dueno" ? '<button class="btn peligro" type="button" id="b-borrar">Borrar proyecto</button>' : "") + "</span></div>";

  $("f-nombre").onchange = (e) => { const v = e.target.value.trim(); if (!v) { e.target.value = P.nombre; return; } guardar({ nombre: v }); document.title = "Forja · " + v; };
  $("f-tipo").onchange = (e) => cambiarTipo(e.target.value);
  $("f-formato").onchange = (e) => elegirFormato(e.target.value || null);
  document.querySelectorAll("[data-est]").forEach((b) => b.onclick = async () => {
    const antes = P.estado, nuevo = b.dataset.est; if (nuevo === antes) return;
    const { error } = await sb.from("proyectos").update({ estado: nuevo }).eq("id", P.id);
    if (error) { toast(limite(error) || "No se pudo cambiar el estado."); return; }
    P.estado = nuevo;
    if (antes === "archivado") ACT++; else if (nuevo === "archivado") ACT--;
    toast("Proyecto: " + ESTADOS[nuevo].toLowerCase());
    armar();
  });
  $("f-resumen").onchange = (e) => guardar({ resumen: e.target.value.trim() || null });
  activarEquipo();
  if ($("b-borrar")) $("b-borrar").onclick = () => {
    $("zona-borrar").innerHTML = '<span class="hint">Se borran su escritura, referentes, pizarras, bitácora y cotización.</span> <button class="btn peligro" id="b-si">Sí, borrar</button> <button class="btn" id="b-no">Cancelar</button>';
    $("b-no").onclick = () => { $("zona-borrar").innerHTML = '<button class="btn peligro" type="button" id="b-borrar">Borrar proyecto</button>'; $("b-borrar").onclick = armar; };
    $("b-si").onclick = async () => {
      if (COT) await sb.from("cotizaciones").delete().eq("id", COT.id);
      const { error } = await sb.from("proyectos").delete().eq("id", P.id);
      if (error) { toast("No se pudo borrar."); return; }
      location.href = "../proyectos/";
    };
  };
  pintarFormatos(); pintarAvance(); pintarTabs(); pintarPestana();
  aplicarSoloLectura();
  // La ficha (nombre, categoría, estado, resumen) es parte del Taller: sin permiso ahí, queda para leer.
  if (nivelDe("taller") !== "editar") $("cabeza").querySelectorAll("input, textarea, select, button").forEach((el) => { el.disabled = true; if ("readOnly" in el) el.readOnly = true; });
}
/* ================= equipo: acceso, mover y quién está ================= */
// Franja bajo la cabecera: de qué espacio es, quién lo ve, moverlo y quién más está mirando ahora.
function equipoFila() {
  const enEquipo = ACC.tipo === "equipo", dueno = ACC.rol === "dueno";
  const destinos = enEquipo ? [] : EQS, n = PERS ? PERS.personas.length : 0;
  const que = ACC.invitado ? '<span class="eq-que">Proyecto de <b>' + esc(PERS ? PERS.duenos.map((c) => c.split("@")[0]).join(", ") : "otra persona") + "</b> · compartido contigo</span>"
    : enEquipo ? '<span class="eq-que"><b>' + esc(ACC.nombre) + "</b> · " + (P.acceso === "reservado" ? "Reservado: lo ven solo las personas elegidas" : "Abierto a todo el equipo") + "</span>"
    : '<span class="eq-que">' + (n ? "Trabajas con " + n + (n === 1 ? " persona más" : " personas más") : "Proyecto personal") + "</span>";
  return '<div class="eq-fila" id="eq-fila">' + que +
    '<span class="eq-presencia" id="eq-presencia"></span><span class="eq-acc">' +
    (ACC.publica || n || ACC.invitado ? '<button type="button" class="btn" id="eq-personas">' + (ACC.publica && !n && !enEquipo ? "Invitar personas" : "Personas") + "</button>" : "") +
    (ACC.invitado ? '<button type="button" class="btn" id="eq-salir">Salir del proyecto</button>' : "") +
    (enEquipo && dueno ? '<button type="button" class="btn" id="eq-quien">Quién lo ve</button><button type="button" class="btn" id="eq-mover" data-a="">Mover a mi forja</button>' : "") +
    destinos.map((d) => '<button type="button" class="btn" data-mover="' + d.id + '">Mover a ' + esc(d.nombre) + "</button>").join("") +
    '</span><div class="eq-conf" id="eq-conf" hidden></div></div>';
}
async function activarEquipo() {
  if (!$("eq-fila")) return;
  const conf = $("eq-conf");
  const mover = async (destino, nombre) => {
    conf.hidden = false;
    conf.innerHTML = "<p>" + (ACC.tipo === "equipo"
      ? "El proyecto sale del equipo y pasa a tu forja personal, con todo lo que tiene. Las demás personas dejan de verlo."
      : "El proyecto pasa a <b>" + esc(nombre) + "</b> con todo lo que tiene (escritura, referentes, pizarras, bitácora, vitrina y cotización). Lo verán las personas del equipo según sus roles; si es delicado, después márcalo como reservado.") +
      '</p><div class="eq-botones"><button type="button" class="btn primario" id="eq-si">Sí, moverlo</button><button type="button" class="btn" id="eq-no">Cancelar</button></div>';
    $("eq-no").onclick = () => { conf.hidden = true; };
    $("eq-si").onclick = async () => {
      $("eq-si").disabled = true;
      let dest = destino;
      if (!dest) { const lista = await espacios(); const p = lista.find((x) => x.tipo === "personal"); dest = p && p.id; }
      const { error } = await sb.rpc("mover_proyecto", { p: P.id, destino: dest });
      if (error) { $("eq-si").disabled = false; toast(limite(error) || "No se pudo mover el proyecto."); return; }
      try { localStorage.setItem("forja-espacio", dest); } catch (e) {}
      location.reload();
    };
  };
  $("eq-fila").querySelectorAll("[data-mover]").forEach((b) => b.onclick = () => mover(b.dataset.mover, b.textContent.replace(/^Mover a /, "")));
  if ($("eq-mover")) $("eq-mover").onclick = () => mover(null, "");
  if ($("eq-quien")) $("eq-quien").onclick = quienLoVe;
  if ($("eq-personas")) $("eq-personas").onclick = personas;
  if ($("eq-salir")) $("eq-salir").onclick = () => {
    conf.hidden = false;
    conf.innerHTML = "<p>Dejarás de ver «" + esc(P.nombre) + "». Lo que escribiste queda en el proyecto. Para volver, tendrían que invitarte de nuevo.</p>" +
      '<div class="eq-botones"><button type="button" class="btn primario" id="eq-si">Sí, salir</button><button type="button" class="btn" id="eq-no">Cancelar</button></div>';
    $("eq-no").onclick = () => { conf.hidden = true; };
    $("eq-si").onclick = async () => {
      $("eq-si").disabled = true;
      const { error } = await sb.rpc("persona_quitar", { p: P.id, u: YO.id });
      if (error) { $("eq-si").disabled = false; toast("No se pudo salir."); return; }
      location.href = "../proyectos/";
    };
  };
  presencia();
}

      : '<div class="vacio" style="margin-top:14px">Ahora no hay convocatorias abiertas ni eventos próximos de ' + AREA[area] + '. La lista se revisa cada mañana.</div>') +
    grupo("Para cualquier emprendimiento", "Fondos y ferias generales que también te pueden servir.", generales, sug.length < 3) +
    grupo("Otras áreas", "Por si tu proyecto cruza a otro lado.", resto, false) + pronto(["alertas", "tareas"]);
  activarAvisame($("panel"));
  $("panel").onclick = async (e) => {
    const b = e.target.closest("[data-seguir]"); if (!b) return;
    const { error } = await sb.from("proyecto_oportunidades").insert({ proyecto_id: P.id, oportunidad_id: b.dataset.seguir, espacio_id: ESP });
    if (error) { toast(limite(error) || "No se pudo agregar."); return; }
    SEGS.push({ oportunidad_id: b.dataset.seguir, estado: "interesa" }); pintarTabs(); oportunidades();
  };
  $("panel").onchange = async (e) => {
    const s = e.target.closest("[data-op]"); if (!s) return;
    const op = s.dataset.op;
    if (s.value === "__quitar") {
      const { error } = await sb.from("proyecto_oportunidades").delete().eq("proyecto_id", P.id).eq("oportunidad_id", op);
      if (!error) { SEGS = SEGS.filter((x) => x.oportunidad_id !== op); pintarTabs(); oportunidades(); }
      return;
    }
    const { error } = await sb.from("proyecto_oportunidades").update({ estado: s.value }).eq("proyecto_id", P.id).eq("oportunidad_id", op);
    if (error) toast(limite(error) || "No se pudo guardar."); else SEGS.find((x) => x.oportunidad_id === op).estado = s.value;
  };
}

/* ================= VITRINA ================= */
// La vitrina se edita en su propia página (../vitrina/editar/); aquí se ve su estado y se comparte.
function vitrina() {
  $("panel").style.setProperty("--tc", tc(P.tipo));
  const url = VIT ? new URL("../vitrina/?v=" + VIT.slug, location.href).href : "";
  $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><div class="cab"><h2>Vitrina</h2>' + (VIT && VIT.publicada ? '<span class="vit-vivo">● Publicada ' + hace(VIT.publicado_en) + "</span>" : VIT ? '<span class="hint">Borrador sin publicar</span>' : "") + "</div>" +
    '<div class="vit-hero"><div><p style="margin:0 0 8px;max-width:58ch">La página pública de tu proyecto, para compartir en redes, ferias, fondos o con una editorial. Tú eliges qué mostrar: la historia, imágenes, novedades y, con Forja Más, tus pizarras para explorarlas.</p>' +
    '<p class="hint" style="margin:0 0 14px">Nada de tu Taller, tu bitácora ni tus pizarras se publica solo: la vitrina usa copias que tú revisas antes de publicar.</p>' +
    '<div class="vit-acc"><a class="btn prim" href="../vitrina/editar/?p=' + P.id + '">' + (VIT ? "Editar la vitrina" : "Crear la vitrina") + "</a>" + (VIT && VIT.publicada ? '<a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Ver la página ↗</a><button type="button" class="btn pz-libre" id="vit-copiar">Copiar enlace</button>' : "") + "</div></div>" +
    '<svg class="vit-ilus" viewBox="0 0 160 110" aria-hidden="true"><rect x="6" y="6" width="148" height="98" rx="10"/><rect class="h" x="6" y="6" width="148" height="44" rx="10"/><rect class="t" x="18" y="30" width="70" height="8" rx="3"/><rect class="l" x="18" y="60" width="56" height="5" rx="2"/><rect class="l" x="18" y="70" width="44" height="5" rx="2"/><rect class="g" x="90" y="58" width="24" height="18" rx="3"/><rect class="g" x="118" y="58" width="24" height="30" rx="3"/><rect class="g" x="90" y="80" width="24" height="12" rx="3"/></svg></div></section>';
  const c = $("vit-copiar"); if (c) c.onclick = async () => { try { await navigator.clipboard.writeText(url); toast("Enlace copiado"); } catch (e) { toast(url); } };
}

function bitacora() {
  $("panel").innerHTML = '<section class="bloque" style="margin-top:14px"><div class="cab"><h2>Bitácora</h2><span class="hint">Avances, decisiones e ideas sueltas, con fecha.</span></div>' +
    '<form class="nueva" id="f-nota"><label class="fx-sr" for="f-texto">Nueva entrada</label><textarea id="f-texto" maxlength="20000" placeholder="¿Qué avanzaste o decidiste hoy?"></textarea>' +
    '<div class="fila"><span class="hint">Ctrl + Enter para guardar</span><button class="btn prim" type="submit">Anotar</button></div></form>' +
    '<div class="hilo" id="hilo" style="--tc:' + tc(P.tipo) + '"></div></section>';
  const pintar = () => {
    $("hilo").innerHTML = NOTAS.length ? NOTAS.map((n) => '<article class="nota"><time datetime="' + n.creado_en + '">' + fecha(n.creado_en) + '</time><button class="x" data-del="' + n.id + '" aria-label="Borrar entrada">borrar</button><p>' + esc(n.texto) + "</p></article>").join("")
      : '<p class="hint" style="margin:0">Todavía no hay entradas. La primera puede ser por qué te gusta esta idea.</p>';
  };
  pintar();
  $("f-texto").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("f-nota").requestSubmit(); };
  $("f-nota").onsubmit = async (e) => {
    e.preventDefault();
    const texto = $("f-texto").value.trim(); if (!texto) return;
    const { data, error } = await sb.from("notas").insert({ espacio_id: ESP, proyecto_id: P.id, texto }).select("id,texto,creado_en").single();
    if (error) { toast(limite(error) || "No se pudo anotar."); return; }
    NOTAS.unshift(data); $("f-texto").value = ""; pintar(); pintarTabs(); tocarProyecto();
  };
  $("hilo").onclick = async (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "¿seguro?"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "borrar"; } }, 3500); return; }
    const { error } = await sb.from("notas").delete().eq("id", b.dataset.del);
    if (error) { toast("No se pudo borrar."); return; }
    NOTAS = NOTAS.filter((n) => n.id !== b.dataset.del); pintar(); pintarTabs();
  };
}

</script>
