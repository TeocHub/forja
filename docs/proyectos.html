<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Mi forja</title>
<meta name="description" content="Tus proyectos y cotizaciones en Forja.">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/forja.css">
<style>
/* Layout: inventario — barra para plantar ideas, pestañas Proyectos / Cotizaciones, fichas en mosaico */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
a{color:var(--accent)}
button,input{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,input,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;gap:20px}

.semilla{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.semilla:focus-within{border-color:var(--accent)}
.semilla .line{display:flex;gap:8px;align-items:center}
.semilla input{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:500;border:0;background:transparent;padding:6px 4px}
.semilla input::placeholder{color:var(--muted)}
.semilla input:focus-visible{outline:none}
.plantar{font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--card);border-radius:10px;padding:8px 14px;white-space:nowrap}
.plantar:disabled{opacity:.6}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px 3px 9px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tipo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tipo[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);font-weight:700}

.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-decoration:none;color:var(--fg);overflow:hidden;min-height:140px;transition:transform .15s ease,border-color .15s ease}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tc)}
.tile:hover{border-color:var(--tc);transform:translateY(-2px)}
.tile .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.tile h3{font-family:var(--f-display);font-size:18px;line-height:1.2;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.tile .res{grid-column:1;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .mini{grid-column:2;grid-row:1/4;width:56px;height:56px}
.tile .pie{grid-column:1/-1;align-self:end;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.tile .estado{font-family:var(--f-num);font-size:11px;letter-spacing:.04em}
.tile.e-archivado{opacity:.6}
.filtros{display:flex;flex-wrap:wrap;gap:6px}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px 22px;color:var(--muted);text-align:center}
.vacio b{color:var(--fg);font-family:var(--f-display);font-size:18px;display:block;margin-bottom:4px}

.cots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--tc)}
.cot:hover{border-color:var(--tc)}
.cot h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.cot .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--field);border:1px solid var(--line)}
.cot small{color:var(--muted);font-size:12px;margin-top:auto}
.skeleton{height:140px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--field),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="skeleton"></div></main>
</div>

<script type="module">
import { sb, $, esc, toast, hace, nav, espacio, conSesion } from "./js/forja.js";
import { TIPOS, ESTADOS, tc, PLANTILLA, SECCIONES } from "./js/guias.js";
import { mini, lectura, tocado, FORMATOS } from "./js/brujula.js";
nav("mi");

// Enlaces antiguos (proyectos.html#p=…) llevan a la nueva página de proyecto.
const viejo = location.hash.match(/^#p=([0-9a-f-]{36})/);
if (viejo) location.replace("proyecto.html?p=" + viejo[1]);

let ESP = null, PROYS = [], COTS = [], vista = location.hash === "#cotizaciones" ? "cot" : "proy", filtro = "", tipoNuevo = "historia";

conSesion($("app"), async () => {
  ESP = await espacio();
  if (!ESP) throw new Error("sin espacio");
  const [p, c] = await Promise.all([
    sb.from("proyectos").select("id,nombre,tipo,estado,resumen,ejes,formato,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false }),
    sb.from("cotizaciones").select("id,nombre,proyecto_id,datos,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false }),
  ]);
  if (p.error || c.error) throw p.error || c.error;
  PROYS = p.data || []; COTS = c.data || [];
  pintar();
}, "Tus proyectos son privados: solo los ves tú, desde el celular, la tablet o el computador.");

function pintar() {
  $("app").innerHTML =
    '<header><h1>Mi forja</h1><p class="lead">Todo lo que estás creando. Cada proyecto se abre en su propia página.</p></header>' +
    '<div class="fx-tabs" role="tablist"><button role="tab" id="tb-proy" aria-selected="' + (vista === "proy") + '">Proyectos<span class="n">' + PROYS.length + '</span></button>' +
    '<button role="tab" id="tb-cot" aria-selected="' + (vista === "cot") + '">Cotizaciones<span class="n">' + COTS.length + "</span></button></div>" +
    '<div id="panel" role="tabpanel"></div>';
  $("tb-proy").onclick = () => { vista = "proy"; history.replaceState(null, "", "#"); pintar(); };
  $("tb-cot").onclick = () => { vista = "cot"; history.replaceState(null, "", "#cotizaciones"); pintar(); };
  vista === "proy" ? proyectos() : cotizaciones();
}

function proyectos() {
  $("panel").innerHTML =
    '<form class="semilla" id="semilla"><div class="line"><label class="fx-sr" for="s-nombre">Nombre de la idea</label>' +
    '<input type="text" id="s-nombre" maxlength="160" placeholder="¿Qué idea traes hoy?" autocomplete="off"><button class="plantar" type="submit">Plantar</button></div>' +
    '<div class="tipos" role="group" aria-label="Tipo de proyecto">' +
    Object.entries(TIPOS).map(([k, n]) => '<button type="button" class="tipo" data-t="' + k + '" style="--tc:' + tc(k) + '" aria-pressed="' + (k === tipoNuevo) + '">' + n + "</button>").join("") +
    '</div></form><div class="filtros" id="filtros" style="margin-top:18px"></div><div id="mosaico" style="margin-top:12px"></div>';
  $("semilla").querySelectorAll(".tipo").forEach((b) => b.onclick = () => {
    tipoNuevo = b.dataset.t; $("semilla").querySelectorAll(".tipo").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("semilla").onsubmit = async (e) => {
    e.preventDefault();
    const nombre = $("s-nombre").value.trim();
    if (!nombre) { $("s-nombre").focus(); return; }
    const btn = e.target.querySelector(".plantar"); btn.disabled = true;
    const { data, error } = await sb.from("proyectos").insert({ espacio_id: ESP, nombre, tipo: tipoNuevo }).select("id").single();
    if (error) { btn.disabled = false; toast("No se pudo guardar. Revisa tu conexión."); return; }
    // Nace con las secciones que suele necesitar su tipo.
    await sb.from("secciones").insert(PLANTILLA[tipoNuevo].map((g, i) => ({ espacio_id: ESP, proyecto_id: data.id, titulo: SECCIONES[g].t, guia: g, orden: i })));
    location.href = "proyecto.html?p=" + data.id;
  };
  const dibujar = () => {
    const usados = [...new Set(PROYS.map((p) => p.tipo))];
    $("filtros").innerHTML = usados.length > 1
      ? '<button class="tipo" style="--tc:var(--fg)" data-f="" aria-pressed="' + (!filtro) + '">Todos</button>' +
        usados.map((t) => '<button class="tipo" style="--tc:' + tc(t) + '" data-f="' + t + '" aria-pressed="' + (filtro === t) + '">' + TIPOS[t] + " · " + PROYS.filter((p) => p.tipo === t).length + "</button>").join("")
      : "";
    $("filtros").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filtro = b.dataset.f; dibujar(); });
    const vis = PROYS.filter((p) => !filtro || p.tipo === filtro);
    $("mosaico").innerHTML = !PROYS.length
      ? '<div class="vacio"><b>Tu mesa está vacía</b>Escribe arriba una idea, aunque sea una frase, y elige qué tipo de proyecto es.</div>'
      : '<div class="mosaico">' + vis.map(tile).join("") + "</div>";
  };
  dibujar();
}

function tile(p) {
  const elegido = FORMATOS.find((f) => f.k === p.formato), best = tocado(p.ejes) ? lectura(p.ejes)[0] : null;
  const etiqueta = elegido ? elegido.n : best ? "≈ " + best.n : "";
  return '<a class="tile e-' + p.estado + '" href="proyecto.html?p=' + p.id + '" style="--tc:' + tc(p.tipo) + '">' +
    '<span class="k">' + esc(TIPOS[p.tipo]) + "</span><h3>" + esc(p.nombre) + "</h3>" + (p.resumen ? '<span class="res">' + esc(p.resumen) + "</span>" : "") +
    mini(p.ejes, p.formato) +
    '<span class="pie"><span class="estado">' + esc(ESTADOS[p.estado]).toUpperCase() + "</span><span>" + (etiqueta ? esc(etiqueta) + " · " : "") + hace(p.actualizado_en) + "</span></span></a>";
}

function cotizaciones() {
  if (!COTS.length) {
    $("panel").innerHTML = '<div class="vacio" style="margin-top:16px"><b>Aún no hay cotizaciones</b>Cada proyecto tiene su propia cotización en la pestaña Costos. Abre un proyecto para empezar la suya.</div>';
    return;
  }
  $("panel").innerHTML = '<p class="lead" style="margin:14px 0 12px">Una cotización por proyecto, con cada componente que hay que producir.</p><div class="cots">' + COTS.map((c) => {
    const p = PROYS.find((x) => x.id === c.proyecto_id), d = c.datos || {}, comps = d.componentes || [], nq = (d.cotizaciones || []).length;
    return '<a class="cot" href="cotizador.html?c=' + c.id + '" style="--tc:' + (p ? tc(p.tipo) : "var(--line)") + '">' +
      '<span class="k">' + (p ? esc(TIPOS[p.tipo]) : "Sin proyecto") + "</span><h3>" + esc(p ? p.nombre : c.nombre) + "</h3>" +
      (comps.length ? '<div class="chips">' + comps.slice(0, 6).map((x) => "<span>" + esc(x.nombre) + "</span>").join("") + (comps.length > 6 ? "<span>+" + (comps.length - 6) + "</span>" : "") + "</div>" : '<span class="res" style="font-size:13px;color:var(--muted)">Sin componentes todavía</span>') +
      "<small>" + nq + (nq === 1 ? " cotización de proveedor" : " cotizaciones de proveedores") + " · " + hace(c.actualizado_en) + "</small></a>";
  }).join("") + "</div>";
}
</script>
</body>
</html>
