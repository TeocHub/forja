<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Proyectos</title>
<meta name="description" content="Tus proyectos creativos con su bitácora, la brújula de formatos, cotizaciones y oportunidades.">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/forja.css">
<style>
/* Layout: mesa de trabajo — una barra para "plantar" ideas y fichas en mosaico; cada ficha abre su página con brújula de formatos, bitácora y conexiones */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:0}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:var(--fg)}
button{cursor:pointer}
:where(button,select,input,textarea,a,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
#app{display:flex;flex-direction:column;gap:22px}

/* semilla */
.semilla{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line)}
.semilla .line{display:flex;gap:8px;align-items:center}
.semilla input[type=text]{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:500;border:0;background:transparent;padding:6px 4px}
.semilla input[type=text]::placeholder{color:var(--muted)}
.semilla input[type=text]:focus-visible{outline:none}
.semilla:focus-within{border-color:var(--accent)}
.plantar{font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--card);border-radius:10px;padding:8px 14px;white-space:nowrap}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px 3px 9px;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.tipo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tc)}
.tipo[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);font-weight:700}

/* mosaico */
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-decoration:none;color:var(--fg);overflow:hidden;min-height:132px;
  transition:transform .15s ease,border-color .15s ease}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--tc)}
.tile:hover{border-color:var(--tc);transform:translateY(-2px)}
.tile .k{grid-column:1;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.tile h3{grid-column:1;font-family:var(--f-display);font-size:18px;line-height:1.2;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.tile .mini{grid-column:2;grid-row:1/4;width:56px;height:56px}
.tile .pie{grid-column:1/-1;align-self:end;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.tile .estado{font-family:var(--f-num);font-size:11px;letter-spacing:.04em}
.tile.e-archivado{opacity:.6}
.filtros{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px 22px;color:var(--muted);text-align:center}
.vacio b{color:var(--fg);font-family:var(--f-display);font-size:18px;display:block;margin-bottom:4px}

/* ficha */
.volver{font-size:14px;text-decoration:none}
.cabeza{display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--tc);padding-left:14px}
.cabeza input.nombre{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.15;border:1px solid transparent;border-radius:8px;background:transparent;padding:2px 6px;margin-left:-7px;width:100%}
.cabeza input.nombre:hover{border-color:var(--line)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrl select{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:14px}
.estados{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.estados button{white-space:nowrap;flex:none;border:0;background:transparent;padding:4px 11px;font-size:13px;color:var(--muted)}
.estados button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:700}
textarea.resumen{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;line-height:1.5}

.bloque{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bloque > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}

/* brújula */
.brujula{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:760px){.brujula{grid-template-columns:minmax(0,1fr)}}
.brujula svg{width:100%;max-width:460px;height:auto;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.radar .anillo{fill:none;stroke:var(--line)}
.radar .eje{stroke:var(--line)}
.radar .forma{fill:color-mix(in srgb,var(--accent) 18%,transparent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar.sin .forma{fill:none;stroke-dasharray:4 5;stroke:var(--muted)}
.radar .h{fill:var(--card);stroke:var(--accent);stroke-width:2.5;cursor:grab}
.radar .h:focus-visible{outline:none;stroke:var(--ember);stroke-width:4}
.radar .h.on{fill:var(--accent)}
.radar text{font-size:12.5px;fill:var(--fg);font-family:var(--f-body)}
.radar text.v{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.dial .borde{fill:var(--field);stroke:var(--line)}
.dial .petalo{fill:var(--accent-soft);stroke:none;transition:all .35s ease}
.dial .petalo.top{fill:color-mix(in srgb,var(--ember) 30%,transparent)}
.dial text{font-size:12.5px;fill:var(--muted);font-family:var(--f-body)}
.dial text.top{fill:var(--fg);font-weight:700}
.dial text.pct{font-family:var(--f-num);font-size:11px}
.dial .aguja{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
@media (prefers-reduced-motion:reduce){.dial .aguja,.dial .petalo,.tile{transition:none}}
.dial .aguja path{fill:var(--ember)}
.dial .aguja path.cola{fill:var(--muted)}
.dial .eje-c{fill:var(--card);stroke:var(--fg);stroke-width:2}
.veredicto{font-size:15px;max-width:52ch;margin:0 auto;text-align:center}
.veredicto b{font-family:var(--f-display);font-size:17px}
.elegir{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;font-size:14px}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:700}
.btn.peligro{color:var(--bad)}
.sello{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ember);color:var(--ember);border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.pregunta{min-height:2.8em;text-align:center;font-size:13px;color:var(--muted);max-width:44ch;margin:4px auto 0}

/* bitácora */
.dos{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.dos{grid-template-columns:minmax(0,1fr)}}
.nueva-nota textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px}
.nueva-nota .fila{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.hilo{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:18px}
.hilo::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.nota{position:relative}
.nota::before{content:"";position:absolute;left:-18px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--tc)}
.nota:first-child::before{background:var(--tc)}
.nota time{font-family:var(--f-num);font-size:11px;color:var(--muted);letter-spacing:.03em}
.nota p{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.nota .x{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px;margin-left:6px}
.nota .x:hover{color:var(--bad)}

/* conexiones */
.con{display:flex;flex-direction:column;gap:8px}
.lazo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--field);text-decoration:none;color:var(--fg);min-width:0}
.lazo:hover{background:var(--accent-soft)}
.lazo span:first-child{min-width:0;overflow-wrap:anywhere}
.lazo small{color:var(--muted);font-size:12px;white-space:nowrap}
.lazo select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 6px;font-size:12px}
.lazo .reloj{display:block;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.lazo .reloj.pronto{color:var(--ember)}
.add{display:flex;gap:6px;align-items:center}
.add select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:14px}
.pie-ficha{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.skeleton{height:140px;border-radius:14px;background:linear-gradient(90deg,var(--card),var(--field),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="skeleton"></div></main>
</div>

<script type="module">
import { sb, $, esc, toast, debounce, fecha, hace, nav, espacio, conSesion } from "./js/forja.js";
nav("proyectos");

const TIPOS = { historia: "Historia", videojuego: "Videojuego", juegomesa: "Juego de mesa", contenido: "Contenido RRSS", producto: "Producto", otro: "Otro" };
const ESTADOS = { semilla: "Semilla", desarrollo: "En desarrollo", pausa: "En pausa", listo: "Listo", archivado: "Archivado" };
const AREA_DE = { videojuego: "videojuego", historia: "comic", juegomesa: "juegomesa" };
const EJES = [
  { k: "agencia", n: "Decidir", q: "¿Importa que el público decida, explore o pueda perder?" },
  { k: "reglas", n: "Reglas", q: "¿Hay mecánicas o sistemas que se puedan jugar?" },
  { k: "interior", n: "Voz interna", q: "¿Pesan los pensamientos, la memoria y lo que no se dice?" },
  { k: "imagen", n: "Imagen", q: "¿El mundo, los diseños o la acción se lucen al verse?" },
  { k: "movimiento", n: "Ritmo y sonido", q: "¿Depende de música, timing o movimiento?" },
  { k: "escala", n: "Escala", q: "¿Qué tan grande es? De una escena suelta a una saga." },
];
// Perfil ideal de cada formato en los mismos ejes (0 a 4).
const FORMATOS = [
  { k: "novela", n: "Novela", p: [0, 0, 4, 1, 0, 4] },
  { k: "comic", n: "Cómic", p: [0, 0, 2, 4, 1, 3] },
  { k: "animacion", n: "Animación", p: [0, 0, 1, 4, 4, 2] },
  { k: "video", n: "Video corto", p: [0, 0, 1, 3, 3, 0] },
  { k: "videojuego", n: "Videojuego", p: [4, 3, 1, 3, 3, 3] },
  { k: "mesa", n: "Juego de mesa", p: [3, 4, 0, 2, 0, 1] },
];
const tc = (t) => "var(--t-" + (TIPOS[t] ? t : "otro") + ")";
const tocado = (ejes) => ejes && EJES.some((e) => e.k in ejes);
const vals = (ejes) => EJES.map((e) => (ejes && e.k in ejes ? +ejes[e.k] : 2));
function lectura(ejes) {
  const v = vals(ejes);
  return FORMATOS.map((f) => ({ ...f, s: 1 - f.p.reduce((a, p, i) => a + Math.abs(p - v[i]), 0) / 24 })).sort((a, b) => b.s - a.s);
}
const ang = (i, n = 6) => (-90 + (360 / n) * i) * Math.PI / 180;
const pt = (cx, cy, r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
const pct = (s) => Math.round(s * 100) + "%";

let ESP = null, OPS = null;

conSesion($("app"), async () => {
  ESP = await espacio();
  if (!ESP) throw new Error("sin espacio");
  addEventListener("hashchange", ruta);
  ruta();
}, "Tus proyectos son privados: solo los ves tú, desde el celular, la tablet o el computador.");

function ruta() {
  const m = location.hash.match(/^#p=([0-9a-f-]{36})/);
  if (m) ficha(m[1]); else mesa();
  scrollTo(0, 0);
}

/* ================= MESA ================= */
let filtro = "", tipoNuevo = "historia";
async function mesa() {
  document.title = "Forja · Proyectos";
  const app = $("app");
  app.innerHTML =
    '<header><h1>Proyectos</h1><p class="lead">Planta una idea y hazla crecer: bitácora, el formato donde mejor se cuenta, lo que cuesta producirla y las fechas que le sirven.</p></header>' +
    '<form class="semilla" id="semilla"><div class="line"><label class="fx-sr" for="s-nombre">Nombre de la idea</label>' +
    '<input type="text" id="s-nombre" maxlength="160" placeholder="¿Qué idea traes hoy?" autocomplete="off"><button class="plantar" type="submit">Plantar</button></div>' +
    '<div class="tipos" role="group" aria-label="Tipo de proyecto">' +
    Object.entries(TIPOS).map(([k, n]) => '<button type="button" class="tipo" data-t="' + k + '" style="--tc:' + tc(k) + '" aria-pressed="' + (k === tipoNuevo) + '">' + n + "</button>").join("") +
    "</div></form>" +
    '<div class="filtros" id="filtros"></div><div id="mosaico"><div class="skeleton"></div></div>';

  $("semilla").querySelectorAll(".tipo").forEach((b) => b.onclick = () => {
    tipoNuevo = b.dataset.t;
    $("semilla").querySelectorAll(".tipo").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  $("semilla").onsubmit = async (e) => {
    e.preventDefault();
    const nombre = $("s-nombre").value.trim();
    if (!nombre) { $("s-nombre").focus(); return; }
    const { data, error } = await sb.from("proyectos").insert({ espacio_id: ESP, nombre, tipo: tipoNuevo }).select("id").single();
    if (error) { toast("No se pudo guardar. Revisa tu conexión."); return; }
    location.hash = "p=" + data.id;
  };

  const { data, error } = await sb.from("proyectos").select("id,nombre,tipo,estado,ejes,formato,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false });
  if (error) { $("mosaico").innerHTML = '<div class="fx-empty">No se pudieron cargar tus proyectos.</div>'; return; }
  const todos = data || [];
  const pintar = () => {
    const usados = [...new Set(todos.map((p) => p.tipo))];
    $("filtros").innerHTML = usados.length > 1
      ? '<button class="tipo" style="--tc:var(--fg)" data-f="" aria-pressed="' + (!filtro) + '">Todos · ' + todos.length + "</button>" +
        usados.map((t) => '<button class="tipo" style="--tc:' + tc(t) + '" data-f="' + t + '" aria-pressed="' + (filtro === t) + '">' + TIPOS[t] + " · " + todos.filter((p) => p.tipo === t).length + "</button>").join("")
      : "";
    $("filtros").querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filtro = b.dataset.f; pintar(); });
    const vis = todos.filter((p) => !filtro || p.tipo === filtro);
    $("mosaico").innerHTML = !todos.length
      ? '<div class="vacio"><b>Tu mesa está vacía</b>Escribe arriba una idea, aunque sea una frase. Después le vas agregando todo lo demás.</div>'
      : '<div class="mosaico">' + vis.map(tile).join("") + "</div>";
  };
  pintar();
}

function tile(p) {
  const best = tocado(p.ejes) ? lectura(p.ejes)[0] : null;
  const elegido = FORMATOS.find((f) => f.k === p.formato);
  const etiqueta = elegido ? elegido.n : best ? "≈ " + best.n : "Sin brújula";
  return '<a class="tile e-' + p.estado + '" href="#p=' + p.id + '" style="--tc:' + tc(p.tipo) + '">' +
    '<span class="k">' + esc(TIPOS[p.tipo]) + "</span><h3>" + esc(p.nombre) + "</h3>" + mini(p.ejes, elegido) +
    '<span class="pie"><span class="estado">' + esc(ESTADOS[p.estado]).toUpperCase() + "</span><span>" + esc(etiqueta) + " · " + hace(p.actualizado_en) + "</span></span></a>";
}
function mini(ejes, elegido) {
  const c = 28, r = 22;
  let s = '<svg class="mini" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="1.5"' + (tocado(ejes) ? "" : ' stroke-dasharray="2 3"') + "/>";
  FORMATOS.forEach((f, i) => { const [x, y] = pt(c, c, r, ang(i)); s += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2" fill="var(--muted)"/>'; });
  if (tocado(ejes) || elegido) {
    const k = elegido ? elegido.k : lectura(ejes)[0].k, i = FORMATOS.findIndex((f) => f.k === k);
    const a = ang(i), [x, y] = pt(c, c, r - 4, a), [bx, by] = pt(c, c, 4, a + Math.PI / 2), [cx2, cy2] = pt(c, c, 4, a - Math.PI / 2);
    s += '<path d="M' + x.toFixed(1) + " " + y.toFixed(1) + "L" + bx.toFixed(1) + " " + by.toFixed(1) + "L" + cx2.toFixed(1) + " " + cy2.toFixed(1) + 'Z" fill="var(--ember)"/>';
  }
  return s + '<circle cx="28" cy="28" r="2.5" fill="var(--fg)"/></svg>';
}

/* ================= FICHA ================= */
async function ficha(id) {
  const app = $("app");
  app.innerHTML = '<a class="volver" href="#">← Proyectos</a><div class="skeleton"></div>';
  const [pr, no, co, po] = await Promise.all([
    sb.from("proyectos").select("*").eq("id", id).maybeSingle(),
    sb.from("notas").select("id,texto,creado_en").eq("proyecto_id", id).order("creado_en", { ascending: false }),
    sb.from("cotizaciones").select("id,nombre,actualizado_en").eq("proyecto_id", id).order("actualizado_en", { ascending: false }),
    sb.from("proyecto_oportunidades").select("oportunidad_id,estado").eq("proyecto_id", id),
  ]);
  const P = pr.data;
  if (!P) { app.innerHTML = '<a class="volver" href="#">← Proyectos</a><div class="fx-empty">Este proyecto no existe o no es tuyo.</div>'; return; }
  let notas = no.data || [], cots = co.data || [], segs = po.data || [];
  document.title = "Forja · " + P.nombre;

  const guardar = async (cambios, aviso) => {
    Object.assign(P, cambios);
    const { error } = await sb.from("proyectos").update(cambios).eq("id", P.id);
    if (error) toast("No se pudo guardar el cambio."); else if (aviso) toast(aviso);
  };

  app.innerHTML =
    '<a class="volver" href="#">← Proyectos</a>' +
    '<section class="cabeza" id="cabeza" style="--tc:' + tc(P.tipo) + '">' +
    '<label class="fx-sr" for="f-nombre">Nombre</label><input class="nombre" id="f-nombre" maxlength="160" value="' + esc(P.nombre) + '">' +
    '<div class="ctrl"><label class="fx-sr" for="f-tipo">Tipo</label><select id="f-tipo">' + Object.entries(TIPOS).map(([k, n]) => '<option value="' + k + '"' + (k === P.tipo ? " selected" : "") + ">" + n + "</option>").join("") + "</select>" +
    '<div class="estados" role="group" aria-label="Estado">' + Object.entries(ESTADOS).map(([k, n]) => '<button type="button" data-e="' + k + '" aria-pressed="' + (k === P.estado) + '">' + n + "</button>").join("") + "</div></div>" +
    '<label class="fx-sr" for="f-resumen">Resumen</label><textarea class="resumen" id="f-resumen" maxlength="4000" placeholder="¿De qué se trata? Unas líneas bastan; se pueden reescribir cuando la idea cambie.">' + esc(P.resumen || "") + "</textarea></section>" +

    '<section class="bloque" aria-labelledby="h-br"><header><h2 id="h-br">Brújula de formatos</h2><span class="hint">Arrastra cada punto del radar hacia afuera según cuánto pesa en esta idea.</span></header>' +
    '<div class="brujula"><div><svg class="radar" id="radar" viewBox="0 0 440 330" role="group" aria-label="Radar de la idea"></svg><p class="pregunta" id="pregunta">Toca un eje para ver su pregunta.</p></div>' +
    '<div><svg class="dial" id="dial" viewBox="0 0 440 330" aria-hidden="true"></svg><p class="veredicto" id="veredicto" aria-live="polite"></p><div class="elegir" id="elegir"></div></div></div></section>' +

    '<div class="dos"><section class="bloque" aria-labelledby="h-bi"><header><h2 id="h-bi">Bitácora</h2><span class="hint">Ideas, avances y decisiones, en orden.</span></header>' +
    '<form class="nueva-nota" id="f-nota"><label class="fx-sr" for="f-texto">Nueva entrada</label><textarea id="f-texto" maxlength="20000" placeholder="¿Qué se te ocurrió? Un personaje, una mecánica, una escena…"></textarea>' +
    '<div class="fila"><span class="hint">Ctrl + Enter para guardar</span><button class="btn prim" type="submit">Anotar</button></div></form>' +
    '<div class="hilo" id="hilo" style="--tc:' + tc(P.tipo) + '"></div></section>' +

    '<div style="display:flex;flex-direction:column;gap:18px;min-width:0">' +
    '<section class="bloque" aria-labelledby="h-co"><header><h2 id="h-co">Costos</h2></header><div class="con" id="cots"></div>' +
    '<button class="btn" type="button" id="b-cot">+ Nueva cotización para este proyecto</button></section>' +
    '<section class="bloque" aria-labelledby="h-op"><header><h2 id="h-op">Oportunidades</h2><a class="hint" href="./">Ver todas</a></header><div class="con" id="ops"></div>' +
    '<div class="add"><label class="fx-sr" for="f-op">Seguir una oportunidad</label><select id="f-op"><option value="">Cargando…</option></select><button class="btn" type="button" id="b-op">Seguir</button></div></section>' +
    "</div></div>" +

    '<div class="pie-ficha"><button class="btn" type="button" id="b-claude">Copiar contexto para Claude</button><span id="zona-borrar"><button class="btn peligro" type="button" id="b-borrar">Borrar proyecto</button></span></div>';

  /* cabecera */
  $("f-nombre").onchange = (e) => { const v = e.target.value.trim(); if (!v) { e.target.value = P.nombre; return; } guardar({ nombre: v }); document.title = "Forja · " + v; };
  $("f-tipo").onchange = (e) => { guardar({ tipo: e.target.value }); ["cabeza", "hilo"].forEach((i) => $(i).style.setProperty("--tc", tc(e.target.value))); llenarOps(); };
  document.querySelectorAll("[data-e]").forEach((b) => b.onclick = () => {
    document.querySelectorAll("[data-e]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); guardar({ estado: b.dataset.e });
  });
  $("f-resumen").onchange = (e) => guardar({ resumen: e.target.value.trim() || null });

  /* brújula */
  const guardarEjes = debounce(() => guardar({ ejes: P.ejes }), 700);
  dibujarRadar(P, () => { dibujarDial(P, guardar); guardarEjes(); });
  dibujarDial(P, guardar);

  /* bitácora */
  const pintarNotas = () => {
    $("hilo").innerHTML = notas.length ? notas.map((n) => '<article class="nota"><time datetime="' + n.creado_en + '">' + fecha(n.creado_en) + '</time><button class="x" data-del="' + n.id + '" aria-label="Borrar entrada">borrar</button><p>' + esc(n.texto) + "</p></article>").join("")
      : '<p class="hint" style="margin:0">Todavía no hay entradas. La primera puede ser por qué te gusta esta idea.</p>';
  };
  pintarNotas();
  $("f-texto").onkeydown = (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("f-nota").requestSubmit(); };
  $("f-nota").onsubmit = async (e) => {
    e.preventDefault();
    const texto = $("f-texto").value.trim(); if (!texto) return;
    const { data, error } = await sb.from("notas").insert({ espacio_id: ESP, proyecto_id: P.id, texto }).select("id,texto,creado_en").single();
    if (error) { toast("No se pudo anotar."); return; }
    notas.unshift(data); $("f-texto").value = ""; pintarNotas();
    sb.from("proyectos").update({ nombre: P.nombre }).eq("id", P.id); // marca el proyecto como recién movido
  };
  $("hilo").onclick = async (e) => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    if (b.dataset.armed !== "1") { b.dataset.armed = "1"; b.textContent = "¿seguro?"; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ""; b.textContent = "borrar"; } }, 3500); return; }
    const { error } = await sb.from("notas").delete().eq("id", b.dataset.del);
    if (error) { toast("No se pudo borrar."); return; }
    notas = notas.filter((n) => n.id !== b.dataset.del); pintarNotas();
  };

  /* costos */
  $("cots").innerHTML = cots.length ? cots.map((c) => '<a class="lazo" href="cotizador.html?c=' + c.id + '"><span>' + esc(c.nombre) + "</span><small>" + hace(c.actualizado_en) + "</small></a>").join("")
    : '<p class="hint" style="margin:0">Cuando haya algo que fabricar o imprimir, cotízalo aquí y queda ligado al proyecto.</p>';
  $("b-cot").onclick = async () => {
    const { data, error } = await sb.from("cotizaciones").insert({ espacio_id: ESP, proyecto_id: P.id, nombre: P.nombre, datos: {} }).select("id").single();
    if (error) { toast("No se pudo crear la cotización."); return; }
    location.href = "cotizador.html?c=" + data.id;
  };

  /* oportunidades */
  if (!OPS) {
    const { data } = await sb.from("oportunidades").select("id,nombre,tipo,areas,postul_inicio,postul_fin,evento_inicio,evento_fin,fechas_estimadas").order("nombre");
    OPS = data || [];
  }
  const ESTOP = { interesa: "Me interesa", postulando: "Postulando", postulado: "Postulé", aceptado: "Aceptado", descartado: "Descartado" };
  const pintarOps = () => {
    $("ops").innerHTML = segs.length ? segs.map((s) => {
      const o = OPS.find((x) => x.id === s.oportunidad_id) || { nombre: s.oportunidad_id };
      const r = reloj(o);
      return '<div class="lazo"><span>' + esc(o.nombre) + '<span class="reloj' + (r.pronto ? " pronto" : "") + '">' + esc(r.t) + "</span></span>" +
        '<label class="fx-sr" for="st-' + s.oportunidad_id + '">Estado</label><select id="st-' + s.oportunidad_id + '" data-op="' + s.oportunidad_id + '">' +
        Object.entries(ESTOP).map(([k, n]) => '<option value="' + k + '"' + (k === s.estado ? " selected" : "") + ">" + n + "</option>").join("") + '<option value="__quitar">Dejar de seguir</option></select></div>';
    }).join("") : '<p class="hint" style="margin:0">Ferias o fondos donde este proyecto podría mostrarse o financiarse.</p>';
    llenarOps();
  };
  function llenarOps() {
    const area = AREA_DE[$("f-tipo").value];
    const libres = OPS.filter((o) => !segs.some((s) => s.oportunidad_id === o.id) && !reloj(o).fin);
    const prim = area ? libres.filter((o) => (o.areas || []).includes(area)) : [];
    const resto = libres.filter((o) => !prim.includes(o));
    const opt = (o) => '<option value="' + o.id + '">' + esc(o.nombre) + "</option>";
    $("f-op").innerHTML = '<option value="">Elegir una oportunidad…</option>' + (prim.length ? '<optgroup label="Para este tipo de proyecto">' + prim.map(opt).join("") + '</optgroup><optgroup label="Otras">' : "") + resto.map(opt).join("") + (prim.length ? "</optgroup>" : "");
  }
  pintarOps();
  $("b-op").onclick = async () => {
    const op = $("f-op").value; if (!op) return;
    const { error } = await sb.from("proyecto_oportunidades").insert({ proyecto_id: P.id, oportunidad_id: op, espacio_id: ESP });
    if (error) { toast("No se pudo agregar."); return; }
    segs.push({ oportunidad_id: op, estado: "interesa" }); pintarOps();
  };
  $("ops").onchange = async (e) => {
    const s = e.target.closest("[data-op]"); if (!s) return;
    const op = s.dataset.op;
    if (s.value === "__quitar") {
      const { error } = await sb.from("proyecto_oportunidades").delete().eq("proyecto_id", P.id).eq("oportunidad_id", op);
      if (!error) { segs = segs.filter((x) => x.oportunidad_id !== op); pintarOps(); }
      return;
    }
    const { error } = await sb.from("proyecto_oportunidades").update({ estado: s.value }).eq("proyecto_id", P.id).eq("oportunidad_id", op);
    if (error) toast("No se pudo guardar."); else segs.find((x) => x.oportunidad_id === op).estado = s.value;
  };

  /* contexto para Claude */
  $("b-claude").onclick = () => {
    const l = tocado(P.ejes) ? lectura(P.ejes) : null, v = vals(P.ejes);
    const txt = [
      "Proyecto: " + P.nombre + " (" + TIPOS[P.tipo] + ", " + ESTADOS[P.estado].toLowerCase() + ")",
      P.resumen ? "Resumen: " + P.resumen : "",
      l ? "Brújula (0 a 4): " + EJES.map((e, i) => e.n + " " + v[i]).join(", ") + ". Mejores formatos: " + l.slice(0, 3).map((f) => f.n + " " + pct(f.s)).join(", ") + "." : "",
      P.formato ? "Formato elegido: " + FORMATOS.find((f) => f.k === P.formato).n : "",
      notas.length ? "Bitácora, de lo más antiguo a lo más reciente:\n" + notas.slice().reverse().map((n) => "- " + fecha(n.creado_en) + ": " + n.texto).join("\n") : "",
      segs.length ? "Oportunidades que sigue: " + segs.map((s) => (OPS.find((o) => o.id === s.oportunidad_id) || {}).nombre + " (" + ESTOP[s.estado].toLowerCase() + ")").join(", ") : "",
    ].filter(Boolean).join("\n") + "\n\nAyúdame a seguir desarrollando este proyecto.";
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Copiado. Pégalo en tu chat con Claude.")).catch(() => prompt("Copia el texto:", txt));
  };

  /* borrar */
  $("b-borrar").onclick = () => {
    $("zona-borrar").innerHTML = '<span class="hint">Se borran también su bitácora y seguimientos. Las cotizaciones quedan sueltas.</span> <button class="btn peligro" id="b-si">Sí, borrar</button> <button class="btn" id="b-no">Cancelar</button>';
    $("b-no").onclick = () => ficha(P.id);
    $("b-si").onclick = async () => {
      const { error } = await sb.from("proyectos").delete().eq("id", P.id);
      if (error) { toast("No se pudo borrar."); return; }
      toast("Proyecto borrado"); location.hash = "";
    };
  };
}

function reloj(o) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const d = (s) => { if (!s) return null; const [y, m, dd] = s.split("-"); return Math.round((new Date(+y, m - 1, +dd) - hoy) / 864e5); };
  const pi = d(o.postul_inicio), pf = d(o.postul_fin), ei = d(o.evento_inicio), ef = d(o.evento_fin) ?? ei, est = o.fechas_estimadas ? "≈ " : "";
  if (pi != null && pi > 0) return { t: est + "postulación abre en " + pi + " días" };
  if (pf != null && pf >= 0) return { t: pf === 0 ? "postulación cierra hoy" : "postulación cierra en " + pf + " días", pronto: pf <= 14 };
  if (ei != null && ei > 0) return { t: est + "evento en " + ei + " días", pronto: ei <= 14 };
  if (ef != null && ef >= 0) return { t: "evento en curso" };
  return { t: "terminado", fin: pf != null || ef != null };
}

/* --- radar interactivo --- */
function dibujarRadar(P, alCambiar) {
  const svg = $("radar"), C = [220, 165], R = 112, r0 = 10;
  const rad = (v) => r0 + (v / 4) * (R - r0);
  const pintar = () => {
    const v = vals(P.ejes), sin = !tocado(P.ejes);
    svg.classList.toggle("sin", sin);
    let s = "";
    for (let k = 1; k <= 4; k++) s += '<polygon class="anillo" points="' + EJES.map((_, i) => pt(...C, rad(k), ang(i)).map((n) => n.toFixed(1)).join(",")).join(" ") + '"/>';
    EJES.forEach((e, i) => { const [x, y] = pt(...C, R, ang(i)); s += '<line class="eje" x1="' + C[0] + '" y1="' + C[1] + '" x2="' + x.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>'; });
    s += '<polygon class="forma" points="' + v.map((x, i) => pt(...C, rad(x), ang(i)).map((n) => n.toFixed(1)).join(",")).join(" ") + '"/>';
    EJES.forEach((e, i) => {
      const a = ang(i), [lx, ly] = pt(...C, R + 24, a), anchor = Math.abs(Math.cos(a)) < .2 ? "middle" : Math.cos(a) > 0 ? "start" : "end";
      const dy = Math.sin(a) < -.5 ? -4 : Math.sin(a) > .5 ? 12 : 4;
      s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" text-anchor="' + anchor + '">' + e.n + (sin ? "" : ' <tspan class="v">' + v[i] + "</tspan>") + "</text>";
    });
    v.forEach((x, i) => {
      const [hx, hy] = pt(...C, rad(x), ang(i));
      s += '<circle class="h' + (P.ejes && EJES[i].k in P.ejes ? " on" : "") + '" data-i="' + i + '" cx="' + hx.toFixed(1) + '" cy="' + hy.toFixed(1) + '" r="9" tabindex="0" role="slider" aria-label="' + EJES[i].n + ": " + EJES[i].q + '" aria-valuemin="0" aria-valuemax="4" aria-valuenow="' + x + '"/>';
    });
    svg.innerHTML = s;
  };
  const fijar = (i, v) => {
    v = Math.max(0, Math.min(4, v));
    if (!tocado(P.ejes)) P.ejes = Object.fromEntries(EJES.map((e) => [e.k, 2]));
    if (P.ejes[EJES[i].k] === v) return;
    P.ejes = { ...P.ejes, [EJES[i].k]: v };
    pintar(); alCambiar();
  };
  const local = (ev) => { const b = svg.getBoundingClientRect(), k = 440 / b.width; return [(ev.clientX - b.left) * k - C[0], (ev.clientY - b.top) * k - C[1]]; };
  let arrastre = null;
  svg.onpointerdown = (ev) => {
    const [dx, dy] = local(ev), d = Math.hypot(dx, dy);
    if (d > R + 40) return;
    let a = Math.atan2(dy, dx), best = 0, bd = 9;
    EJES.forEach((_, i) => { const diff = Math.abs(Math.atan2(Math.sin(a - ang(i)), Math.cos(a - ang(i)))); if (diff < bd) { bd = diff; best = i; } });
    arrastre = best; svg.setPointerCapture(ev.pointerId);
    $("pregunta").textContent = EJES[best].q;
    mover(ev); ev.preventDefault();
  };
  const mover = (ev) => {
    if (arrastre == null) return;
    const [dx, dy] = local(ev), proy = dx * Math.cos(ang(arrastre)) + dy * Math.sin(ang(arrastre));
    fijar(arrastre, Math.round(((proy - r0) / (R - r0)) * 4));
  };
  svg.onpointermove = mover;
  svg.onpointerup = svg.onpointercancel = () => { arrastre = null; };
  svg.onkeydown = (ev) => {
    const h = ev.target.closest(".h"); if (!h) return;
    const i = +h.dataset.i, v = vals(P.ejes)[i], m = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[ev.key];
    if (m == null) return; ev.preventDefault();
    fijar(i, v + m); svg.querySelector('[data-i="' + i + '"]').focus();
  };
  svg.addEventListener("focusin", (ev) => { const h = ev.target.closest(".h"); if (h) $("pregunta").textContent = EJES[+h.dataset.i].q; });
  pintar();
}

/* --- brújula: los formatos alrededor, pétalos según encaje y la aguja al mejor --- */
function dibujarDial(P, guardar) {
  const svg = $("dial"), C = [220, 165], R = 112;
  const sin = !tocado(P.ejes), l = lectura(P.ejes), max = l[0].s, min = l[l.length - 1].s;
  const by = Object.fromEntries(l.map((f) => [f.k, f]));
  let s = '<circle class="borde" cx="' + C[0] + '" cy="' + C[1] + '" r="' + R + '"/>';
  FORMATOS.forEach((f, i) => {
    const a = ang(i), sc = by[f.k].s, n = sin ? .15 : .2 + .8 * ((sc - min) / ((max - min) || 1)), len = R * .92 * n, w = .34;
    const [x1, y1] = pt(...C, len, a), [xa, ya] = pt(...C, len * .55, a - w), [xb, yb] = pt(...C, len * .55, a + w);
    const top = !sin && f.k === l[0].k;
    s += '<path class="petalo' + (top ? " top" : "") + '" d="M' + C[0] + " " + C[1] + " Q" + xa.toFixed(1) + " " + ya.toFixed(1) + " " + x1.toFixed(1) + " " + y1.toFixed(1) + " Q" + xb.toFixed(1) + " " + yb.toFixed(1) + " " + C[0] + " " + C[1] + 'Z"/>';
    const [lx, ly] = pt(...C, R + 20, a), anchor = Math.abs(Math.cos(a)) < .2 ? "middle" : Math.cos(a) > 0 ? "start" : "end";
    const dy = Math.sin(a) < -.5 ? -10 : Math.sin(a) > .5 ? 8 : -2;
    s += '<text x="' + lx.toFixed(1) + '" y="' + (ly + dy).toFixed(1) + '" text-anchor="' + anchor + '"' + (top ? ' class="top"' : "") + ">" + f.n + "</text>";
    if (!sin) s += '<text class="pct' + (top ? " top" : "") + '" x="' + lx.toFixed(1) + '" y="' + (ly + dy + 14).toFixed(1) + '" text-anchor="' + anchor + '">' + pct(sc) + "</text>";
  });
  const gi = FORMATOS.findIndex((f) => f.k === l[0].k), deg = sin ? -90 + 25 : -90 + 60 * gi;
  s += '<g class="aguja" style="transform-origin:' + C[0] + "px " + C[1] + "px;transform:rotate(" + (deg + 90) + 'deg)">' +
    '<path d="M' + C[0] + " " + (C[1] - R + 16) + " L" + (C[0] + 7) + " " + C[1] + " L" + (C[0] - 7) + " " + C[1] + 'Z"/>' +
    '<path class="cola" d="M' + C[0] + " " + (C[1] + 36) + " L" + (C[0] + 7) + " " + C[1] + " L" + (C[0] - 7) + " " + C[1] + 'Z"/></g>' +
    '<circle class="eje-c" cx="' + C[0] + '" cy="' + C[1] + '" r="6"/>';
  // conserva la aguja anterior para que gire en vez de saltar
  const prev = svg.querySelector(".aguja");
  svg.innerHTML = s;
  if (prev) { const g = svg.querySelector(".aguja"), fin = g.style.transform; g.style.transform = prev.style.transform; requestAnimationFrame(() => requestAnimationFrame(() => { g.style.transform = fin; })); }

  const ver = $("veredicto"), el = $("elegir"), elegido = FORMATOS.find((f) => f.k === P.formato);
  if (sin) {
    ver.innerHTML = "Mueve los puntos del radar y la aguja apuntará al formato donde esta idea se cuenta mejor.";
  } else {
    const [a, b] = l, cerca = a.s - b.s < .06;
    ver.innerHTML = "Brilla más como <b>" + a.n + "</b> (" + pct(a.s) + ")" + (cerca ? ", casi empatada con <b>" + b.n + "</b> (" + pct(b.s) + "): podría ser una adaptación natural." : ". Le sigue " + b.n.toLowerCase() + " (" + pct(b.s) + ").");
  }
  el.innerHTML = (elegido ? '<span class="sello">Formato elegido: ' + elegido.n + "</span>" : "") +
    (!sin && (!elegido || elegido.k !== l[0].k) ? '<button class="btn" type="button" id="b-elegir">Quedarme con ' + l[0].n.toLowerCase() + "</button>" : "") +
    (elegido ? '<button class="btn" type="button" id="b-soltar">Quitar</button>' : "");
  if ($("b-elegir")) $("b-elegir").onclick = () => { guardar({ formato: l[0].k }, "Formato elegido"); dibujarDial(P, guardar); };
  if ($("b-soltar")) $("b-soltar").onclick = () => { guardar({ formato: null }); dibujarDial(P, guardar); };
}
