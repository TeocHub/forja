<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Vitrina</title>
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap">
<link rel="stylesheet" href="../../css/forja.css">
<style>
/* Layout: editor de vitrina — panel de edición a la izquierda (secciones plegables) y la vista previa real a la derecha; en el celular se alternan */
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:where(button,a,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vol{font-size:14px;text-decoration:none}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:8px 0 16px}
.cab h1{font-family:var(--f-display);font-size:clamp(24px,4vw,32px);line-height:1.1;margin:0}
.cab h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:14px;color:var(--muted)}
.estado{display:inline-flex;align-items:center;gap:7px;font-size:13px;border-radius:999px;padding:4px 11px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.estado i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.estado.vivo{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line))} .estado.vivo i{background:var(--good)}
.estado.cambios{color:var(--e-pausa);border-color:color-mix(in srgb,var(--e-pausa) 45%,var(--line))} .estado.cambios i{background:var(--e-pausa)}
.acc{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.guardado{font-size:12px;color:var(--muted)}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.prim{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.btn.chico{font-size:13px;padding:4px 10px;border-radius:8px}
.btn.peligro{color:var(--bad)}
.modo{display:none}
.grid{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:18px;align-items:start}
.panel{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);overflow:auto;padding:2px 6px 40px 2px;position:sticky;top:12px;scrollbar-width:thin}
.previa{position:sticky;top:12px;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);display:flex;flex-direction:column}
.previa-barra{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--field)}
.previa-barra span{font-family:var(--f-num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.previa-barra i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
#previa{flex:1;overflow:auto;container-type:inline-size}
#previa .vt-hero{min-height:440px}
#previa .vt-generativa span{font-size:min(50cqw,420px)}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .modo{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .modo button{font:inherit;border:0;background:var(--card);color:var(--fg);padding:7px 16px;cursor:pointer}
  .modo button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
  .panel{max-height:none;position:static;overflow:visible;padding:0}
  .previa{position:static;height:auto;min-height:0}
  #previa{overflow:visible}
  body[data-vista=previa] .panel,body[data-vista=editar] .previa{display:none}
}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px}
.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:16px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg)}
.sec>summary small{font-family:var(--f-num);font-weight:500;font-size:12px;color:var(--muted)}
.sec>summary .tag{font-family:var(--f-body);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 45%,var(--line));border-radius:999px;padding:1px 7px;background:var(--ember-soft)}
.cuerpo{padding:2px 14px 14px;display:flex;flex-direction:column;gap:12px}
.ayuda{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.c{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.c input:not([type=range]):not([type=checkbox]):not([type=color]),.c textarea,.c select{font:inherit;font-size:14px;color:var(--fg);border:1px solid var(--line);background:var(--field);border-radius:8px;padding:7px 9px;width:100%}
.c textarea{resize:vertical;min-height:110px;line-height:1.5}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tonos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tonos button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;overflow:hidden;background:var(--card);color:var(--fg);text-align:left}
.tonos button span{display:block;height:38px}
.tonos button b{display:block;padding:5px 8px}
.tonos button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.acentos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acentos button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.acentos button[aria-pressed=true]{box-shadow:0 0 0 2px var(--fg)}
.acentos label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.acentos input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.mini-imgs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.mini-imgs button{flex:none;width:76px;height:52px;border-radius:8px;border:1px solid var(--line);padding:0;overflow:hidden;cursor:pointer;background:var(--field)}
.mini-imgs button[aria-pressed=true]{box-shadow:0 0 0 2px var(--accent)}
.mini-imgs img{width:100%;height:100%;object-fit:cover;display:block}
.bloque{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.bloque-cab{display:flex;align-items:center;gap:6px}
.bloque-cab input{flex:1;min-width:0;font:inherit;font-family:var(--f-display);font-weight:700;font-size:15px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--fg);padding:4px 6px}
.bloque-cab input:hover,.bloque-cab input:focus{border-color:var(--line);background:var(--field)}
.ico{font:inherit;width:28px;height:28px;flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center;font-size:13px;padding:0}
.ico:hover:not(:disabled){color:var(--fg);border-color:var(--accent)}
.ico:disabled{opacity:.35;cursor:default}
.ico.x:hover{color:var(--bad);border-color:var(--bad)}
.bloque textarea{font:inherit;font-size:14px;color:var(--fg);border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;min-height:120px;line-height:1.55}
.origen{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.origen button{font:inherit;font-size:11.5px;border:0;background:none;color:var(--accent);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pieza{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px 10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.pieza .th{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--field);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.pieza .th img{width:100%;height:100%;object-fit:cover}
.pieza .campos{display:flex;flex-direction:column;gap:5px;min-width:0}
.pieza .campos input{font:inherit;font-size:13px;color:var(--fg);border:1px solid var(--line);background:var(--field);border-radius:7px;padding:5px 7px;width:100%}
.pieza .botones{display:flex;flex-direction:column;gap:4px}
.selector{border:1px solid var(--line);border-radius:12px;background:var(--bg);max-height:300px;overflow:auto;display:flex;flex-direction:column}
.selector label,.selector button.op{font:inherit;display:flex;gap:9px;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;text-align:left;font-size:14px}
.selector label:last-child,.selector button.op:last-child{border-bottom:0}
.selector label:hover,.selector button.op:hover{background:var(--field)}
.selector small{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
.selector .ya{color:var(--good)}
.selector .vacio{padding:12px;font-size:13px;color:var(--muted)}
.selector img{width:36px;height:28px;object-fit:cover;border-radius:5px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:2px 9px;cursor:pointer}
.chips button[aria-pressed=false]{text-decoration:line-through;color:var(--muted);background:var(--field)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.mas-bloq{border:1.5px dashed var(--ember);background:var(--ember-soft);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.aviso{border-radius:12px;padding:10px 12px;font-size:13.5px;background:color-mix(in srgb,var(--e-pausa) 10%,var(--card));border:1px solid color-mix(in srgb,var(--e-pausa) 40%,var(--line))}
.privado{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--field);border-radius:12px;padding:10px 12px;line-height:1.45}
.privado svg{flex:none;margin-top:2px;color:var(--good)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--fg);padding:0;width:min(520px,94vw);box-shadow:0 24px 60px rgba(10,14,30,.28)}
dialog::backdrop{background:rgba(10,12,20,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-family:var(--f-display);font-size:22px;margin:0}
.dlg p{margin:0}
.resumen{display:flex;flex-wrap:wrap;gap:6px}
.resumen span{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--field)}
.dlg-pie{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.enlace-pub{display:flex;gap:6px}
.enlace-pub input{flex:1;min-width:0;font:inherit;font-family:var(--f-num);font-size:13px;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:7px 9px}
.qr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qr-img{width:148px;height:148px;background:#fff;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;padding:8px;color:#555;font-size:12px;text-align:center}
.qr-img svg{width:100%;height:100%}
.dir{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--field);overflow:hidden}
.dir span{font-family:var(--f-num);font-size:12px;color:var(--muted);padding:0 2px 0 9px;white-space:nowrap}
.dir input{flex:1;min-width:0;font:inherit;font-family:var(--f-num);font-size:13px;border:0;background:transparent;color:var(--fg);padding:7px 9px 7px 0}
.susp{border:1.5px solid var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--card));border-radius:14px;padding:14px 16px;margin:0 0 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.susp b{font-family:var(--f-display);font-size:18px;color:var(--bad)}
.susp p{margin:0}
.susp blockquote{margin:0;padding:8px 12px;border-left:3px solid var(--bad);background:var(--card);border-radius:0 8px 8px 0;white-space:pre-wrap}
.susp .apelado{background:var(--card);border-radius:10px;padding:9px 12px}
.susp .apelado b{font-family:inherit;font-size:inherit;color:var(--fg)}
.apelar summary{cursor:pointer;font-weight:700;color:var(--accent)}
.apelar textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:8px;margin:8px 0}
.avisar{gap:10px}

.sub-t{font-family:var(--f-display);font-size:14px}
.cb{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.cb-cab{display:flex;justify-content:space-between;align-items:center;gap:6px}
.cb textarea,.cb input{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:8px;padding:7px 9px;width:100%}
.dz-est{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dz-est button{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--card);color:var(--fg);display:flex;align-items:center}
.dz-est button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.dz-lista{display:flex;flex-direction:column;gap:6px}
.dz-fila{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.dz-fila.vacia{opacity:.6}
.dz-n{flex:1 1 120px;font-size:13.5px}
.dz-tams{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dz-tams button{font:inherit;font-size:12px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 8px;cursor:pointer}
.dz-tams button:last-child{border-right:0}
.dz-tams button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:700}
.dz-ico{display:inline-block;width:26px;height:18px;border:1.5px solid currentColor;border-radius:4px;margin-right:6px;vertical-align:-4px;position:relative}
.dz-ico.col::after{content:"";position:absolute;inset:3px 7px;background:currentColor;opacity:.35;border-radius:2px}
.dz-ico.pan::before,.dz-ico.pan::after{content:"";position:absolute;top:3px;bottom:3px;background:currentColor;opacity:.35;border-radius:2px}
.dz-ico.pan::before{left:3px;width:9px}.dz-ico.pan::after{right:3px;width:7px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:420px){.dos{grid-template-columns:1fr}}
.check.exp{align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.45}
.check.exp input{margin-top:3px}
</style>
</head>
<body data-vista="editar">
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="fx-empty">Cargando…</div></main>
</div>
<dialog id="dlg-pub"><div class="dlg" id="dlg-pub-c"></div></dialog>
<dialog id="dlg-comp"><div class="dlg" id="dlg-comp-c"></div></dialog>
<script type="module">
import { sb, $, esc, toast, hace, navApp, espacio, accesoProyecto, conSesion, plan, editable, limite, MAS_PRONTO, activarAvisame, proximamente, ayudaImagenes, probarImagen } from "../../js/forja.js";
import { pintarVitrina, normal, paraPublicar, nuevaVitrina, detectar, okUrl, okColor, uid, yt, TONOS, ACENTO_TIPO, CSS_VITRINA, SEGUIR_TEXTOS, LIM, esPago, cuentaPagos, normalRecompensas, ENVIOS, MAX_TIERS, BLOQUES, SECCIONES_VT, TAMANOS } from "../../js/vitrina.js";
import { MODOS } from "../../js/pizarra.js";
import { pista } from "../../js/ayuda.js";
document.head.insertAdjacentHTML("beforeend", "<style>" + CSS_VITRINA + "</style>");
navApp("proyectos");
const ID = new URLSearchParams(location.search).get("p");
const CANDADO = '<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M5 7V5a3 3 0 0 1 6 0v2h.5A1.5 1.5 0 0 1 13 8.5v5A1.5 1.5 0 0 1 11.5 15h-7A1.5 1.5 0 0 1 3 13.5v-5A1.5 1.5 0 0 1 4.5 7H5Zm1.5 0h3V5a1.5 1.5 0 0 0-3 0v2Z"/></svg>';
let EXP = false; // ¿aparece en Explorar?
let SEG = null; // { total, ultimo_envio, proximo, en_cola } de seguidores_de
let ACC = null, CAMP = null, ANOT = null, P, PL, RO, V, B, PUB = null, SECS = [], REFS = [], PIZ = [], NOTAS = [], abiertas = new Set(["portada"]), pendiente = false;
const hoy = () => new Date().toISOString().slice(0, 10);
// Comparar contenido sin importar el orden de las claves (la base las reordena).
const canon = (o) => JSON.stringify(o, (k, v) => (v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map((x) => [x, v[x]])) : v));
const palabrasDe = (t) => (String(t || "").trim().match(/\S+/g) || []).length;
const urlPublica = () => new URL("../../vitrina/?v=" + V.slug, location.href).href;
const slugify = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50).replace(/-+$/, "");
try { abiertas = new Set(JSON.parse(localStorage.getItem("forja-vt-abiertas") || '["portada"]')); } catch (e) {}

if (!/^[0-9a-f-]{36}$/.test(ID || "")) location.replace("../../proyectos/");
else conSesion($("app"), async () => {
  // En un equipo: quien edita prepara el borrador; publicar hacia afuera es de quien administra.
  ACC = await accesoProyecto(ID);
  if (!ACC || (ACC.areas || {}).vitrina !== "editar") { $("app").innerHTML = '<a class="vol" href="../../proyecto/?p=' + ID + '">← Volver al proyecto</a><div class="fx-empty">' + (ACC ? "Puedes ver este proyecto, pero no editar su vitrina." : "Este proyecto no existe o no tienes acceso a él.") + "</div>"; return; }
  const ESP = ACC.espacio;
  PL = { mas: !!ACC.mas };
  const ac = await sb.from("proyectos").select("id", { count: "exact", head: true }).eq("espacio_id", ESP).neq("estado", "archivado");
  const [pr, se, re, pz, no, vi] = await Promise.all([
    sb.from("proyectos").select("*").eq("id", ID).maybeSingle(),
    sb.from("secciones").select("id,titulo,texto,orden").eq("proyecto_id", ID).order("orden"),
    sb.from("referentes").select("*").eq("proyecto_id", ID).neq("tipo", "obra").order("creado_en", { ascending: false }), // las obras analizadas no van a la galería
    sb.from("pizarras").select("id,nombre,modo,datos,creado_en").eq("proyecto_id", ID).order("creado_en"),
    sb.from("notas").select("id,texto,creado_en").eq("proyecto_id", ID).order("creado_en", { ascending: false }),
    sb.from("vitrinas").select("*").eq("proyecto_id", ID).maybeSingle(),
  ]);
  P = pr.data;
  if (!P) { $("app").innerHTML = '<a class="vol" href="../../proyectos/">← Proyectos</a><div class="fx-empty">Este proyecto no existe o no es tuyo.</div>'; return; }
  SECS = se.data || []; REFS = re.data || []; PIZ = pz.data || []; NOTAS = no.data || [];
  RO = !editable(P, ac.count || 0, PL);
  V = vi.data;
  if (!V) V = await crear(ESP);
  if (!V) return;
  B = normal(Object.keys(V.borrador || {}).length ? V.borrador : nuevaVitrina(P));
  if (V.suspendida) { const r = await sb.from("mensajes").select("id").eq("tipo", "apelacion").eq("vitrina_id", V.id).eq("estado", "abierto").limit(1); APELADA = !!(r.data && r.data.length); }
  if (V.publicada && !V.suspendida) { const r = await sb.from("vitrinas_publicadas").select("datos,publicado_en,en_explorar").eq("slug", V.slug).maybeSingle(); PUB = r.data ? r.data.datos : null; EXP = !!(r.data && r.data.en_explorar); }
  const sg = await sb.rpc("seguidores_de", { v: V.id }); SEG = sg.data || { total: 0 };

  panel.querySelectorAll("details.sec").forEach((d) => d.addEventListener("toggle", () => { d.open ? abiertas.add(d.dataset.sec) : abiertas.delete(d.dataset.sec); try { localStorage.setItem("forja-vt-abiertas", JSON.stringify([...abiertas])); } catch (e) {} }));
  panel.querySelectorAll("[data-f]").forEach((i) => i.oninput = () => { B[i.dataset.f] = i.value; cambio(); });
  const pu = panel.querySelector('[data-portada="url"]');
  if (pu) pu.onchange = () => { const u = pu.value.trim(); if (u) probarImagen(u, $("pp-prueba")); if (u && !okUrl(u)) { toast("La imagen debe ser un enlace que empiece con https://"); return; } B.portada = u ? { url: u, foco: B.portada ? B.portada.foco : 50 } : null; cambio(true); };
  panel.querySelectorAll("[data-portada-ref]").forEach((b) => b.onclick = () => { B.portada = { url: b.dataset.portadaRef, foco: B.portada ? B.portada.foco : 50 }; cambio(true); });
  const foco = panel.querySelector('[data-portada="foco"]'); if (foco) foco.oninput = () => { B.portada.foco = +foco.value; cambio(); };
  const qp = panel.querySelector('[data-portada="quitar"]'); if (qp) qp.onclick = () => { B.portada = null; cambio(true); };
  panel.querySelectorAll("[data-tono]").forEach((b) => b.onclick = () => { B.tono = b.dataset.tono; cambio(true); });
  panel.querySelectorAll("[data-acento]").forEach((b) => b.onclick = () => { B.acento = b.dataset.acento; cambio(true); });
  const al = panel.querySelector("[data-acento-libre]"); if (al) al.onchange = () => { B.acento = al.value.toLowerCase(); cambio(true); };
  panel.querySelectorAll("[data-abrir]").forEach((b) => b.onclick = () => { const s = $(b.dataset.abrir); s.hidden = !s.hidden; b.setAttribute("aria-expanded", String(!s.hidden)); });

  panel.querySelectorAll("[data-bloque]").forEach((el) => { const h = B.historia.find((x) => x.id === el.dataset.bloque); el.querySelectorAll("[data-h]").forEach((i) => i.oninput = () => { h[i.dataset.h] = i.value; cambio(); }); });
  panel.querySelectorAll("[data-traer-sec]").forEach((b) => b.onclick = () => { const s = SECS.find((x) => x.id === b.dataset.traerSec); B.historia.push({ id: uid(), titulo: s.titulo, texto: s.texto || "", de: s.id }); abiertas.add("historia"); cambio(true); toast("«" + s.titulo + "» copiado. Puedes editarlo aquí."); });
  panel.querySelectorAll("[data-recopiar]").forEach((b) => b.onclick = () => {
    const h = B.historia.find((x) => x.id === b.dataset.recopiar), s = SECS.find((x) => x.id === h.de);
    if (b.dataset.seguro !== "1") { b.dataset.seguro = "1"; b.textContent = "¿Reemplazar lo que editaste aquí? Toca de nuevo"; return; }

  });
  // galería
  panel.querySelectorAll("[data-g]").forEach((i) => i.oninput = () => { const g = B.galeria.find((x) => x.id === i.dataset.id); g[i.dataset.g] = i.value; cambio(); });
  const tr = $("b-traer-refs"); if (tr) tr.onclick = () => {
    const marcadas = [...panel.querySelectorAll("[data-ref]:checked:not(:disabled)")].map((c) => REFS.find((r) => r.id === c.dataset.ref));
    if (!marcadas.length) { toast("Marca al menos un referente."); return; }
    marcadas.forEach((r) => B.galeria.push({ id: uid(), tipo: r.tipo, valor: r.tipo === "color" ? String(r.valor).toLowerCase() : r.valor, titulo: r.tipo === "enlace" ? r.titulo || "" : r.titulo || "", nota: r.nota || "", de: r.id }));

  };

    const v = $("g-nuevo").value.trim(), d = detectar(v);
    if (!d) { toast(v ? "Pega un enlace que empiece con https:// o un color como #2a9d8f" : "Pega un enlace o un color."); return; }
    B.galeria.push({ id: uid(), ...d, titulo: "", nota: "" }); cambio(true);
  };
  // mundo
  panel.querySelectorAll("[data-z]").forEach((i) => i.oninput = () => { B.pizarras.find((x) => x.id === i.dataset.id).nombre = i.value; cambio(); });
  panel.querySelectorAll("[data-solo]").forEach((c) => c.onchange = () => { B.pizarras.find((x) => x.id === c.dataset.solo).soloTitulos = c.checked; cambio(); });
  panel.querySelectorAll("[data-ocultar]").forEach((b) => b.onclick = () => {
    const [zid, tid] = b.dataset.ocultar.split(":"), z = B.pizarras.find((x) => x.id === zid), s = new Set(z.ocultas);

  });
  panel.querySelectorAll("[data-retomar]").forEach((b) => b.onclick = () => { const z = B.pizarras.find((x) => x.id === b.dataset.retomar), o = PIZ.find((x) => x.id === z.id); z.datos = JSON.parse(JSON.stringify(o.datos || {})); z.modo = o.modo; z.tomada = hoy(); cambio(true); toast("Copia actualizada con la pizarra de hoy"); });
  const zn = $("z-nueva"); if (zn) zn.onchange = () => { const o = PIZ.find((x) => x.id === zn.value); if (!o) return; B.pizarras.push({ id: o.id, nombre: o.nombre, modo: o.modo, soloTitulos: false, ocultas: [], datos: JSON.parse(JSON.stringify(o.datos || {})), tomada: hoy() }); cambio(true); };
  // novedades y enlaces
  panel.querySelectorAll("[data-n]").forEach((i) => i.oninput = () => { B.novedades.find((x) => x.id === i.dataset.id)[i.dataset.n] = i.value; cambio(); });
  panel.querySelectorAll("[data-nota]").forEach((b) => b.onclick = () => { const nt = NOTAS.find((x) => x.id === b.dataset.nota), l = String(nt.texto).split("\n"); B.novedades.unshift({ id: uid(), fecha: String(nt.creado_en).slice(0, 10), titulo: l[0].slice(0, 120), texto: l.slice(1).join("\n").trim() }); cambio(true); toast("Copiada como borrador de novedad: revísala antes de publicar."); });
  panel.querySelectorAll("[data-e]").forEach((i) => { i.oninput = () => { B.enlaces.find((x) => x.id === i.dataset.id)[i.dataset.e] = i.value; cambio(); }; if (i.dataset.e === "url") i.onchange = () => pintarPanel(); });
  panel.querySelectorAll("[data-nuevo]").forEach((b) => b.onclick = () => {
    const k = b.dataset.nuevo;
    if (k === "historia") B.historia.push({ id: uid(), titulo: "", texto: "" });
    if (k === "novedades") B.novedades.unshift({ id: uid(), fecha: hoy(), titulo: "", texto: "" });
    if (k === "enlaces") B.enlaces.push({ id: uid(), nombre: "", url: "" });
    cambio(true);
    requestAnimationFrame(() => { const s = $("panel").querySelector('[data-sec="' + k + '"]'), i = k === "novedades" ? s.querySelector("[data-n=titulo]") : k === "enlaces" ? [...s.querySelectorAll("[data-e=nombre]")].pop() : [...s.querySelectorAll("[data-h=titulo]")].pop(); if (i) i.focus(); });
  });
  panel.querySelectorAll("[data-mover]").forEach((b) => b.onclick = () => { const [k, id, d] = b.dataset.mover.split(":"), l = lista(k), i = l.findIndex((x) => x.id === id), j = i + +d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; cambio(true); });
  panel.querySelectorAll("[data-quitar]").forEach((b) => b.onclick = () => { const [k, id] = b.dataset.quitar.split(":"); B[k] = B[k].filter((x) => x.id !== id); cambio(true); });
  // dirección y publicación
  $("b-slug").onclick = cambiarSlug;
  $("slug").onkeydown = (e) => { if (e.key === "Enter") cambiarSlug(); };
  const an = $("b-anterior"); if (an) an.onclick = () => {
    if (an.dataset.seguro !== "1") { an.dataset.seguro = "1"; an.textContent = "¿Reemplazar el borrador actual? Toca de nuevo"; return; }
    const pizarras = B.pizarras; B = normal(V.anterior); if (!B.pizarras.length) B.pizarras = pizarras; cambio(true); toast("Versión anterior cargada en el borrador. Revísala y publica si quieres volver a ella.");
  };
  const dp = $("b-despub"); if (dp) dp.onclick = async () => {
    if (dp.dataset.seguro !== "1") { dp.dataset.seguro = "1"; dp.textContent = "Sí, despublicar"; return; }
    const { error } = await sb.rpc("despublicar_vitrina", { v: V.id });
    if (error) { toast(limite(error) || "No se pudo despublicar."); return; }
    V.anterior = PUB; PUB = null; V.publicada = false; pintarEstado(); pintarPanel(); toast("Vitrina despublicada. El borrador sigue aquí.");
  };
  // seguidores
  panel.querySelectorAll("[data-seg]").forEach((i) => i.onchange = () => { B.seguir[i.dataset.seg] = i.type === "checkbox" ? i.checked : i.value; cambio(true); });
  const av = $("av-b"); if (av) av.onclick = async () => {
    const titulo = $("av-t").value.trim(), texto = $("av-x").value.trim();
    if (titulo.length < 3 || texto.length < 10) { toast("Escribe un título y un mensaje."); return; }
    if (av.dataset.seguro !== "1") { av.dataset.seguro = "1"; av.textContent = "¿Enviar ahora? Toca de nuevo"; return; }
    av.disabled = true;
    const { data, error } = await sb.rpc("avisar_seguidores", { v: V.id, titulo, texto });
    if (error) { toast(limite(error) || "No se pudo enviar."); av.disabled = false; av.dataset.seguro = ""; av.textContent = "Enviar"; return; }
    const sg = await sb.rpc("seguidores_de", { v: V.id }); SEG = sg.data || SEG; pintarPanel();
    toast(data.destinatarios ? "Listo: el aviso va en camino a " + data.destinatarios + (data.destinatarios === 1 ? " persona." : " personas.") : "Listo. Ninguno de tus seguidores recibe avisos por correo por ahora.");
  };
  activarAvisame(panel);
}
async function cambiarSlug() {
  const v = $("slug").value.trim().toLowerCase(), msg = $("slug-msg");
  if (v === V.slug) { msg.textContent = "Esa ya es su dirección."; return; }
  if (!/^[a-z0-9][a-z0-9-]{1,58}[a-z0-9]$/.test(v)) { msg.textContent = "Usa de 3 a 60 caracteres: minúsculas, números y guiones (sin empezar ni terminar con guion)."; msg.style.color = "var(--bad)"; return; }
  const { error } = await sb.from("vitrinas").update({ slug: v }).eq("id", V.id);
  if (error) { msg.textContent = /duplicate|unique|23505/i.test(error.message + (error.code || "")) ? "Esa dirección ya la usa otra vitrina." : "No se pudo cambiar la dirección."; msg.style.color = "var(--bad)"; return; }
  V.slug = v; msg.style.color = ""; msg.textContent = PUB ? "Listo. El enlace anterior ya no funciona: compártelo de nuevo." : "Dirección cambiada."; pintarEstado();
}

/* ---------- publicar y compartir ---------- */
// Suspendida por moderación: se explica el motivo y se puede apelar (una persona lo revisa).
const MOTIVO_TXT = { estafa: "posible estafa o engaño", ofensivo: "contenido ofensivo, de odio o violento", derechos: "uso de obras o marcas ajenas sin permiso", datos: "datos personales de otras personas", menores: "contenido que pone en riesgo a menores de edad", spam: "spam o publicidad engañosa", otro: "incumplimiento de las normas de la comunidad" };
let APELADA = false;
const APELADA_HTML = '<p class="apelado"><b>Apelación enviada.</b> Una persona la está revisando; te responderemos en Forja (Mi cuenta → Avisos).</p>';
function suspensionHTML() {
  const s = V.suspension || {};
  return '<div class="susp" role="alert"><b>Esta vitrina está suspendida</b><p>Motivo: ' + esc(MOTIVO_TXT[s.motivo] || MOTIVO_TXT.otro) + (s.en ? " · desde el " + esc(String(s.en).slice(0, 10).split("-").reverse().join("-")) : "") + "</p>" +
    (s.mensaje ? '<blockquote>' + esc(s.mensaje) + "</blockquote>" : "") +
    '<p>Tu proyecto y este borrador siguen intactos; solo dejó de verse en público. Puedes corregir lo necesario y apelar: una persona revisará tu caso. Lee las <a href="../../normas/#apelar" target="_blank" rel="noopener">normas sobre apelaciones</a>.</p>' +
    (APELADA ? APELADA_HTML : '<details class="apelar"><summary>Apelar esta decisión</summary><textarea id="ap-t" maxlength="3000" rows="4" placeholder="Cuéntanos por qué crees que es un error o qué cambiaste."></textarea><button type="button" class="btn prim chico" id="ap-b">Enviar apelación</button></details>') + "</div>";
}
async function apelar() {
  const t = $("ap-t").value.trim(); if (t.length < 5) { toast("Escribe un poco más para que podamos entender tu caso."); return; }
  $("ap-b").disabled = true;
  const { error } = await sb.from("mensajes").insert({ tipo: "apelacion", vitrina_id: V.id, texto: t });
  if (error) { $("ap-b").disabled = false; toast(limite(error) || "No se pudo enviar la apelación."); return; }
  APELADA = true; $("ap-t").closest("details").outerHTML = APELADA_HTML;
}
function abrirPublicar() {
  const d = paraPublicar(B, PL), n = (x, s, p) => x ? "<span>" + x + " " + (x === 1 ? s : p) + "</span>" : "";
  const fotos = d.galeria.length, quitadas = !PL.mas && B.pizarras.length;
  $("dlg-pub-c").innerHTML = "<h2>" + (PUB ? "Publicar los cambios" : "Publicar la vitrina") + "</h2>" +
    "<p>Lo que publiques lo puede ver <b>cualquier persona con el enlace</b>. Tu Taller, tu bitácora y tus pizarras siguen privados: solo se muestra lo que está en esta vitrina.</p>" +
    '<div class="resumen"><span>Portada' + (d.portada ? " con imagen" : "") + "</span>" + n(d.historia.length, "capítulo", "capítulos") + n(fotos, "pieza en la galería", "piezas en la galería") + n(d.pizarras.length, "pizarra", "pizarras") + n(d.novedades.length, "novedad", "novedades") + n(d.enlaces.length, "enlace", "enlaces") + "</div>" +
    (quitadas ? '<p class="aviso">Las pizarras no se incluyen en el plan gratis.</p>' : "") +
    (!d.historia.length && !fotos && !d.novedades.length ? '<p class="aviso">La vitrina está casi vacía: considera agregar la historia o algunas imágenes antes de compartirla.</p>' : "") +
    '<p class="ayuda" style="margin:0;font-size:13px;color:var(--muted)">Dirección: ' + esc(urlPublica()) + "</p>" +
    (V.fuera_de_explorar ? '<p class="aviso">La moderación sacó esta vitrina de Explorar: sigue visible para quien tenga el enlace.</p>'
      : '<label class="check exp"><input type="checkbox" id="pub-exp"' + (V.listar ? " checked" : "") + '> <span><b>Mostrar en Explorar</b>, el directorio público de proyectos de Forja. Requiere una cuenta con al menos 3 días, título y una historia con algo de texto (unas 40 palabras), y respetar las <a href="../../normas/" target="_blank" rel="noopener">normas</a>.</span></label>') +
    '<div class="dlg-pie"><button type="button" class="btn" id="pub-no">Cancelar</button><button type="button" class="btn prim" id="pub-si">Publicar ahora</button></div>';
  $("dlg-pub").showModal();
  $("pub-no").onclick = () => $("dlg-pub").close();
  $("pub-si").onclick = async () => {
    $("pub-si").disabled = true;
    if (pendiente) await guardar();
    const listar = !!($("pub-exp") && $("pub-exp").checked);
    const { data: res, error } = await sb.rpc("publicar_vitrina", { v: V.id, datos: d, listar });
    $("dlg-pub").close();
    if (error) { toast(limite(error) || "No se pudo publicar. Revisa tu conexión."); return; }
    const primera = !PUB; V.anterior = PUB || V.anterior; PUB = d; V.publicada = true; V.listar = listar; EXP = !!(res && res.en_explorar);
    const FALTA = { cuenta_nueva: "Tu cuenta tiene menos de 3 días: podrás aparecer en Explorar pronto, publicando de nuevo.", normas: "Para aparecer en Explorar, acepta las normas de la comunidad.", contenido: "Para aparecer en Explorar, agrega un título y una historia con algo más de texto.", moderacion: "La moderación sacó esta vitrina de Explorar." };
    pintarEstado(); pintarPanel(); toast((primera ? "¡Tu vitrina está publicada!" : "Cambios publicados") + (listar && res && res.falta ? " " + (FALTA[res.falta] || "") : listar && EXP ? " Ya aparece en Explorar." : ""));
    if (primera) abrirCompartir();
  };
}
function abrirCompartir() {
  const u = urlPublica();
  $("dlg-comp-c").innerHTML = "<h2>Compartir la vitrina</h2>" +
    (PUB ? "" : '<p class="aviso">Todavía no está publicada: el enlace mostrará "no está publicada" hasta que publiques.</p>') +
    '<div class="enlace-pub"><input id="comp-url" readonly value="' + esc(u) + '" aria-label="Enlace de la vitrina"><button type="button" class="btn" id="comp-copiar">Copiar</button></div>' +
    '<div class="qr"><div class="qr-img" id="qr">Generando QR…</div><div style="display:flex;flex-direction:column;gap:8px"><b style="font-family:var(--f-display)">Código QR</b><span class="ayuda" style="font-size:13px;color:var(--muted);max-width:26ch">Para imprimir en tu stand, tus cartas o tu tarjeta en ferias.</span><span class="fila"><button type="button" class="btn chico" id="qr-png" disabled>Descargar PNG</button><button type="button" class="btn chico" id="qr-svg" disabled>SVG</button></span></div></div>' +
    '<div class="dlg-pie">' + (PUB ? '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener">Abrir la vitrina ↗</a>' : "") + '<button type="button" class="btn prim" id="comp-ok">Listo</button></div>';
  $("dlg-comp").showModal();
  $("comp-ok").onclick = () => $("dlg-comp").close();
  $("comp-copiar").onclick = async () => { try { await navigator.clipboard.writeText(u); toast("Enlace copiado"); } catch (e) { $("comp-url").select(); toast("Selecciónalo y cópialo"); } };
  hacerQR(u);
}
function cargarQR() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  return new Promise((ok, mal) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; s.onload = () => (window.qrcode ? ok(window.qrcode) : mal()); s.onerror = mal; document.head.appendChild(s); });
}
async function hacerQR(u) {
  try {
    const qrcode = await cargarQR(), q = qrcode(0, "M"); q.addData(u); q.make();
    const svg = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    $("qr").innerHTML = svg;
    const nombre = "vitrina-" + V.slug;
    $("qr-svg").disabled = false; $("qr-png").disabled = false;
    $("qr-svg").onclick = () => bajar(new Blob([svg], { type: "image/svg+xml" }), nombre + ".svg");
    $("qr-png").onclick = () => {
      const n = q.getModuleCount() + 4, k = Math.ceil(1024 / n), c = document.createElement("canvas"); c.width = c.height = n * k;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.fillStyle = "#000";
      for (let r = 0; r < q.getModuleCount(); r++) for (let cc = 0; cc < q.getModuleCount(); cc++) if (q.isDark(r, cc)) x.fillRect((cc + 2) * k, (r + 2) * k, k, k);
      c.toBlob((b) => bajar(b, nombre + ".png"));
    };
  } catch (e) { $("qr").textContent = "No se pudo generar el QR ahora. Revisa tu conexión."; }
}
function bajar(blob, nombre) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
</script>
