<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Cotizaciones</title>
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: cotizaciones — una tarjeta por proyecto con sus piezas; los proyectos sin cotizar, como tarjetas punteadas para empezar */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0}
h2{font-family:var(--f-display);font-size:19px;margin:28px 0 10px}
.lead{margin:6px 0 0;color:var(--muted);max-width:62ch}
:where(button,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:18px}
.cot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:7px;border-top:4px solid var(--tc)}
.cot:hover{border-color:var(--tc)}
.cot h3{font-family:var(--f-display);font-size:17px;margin:0;line-height:1.2}
.cot .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--tc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--field);border:1px solid var(--line)}
.chips span.ok{border-color:var(--good);background:var(--good-soft)}
.cot small{color:var(--muted);font-size:12px;margin-top:auto}
.nueva{font:inherit;text-align:left;cursor:pointer;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.nueva b{color:var(--fg);font-family:var(--f-display);font-size:16px}
.nueva:hover{border-color:var(--accent);color:var(--accent)}
.vacio{border:1.5px dashed var(--line);border-radius:16px;padding:28px 22px;color:var(--muted);text-align:center;margin-top:18px}
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main id="app"><div class="fx-empty">Cargando…</div></main>
</div>
<script type="module">
import { sb, $, esc, toast, hace, navApp, espacio, conSesion, limite, proximamente, activarAvisame } from "../js/forja.js";
import { TIPOS, tc } from "../js/guias.js";
import { funcion } from "../js/planes.js";
navApp("cotizaciones");

conSesion($("app"), async () => {
  const ESP = await espacio();
  const [p, c] = await Promise.all([
    sb.from("proyectos").select("id,nombre,tipo,estado").eq("espacio_id", ESP).order("nombre"),
    sb.from("cotizaciones").select("id,nombre,proyecto_id,datos,actualizado_en").eq("espacio_id", ESP).order("actualizado_en", { ascending: false }),
  ]);
  if (p.error || c.error) throw p.error || c.error;
  const PROYS = p.data || [], COTS = c.data || [];
  const sin = PROYS.filter((x) => x.estado !== "archivado" && !COTS.some((k) => k.proyecto_id === x.id));
  const tarjeta = (k) => {
    const pr = PROYS.find((x) => x.id === k.proyecto_id), d = k.datos || {}, comps = d.componentes || [], qs = d.cotizaciones || [];
    return '<a class="cot" href="../cotizador/?c=' + k.id + '" style="--tc:' + (pr ? tc(pr.tipo) : "var(--line)") + '">' +
      '<span class="k">' + (pr ? esc(TIPOS[pr.tipo]) : "Sin proyecto") + "</span><h3>" + esc(pr ? pr.nombre : k.nombre) + "</h3>" +
      (comps.length ? '<div class="chips">' + comps.slice(0, 6).map((x) => '<span class="' + (qs.some((q) => q.compId === x.id) ? "ok" : "") + '">' + esc(x.nombre) + "</span>").join("") + (comps.length > 6 ? "<span>+" + (comps.length - 6) + "</span>" : "") + "</div>" : '<span style="font-size:13px;color:var(--muted)">Sin piezas todavía</span>') +
      "<small>" + qs.length + (qs.length === 1 ? " precio de proveedor" : " precios de proveedores") + " · " + hace(k.actualizado_en) + "</small></a>";
  };
  const fv = funcion("versiones-precio"), fc = funcion("campanas"), ff = funcion("presupuesto-fondos");
  $("app").innerHTML =
    '<header><h1>Cotizaciones</h1><p class="lead">Una por proyecto: lo que cuesta producirlo pieza por pieza y a cuánto venderlo. Las piezas en verde ya tienen precio.</p></header>' +
    (COTS.length || sin.length ? '<div class="cots">' + COTS.map(tarjeta).join("") +
      sin.map((x) => '<button type="button" class="nueva" data-p="' + x.id + '"><span>' + esc(TIPOS[x.tipo]) + "</span><b>" + esc(x.nombre) + "</b><span>+ Crear su cotización</span></button>").join("") + "</div>"
      : '<div class="vacio">Aún no tienes proyectos. Planta uno en <a href="../proyectos/">Proyectos</a> y aquí aparecerá su cotización.</div>') +
    '<h2>Próximamente</h2><div class="extras">' + [fv, fc, ff].map((f) => proximamente(f.k, f.t, f.d, true)).join("") + "</div>";
  activarAvisame($("app"));
  $("app").querySelectorAll("[data-p]").forEach((b) => b.onclick = async () => {
    const pr = PROYS.find((x) => x.id === b.dataset.p);
    const { data, error } = await sb.from("cotizaciones").insert({ espacio_id: ESP, proyecto_id: pr.id, nombre: pr.nombre, datos: {} }).select("id").single();
    if (error) { toast(limite(error) || "No se pudo crear la cotización."); return; }
    location.href = "../cotizador/?c=" + data.id;
  });
});
</script>
</body>
</html>
