<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tus correos · Forja</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2a3fd1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: darse de baja — una sola tarjeta centrada con la pregunta y un botón; sin entrar a la cuenta */
body{font-size:16px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:24px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.carta{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,5vw,36px);display:flex;flex-direction:column;gap:12px}
.carta h1{font-family:var(--f-display);font-size:clamp(26px,5vw,34px);line-height:1.1;margin:0}
.carta p{margin:0;color:var(--muted);max-width:56ch}
.acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.acc button,.acc a{font:inherit;font-size:15px;border-radius:12px;padding:10px 18px;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.acc .si{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.acc button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main class="carta" id="c"><p>Cargando…</p></main>
</div>
<script type="module">
import { sb, $, esc, nav } from "../js/forja.js";
nav(null);
// Se pide confirmar con un botón: algunos programas de correo abren los enlaces solos para revisarlos,
// y no queremos dar de baja a nadie por eso.
const q = new URLSearchParams(location.search), t = q.get("t") || "", que = q.get("q") || "", slug = (q.get("v") || "").toLowerCase();
const QUE = {
  boletin: ["Dejar de recibir el boletín", "Ya no te llegará el boletín de Forja.", "Seguirás recibiendo los avisos de herramientas que pediste y de los proyectos que sigues, si los tienes activos."],
  funciones: ["Dejar de recibir avisos de herramientas", "Ya no te avisaremos cuando estén listas las herramientas en que tocaste «Avísame».", ""],
  vitrinas: ["Dejar de recibir avisos de proyectos", "Ya no te llegarán correos de los proyectos que sigues. Sigues siguiéndolos en Forja.", ""],
  seguir: ["Dejar de seguir este proyecto", "Dejaste de seguir este proyecto y no te llegarán más sus avisos.", ""],
  todo: ["No recibir ningún correo de Forja", "Ya no te llegará ningún correo de Forja, salvo los que pidas para entrar a tu cuenta.", ""],
};
const c = $("c");
if (!/^[0-9a-f-]{36}$/i.test(t) || !QUE[que] || (que === "seguir" && !slug)) {
  c.innerHTML = '<h1>Este enlace no está completo</h1><p>Puedes elegir qué correos recibir desde <a href="../cuenta/#correos">Mi cuenta</a>.</p>';
} else {
  const [titulo, hecho, extra] = QUE[que];
  c.innerHTML = "<h1>" + titulo + "</h1><p>" + (que === "seguir" ? "Toca el botón para confirmar." : "Toca el botón para confirmar. Puedes volver a activarlo cuando quieras desde Mi cuenta.") + '</p><div class="acc"><button type="button" class="si" id="si">Confirmar</button>' +
    (que !== "todo" ? '<button type="button" id="todo">No quiero ningún correo de Forja</button>' : "") + "</div>";
  const hacer = async (cual) => {
    c.querySelectorAll("button").forEach((b) => b.disabled = true);
    const { data, error } = await sb.rpc("baja_correo", { t, que: cual, slug: cual === "seguir" ? slug : null });
    if (error) { c.innerHTML = '<h1>No pudimos hacerlo</h1><p>El enlace puede ser antiguo. Elige qué correos recibir desde <a href="../cuenta/#correos">Mi cuenta</a>.</p>'; return; }
    const [, listo, mas] = QUE[cual];
    c.innerHTML = "<h1>Listo</h1><p>" + (cual === "seguir" && data && data.titulo ? "Dejaste de seguir <b>" + esc(data.titulo) + "</b>. No te llegarán más sus avisos." : listo) + "</p>" + (mas ? "<p>" + mas + "</p>" : "") +
      '<div class="acc"><a href="../cuenta/#correos">Ver mis correos en Mi cuenta</a></div>';
  };
  $("si").onclick = () => hacer(que);
  const td = $("todo"); if (td) td.onclick = () => hacer("todo");
}
</script>
</body>
</html>
