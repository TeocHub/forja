<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forja · Entrar</title>
<meta name="description" content="Entra a Forja con tu correo, sin contraseña.">
<meta name="theme-color" content="#F4F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@100..125,500..900&family=Atkinson+Hyperlegible:wght@400;700&family=Geist+Mono:wght@400..700&display=swap">
<link rel="stylesheet" href="../css/forja.css">
<style>
/* Layout: puerta de entrada — el formulario del correo y, al lado, una sola pieza grande: la F-regla, que se va llenando mientras escribes el correo */
body{font-size:17px;line-height:1.55;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.puerta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:36px 56px;align-items:center;margin-top:min(8vh,64px)}
#caja .fx-entrada{max-width:none;padding:clamp(20px,3vw,32px)}
.pieza{display:flex;flex-direction:column;align-items:center;gap:14px;--f-hueco:var(--bg)}
.pieza .fx-f{width:min(320px,100%);height:auto;aspect-ratio:56/50}
.pieza p{margin:0;font-size:15px;color:var(--muted);text-align:center;max-width:30ch;min-height:3em}
.pieza p b{color:var(--fg)}
/* en tablet angosta y celular, la F va arriba y más chica, para que el teclado no tape el campo */
@media (max-width:780px){.puerta{grid-template-columns:minmax(0,1fr);gap:16px;margin-top:8px}.pieza{order:-1;flex-direction:row;align-items:center;gap:14px}.pieza .fx-f{width:96px}.pieza p{text-align:left;min-height:0}}
</style>
</head>
<body>
<div class="wrap">
  <header><nav data-forja-nav></nav></header>
  <main class="puerta">
    <div id="caja"></div>
    <div class="pieza" aria-hidden="true"><div id="f"></div><p id="f-t"></p></div>
  </main>
</div>
<script type="module">
import { sb, $, nav, pintarEntrada, u, fAvance } from "../js/forja.js";
nav("entrar");
// Solo se vuelve a páginas de Forja (nunca a otro sitio): una carpeta propia, con su ?… o #… (p. ej. proyecto/?p=…#taller).
// Los enlaces viejos con .html (proyecto.html?p=…) se traducen a la dirección nueva.
const VIEJAS = { "vitrina-editor": "vitrina/editar" };
const pedido = (new URLSearchParams(location.search).get("siguiente") || "").replace(/^([a-z-]+)\.html/i, (m, n) => (VIEJAS[n] || n) + "/");
const destino = /^[a-z-]+(\/[a-z-]+)*\/([?#][\w=&#.%-]*)?$/i.test(pedido) && !pedido.startsWith("entrar") ? u(pedido) : u("proyectos/");
const ir = () => location.replace(destino);
const { data } = await sb.auth.getSession();
if (data.session) ir();
else {
  pintarEntrada($("caja"), "", { sinMarca: true });
  // La F-regla se llena mientras escribes el correo: una marca por cada paso hasta que es un correo de verdad; la chispa queda en el último.
  const TXT = ["Siete marcas, siete etapas. <b>Escribe tu correo</b> y la F se va llenando.", "Vas bien.", "Vas bien.", "Ahora la <b>@</b>.", "Falta el final, como <b>.cl</b> o <b>.com</b>.", "Falta el final, como <b>.cl</b> o <b>.com</b>.", "<b>Listo.</b> Toca «Enviarme el enlace»."];
  const pasos = (v) => {
    const [loc, dom] = v.split("@");
    if (!v) return -1;
    if (dom === undefined) return loc.length < 3 ? 0 : loc.length < 6 ? 1 : 2;
    if (!dom) return 3;
    if (!/\.[^.]{2,}$/.test(dom)) return dom.includes(".") ? 5 : 4;
    return $("fx-mail").checkValidity() ? 6 : 5;
  };
  const pintarF = () => { const n = pasos($("fx-mail").value.trim()); $("f").innerHTML = fAvance(n, 320); $("f-t").innerHTML = TXT[Math.max(n, 0)]; };
  $("fx-mail").addEventListener("input", pintarF);
  // Cuando el correo salió (el formulario se esconde), la F queda llena y dice qué hacer.
  new MutationObserver(() => { if ($("fx-f1").hidden) $("f-t").innerHTML = "<b>Revisa tu correo.</b> El enlace te deja dentro."; else pintarF(); }).observe($("fx-f1"), { attributes: true, attributeFilter: ["hidden"] });
  pintarF();
  sb.auth.onAuthStateChange((ev, ses) => { if (ses) ir(); });
}
</script>
</body>
</html>
